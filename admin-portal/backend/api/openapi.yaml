openapi: 3.0.4
info:
  title: Tidewise Admin Portal Service API
  version: 1.0.0
  description: Admin Portal BFF 的手写 REST + JSON 合同。
servers:
  - url: /
    description: 由运行环境注入 Admin Portal Service origin。
security:
  - AdminBearer: []
tags:
  - name: Operations
  - name: Admin data
  - name: AgentRun management
paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getAdminPortalHealth
      summary: Admin Portal Service 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [Operations]
      operationId: getAdminPortalReadiness
      summary: Admin Portal Service 就绪检查
      security: []
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/admin/v1/raw-documents:
    get:
      tags: [Admin data]
      operationId: listAdminPortalRawDocuments
      summary: 获取已接纳的轻量证据文档分页
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: source_ref
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/RawDocumentPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/events:
    get:
      tags: [Admin data]
      operationId: listAdminPortalEvents
      summary: 获取正式 Event 分页
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: event_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: fact_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FactStatus'
        - name: event_time_from
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: event_time_to
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_from
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_to
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
      responses:
        '200':
          $ref: '#/components/responses/EventPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/agent-schedules/{agent_key}:
    parameters:
      - $ref: '#/components/parameters/AgentKey'
    get:
      tags: [AgentRun management]
      operationId: getAdminPortalAgentSchedule
      summary: 获取 Agent 定时任务配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/AgentScheduleSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [AgentRun management]
      operationId: saveAdminPortalAgentSchedule
      summary: 保存 Agent 定时策略和输入配置
      description: 首次保存创建为停止状态；后续保存不改变启停状态。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentScheduleSaveInput'
      responses:
        '200':
          $ref: '#/components/responses/AgentScheduleSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [AgentRun management]
      operationId: setAdminPortalAgentScheduleEnabled
      summary: 独立启动或停止 Agent 定时任务
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentScheduleEnabledInput'
      responses:
        '200':
          $ref: '#/components/responses/AgentScheduleSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/agent-executions:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalCollectorExecutions
      summary: 获取 collector Agent 执行记录
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/AgentExecutionPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/model-providers:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalModelProviders
      summary: 获取已注册模型配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ModelProviderListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/model-providers/{provider_key}:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    get:
      tags: [AgentRun management]
      operationId: getAdminPortalModelProvider
      summary: 获取单个已注册模型配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ModelProviderSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [AgentRun management]
      operationId: updateAdminPortalModelProvider
      summary: 更新已注册模型配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProviderPatchInput'
      responses:
        '200':
          $ref: '#/components/responses/ModelProviderSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/connectors:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalConnectors
      summary: 获取已注册连接器配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/connectors/{connector_key}:
    parameters:
      - $ref: '#/components/parameters/ConnectorKey'
    get:
      tags: [AgentRun management]
      operationId: getAdminPortalConnector
      summary: 获取单个已注册连接器配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [AgentRun management]
      operationId: updateAdminPortalConnector
      summary: 更新已注册连接器配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorPatchInput'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque admin service token
      description: 由运行环境 secret 注入；Swagger UI 不保存或内置 token。
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失或不合法时由 Admin Portal Service 生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AgentKey:
      name: agent_key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        example: collector
    ProviderKey:
      name: provider_key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        example: deepseek
    ConnectorKey:
      name: connector_key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  headers:
    RequestID:
      required: true
      description: 与响应 body 中 request_id 一致。
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    RawDocumentPageSuccess:
      description: 轻量证据文档分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RawDocumentPageEnvelope'
    EventPageSuccess:
      description: Event 分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventPageEnvelope'
    AgentScheduleSuccess:
      description: Agent 定时任务配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentScheduleEnvelope'
    AgentExecutionPageSuccess:
      description: collector Agent 执行记录分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentExecutionPageEnvelope'
    ModelProviderListSuccess:
      description: 已注册模型配置列表
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelProviderListEnvelope'
    ModelProviderSuccess:
      description: 已更新模型配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelProviderEnvelope'
    ConnectorListSuccess:
      description: 已注册连接器配置列表
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorListEnvelope'
    ConnectorSuccess:
      description: 已更新连接器配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorEnvelope'
    BadRequest:
      description: 查询参数不合法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Admin bearer token 缺失或无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 调用来源不被允许
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: AgentRun 资源不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: AgentRun 拒绝冲突修改
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Admin Portal Service 内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Admin Portal Service 尚未完成运行配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    UTCTimestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp。
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        environment:
          type: string
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, checks]
      properties:
        status:
          type: string
          enum: [ready]
        service:
          type: string
        environment:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
    RawDocumentPageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/RawDocumentPage'
    EventPageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/EventPage'
    AgentScheduleEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/AgentSchedule'
    AgentExecutionPageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/AgentExecutionPage'
    ModelProviderListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ModelProviderList'
    ModelProviderEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ModelProviderConfiguration'
    ConnectorListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ConnectorList'
    ConnectorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ConnectorConfiguration'
    RawDocumentPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RawDocument'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    RawDocument:
      type: object
      additionalProperties: false
      required:
        - id
        - contract_version
        - ingest_channel
        - source_type
        - source_name
        - source_url
        - title
        - content_text
        - raw_object_uri
        - raw_mime_type
        - language
        - collected_at
        - ingest_status
        - content_sha256
      properties:
        id:
          type: string
        contract_version:
          type: integer
        artifact_id:
          type: string
        source_ref:
          type: string
        ingest_channel:
          type: string
        source_type:
          type: string
        source_name:
          type: string
        source_url:
          type: string
          format: uri
        source_external_id:
          type: string
        title:
          type: string
        content_text:
          type: string
        raw_object_uri:
          type: string
        raw_mime_type:
          type: string
        language:
          type: string
        published_at:
          $ref: '#/components/schemas/UTCTimestamp'
        collected_at:
          $ref: '#/components/schemas/UTCTimestamp'
        ingest_status:
          type: string
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    EventPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    Event:
      type: object
      additionalProperties: false
      required: [id, title, summary, first_seen_at, event_status, fact_status, dedupe_key]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        event_time:
          $ref: '#/components/schemas/UTCTimestamp'
        first_seen_at:
          $ref: '#/components/schemas/UTCTimestamp'
        knowable_at:
          $ref: '#/components/schemas/UTCTimestamp'
        event_status:
          $ref: '#/components/schemas/EventStatus'
        fact_status:
          $ref: '#/components/schemas/FactStatus'
        dedupe_key:
          type: string
        primary_source_id:
          type: string
    AgentSchedule:
      type: object
      additionalProperties: false
      required:
        - schedule_id
        - agent_key
        - agent_version
        - schedule_type
        - input
        - enabled
        - created_at
        - updated_at
      properties:
        schedule_id:
          type: string
        agent_key:
          type: string
          minLength: 1
          example: collector
        agent_version:
          type: string
          minLength: 1
          example: collector.v1
        schedule_type:
          $ref: '#/components/schemas/ScheduleType'
        cron_expression:
          type: string
        daily_times:
          type: array
          items:
            type: string
            pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        input:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        last_triggered_at:
          $ref: '#/components/schemas/UTCTimestamp'
        next_run_at:
          $ref: '#/components/schemas/UTCTimestamp'
        created_at:
          $ref: '#/components/schemas/UTCTimestamp'
        updated_at:
          $ref: '#/components/schemas/UTCTimestamp'
    AgentScheduleSaveInput:
      type: object
      additionalProperties: false
      required: [agent_version, schedule_type, input]
      properties:
        agent_version:
          type: string
          minLength: 1
          example: collector.v1
        schedule_type:
          $ref: '#/components/schemas/ScheduleType'
        cron_expression:
          type: string
        daily_times:
          type: array
          items:
            type: string
            pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        input:
          type: object
          additionalProperties: true
    AgentScheduleEnabledInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    ScheduleType:
      type: string
      enum: [daily, cron]
    AgentExecutionPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentExecution'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          enum: [20]
        total_items:
          type: integer
          minimum: 0
