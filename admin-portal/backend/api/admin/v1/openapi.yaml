openapi: 3.0.4
info:
  title: Tidewise Admin Portal Service API
  version: 1.0.0
  description: Admin Portal BFF 的手写 REST + JSON 合同。
servers:
  - url: /
    description: 由运行环境注入 Admin Portal Service origin。
security:
  - AdminBearer: []
tags:
  - name: Operations
  - name: Admin data
  - name: AgentRun management
  - name: Monitoring
paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getAdminPortalHealth
      summary: Admin Portal Service 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [Operations]
      operationId: getAdminPortalReadiness
      summary: Admin Portal Service 就绪检查
      security: []
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/admin/v1/raw-documents:
    get:
      tags: [Admin data]
      operationId: listAdminPortalRawDocuments
      summary: 获取已接纳的轻量证据文档分页
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: source_ref
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/RawDocumentPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/events:
    get:
      tags: [Admin data]
      operationId: listAdminPortalEvents
      summary: 获取正式 Event 分页
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: event_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: fact_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FactStatus'
        - name: event_time_from
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: event_time_to
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_from
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_to
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
      responses:
        '200':
          $ref: '#/components/responses/EventPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/agent-schedules/{agent_key}:
    parameters:
      - $ref: '#/components/parameters/AgentKey'
    get:
      tags: [AgentRun management]
      operationId: getAdminPortalAgentSchedule
      summary: 获取 Agent 定时任务配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/AgentScheduleSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [AgentRun management]
      operationId: saveAdminPortalAgentSchedule
      summary: 保存 Agent 定时策略和输入配置
      description: 首次保存创建为停止状态；后续保存不改变启停状态。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentScheduleSaveInput'
      responses:
        '200':
          $ref: '#/components/responses/AgentScheduleSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [AgentRun management]
      operationId: setAdminPortalAgentScheduleEnabled
      summary: 独立启动或停止 Agent 定时任务
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentScheduleEnabledInput'
      responses:
        '200':
          $ref: '#/components/responses/AgentScheduleSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/agent-statuses:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalAgentStatuses
      summary: 获取已注册 Agent 的当前运行状态
      description: 只返回 Agent 标识、当前版本、是否工作、当前执行状态和更新时间，不暴露执行详情。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/AgentStatusListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/runtime-health:
    get:
      tags: [Monitoring]
      operationId: getAdminPortalRuntimeHealth
      summary: 获取统一运行环境健康状态
      description: 并发聚合 Data 与 AgentRun Provider；下游部分失败仍返回 200 和安全的服务级状态。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/RuntimeHealthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/monitoring/summary:
    get:
      tags: [AgentRun management]
      operationId: getAdminPortalMonitoringSummary
      summary: 获取三类执行监控摘要和业务产出聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MonitoringWindow'
      responses:
        '200':
          $ref: '#/components/responses/MonitoringSummarySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/monitoring/collector-executions:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalCollectorMonitoring
      summary: 获取事件采集执行监控明细
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MonitoringWindow'
        - $ref: '#/components/parameters/MonitoringState'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/MonitoringPageSize'
      responses:
        '200':
          $ref: '#/components/responses/CollectorMonitoringPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/monitoring/artifact-extractions:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalArtifactMonitoring
      summary: 获取 Event 提取执行监控明细
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MonitoringWindow'
        - $ref: '#/components/parameters/MonitoringState'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/MonitoringPageSize'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactMonitoringPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/monitoring/semantic-work-items:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalSemanticMonitoring
      summary: 获取事件语义执行监控明细
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/MonitoringWindow'
        - $ref: '#/components/parameters/MonitoringState'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/MonitoringPageSize'
      responses:
        '200':
          $ref: '#/components/responses/SemanticMonitoringPageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/model-providers:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalModelProviders
      summary: 获取已注册模型配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ModelProviderListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/model-providers/{provider_key}:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    get:
      tags: [AgentRun management]
      operationId: getAdminPortalModelProvider
      summary: 获取单个已注册模型配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ModelProviderSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [AgentRun management]
      operationId: updateAdminPortalModelProvider
      summary: 更新已注册模型配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProviderPatchInput'
      responses:
        '200':
          $ref: '#/components/responses/ModelProviderSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/connectors:
    get:
      tags: [AgentRun management]
      operationId: listAdminPortalConnectors
      summary: 获取已注册连接器配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/admin/v1/connectors/{connector_key}:
    parameters:
      - $ref: '#/components/parameters/ConnectorKey'
    get:
      tags: [AgentRun management]
      operationId: getAdminPortalConnector
      summary: 获取单个已注册连接器配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [AgentRun management]
      operationId: updateAdminPortalConnector
      summary: 更新已注册连接器配置
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorPatchInput'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque admin service token
      description: 由运行环境 secret 注入；Swagger UI 不保存或内置 token。
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失或不合法时由 Admin Portal Service 生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    MonitoringWindow:
      name: window
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MonitoringWindow'
    MonitoringState:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MonitoringStateFilter'
    MonitoringPageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AgentKey:
      name: agent_key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        example: collector
    ProviderKey:
      name: provider_key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        example: deepseek
    ConnectorKey:
      name: connector_key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  headers:
    RequestID:
      required: true
      description: 与响应 body 中 request_id 一致。
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    RawDocumentPageSuccess:
      description: 轻量证据文档分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RawDocumentPageEnvelope'
    EventPageSuccess:
      description: Event 分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventPageEnvelope'
    AgentScheduleSuccess:
      description: Agent 定时任务配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentScheduleEnvelope'
    AgentStatusListSuccess:
      description: 已注册 Agent 的当前运行状态列表
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentStatusListEnvelope'
    RuntimeHealthSuccess:
      description: 统一运行环境健康状态；部分失败由 result.status=degraded 表达
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeHealthEnvelope'
    MonitoringSummarySuccess:
      description: AgentRun 执行监控摘要
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MonitoringSummaryEnvelope'
    CollectorMonitoringPageSuccess:
      description: 事件采集执行监控分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CollectorMonitoringPageEnvelope'
    ArtifactMonitoringPageSuccess:
      description: Event 提取执行监控分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArtifactMonitoringPageEnvelope'
    SemanticMonitoringPageSuccess:
      description: 事件语义执行监控分页
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SemanticMonitoringPageEnvelope'
    ModelProviderListSuccess:
      description: 已注册模型配置列表
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelProviderListEnvelope'
    ModelProviderSuccess:
      description: 已更新模型配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelProviderEnvelope'
    ConnectorListSuccess:
      description: 已注册连接器配置列表
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorListEnvelope'
    ConnectorSuccess:
      description: 已更新连接器配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorEnvelope'
    BadRequest:
      description: 查询参数不合法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Admin bearer token 缺失或无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 调用来源不被允许
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: AgentRun 资源不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: AgentRun 拒绝冲突修改
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Admin Portal Service 内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Admin Portal Service 尚未完成运行配置
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    UTCTimestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp。
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        environment:
          type: string
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, checks]
      properties:
        status:
          type: string
          enum: [ready]
        service:
          type: string
        environment:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
    RawDocumentPageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/RawDocumentPage'
    EventPageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/EventPage'
    AgentScheduleEnvelope:
