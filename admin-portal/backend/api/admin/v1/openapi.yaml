        agent_version:
          type: string
          minLength: 1
          example: collector.v1
        schedule_type:
          $ref: '#/components/schemas/ScheduleType'
        cron_expression:
          type: string
        daily_times:
          type: array
          items:
            type: string
            pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        input:
          type: object
          additionalProperties: true
