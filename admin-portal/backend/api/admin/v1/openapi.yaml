          $ref: '#/components/schemas/UTCTimestamp'
        next_run_at:
          $ref: '#/components/schemas/UTCTimestamp'
        created_at:
          $ref: '#/components/schemas/UTCTimestamp'
        updated_at:
          $ref: '#/components/schemas/UTCTimestamp'
    AgentScheduleSaveInput:
      type: object
