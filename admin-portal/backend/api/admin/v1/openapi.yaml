          $ref: '#/components/schemas/UTCTimestamp'
        collected_at:
          $ref: '#/components/schemas/UTCTimestamp'
        ingest_status:
          type: string
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    EventPage:
      type: object
