openapi: 3.0.4
info:
  title: Tidewise Admin Portal Service API
  version: 1.0.0
  description: Admin Portal BFF 的手写 REST + JSON 合同。
servers:
  - url: /
    description: 由运行环境注入 Admin Portal Service origin。
security:
  - AdminBearer: []
tags:
  - name: Operations
  - name: Admin data
paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getAdminPortalHealth
      summary: Admin Portal Service 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /readyz:
    get:
      tags: [Operations]
      operationId: getAdminPortalReadiness
      summary: Admin Portal Service 就绪检查
      security: []
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
  /api/admin/v1/events:
    get:
      tags: [Admin data]
      operationId: listAdminPortalEvents
      summary: 获取正式 Event 分页
      parameters:
        - { $ref: '#/components/parameters/RequestID' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: title, in: query, required: false, schema: { type: string } }
        - {
            name: modality,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/EventModality' }
          }
        - {
            name: status,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/EventLifecycleStatus' }
          }
        - {
            name: occurred_from,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/UTCTimestamp' }
          }
        - {
            name: occurred_to,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/UTCTimestamp' }
          }
        - {
            name: announced_from,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/UTCTimestamp' }
          }
        - {
            name: announced_to,
            in: query,
            required: false,
            schema: { $ref: '#/components/schemas/UTCTimestamp' }
          }
      responses:
        '200': { $ref: '#/components/responses/EventPageSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/evidences:
    get:
      tags: [Admin data]
      operationId: listAdminPortalEvidences
      summary: 获取 Evidence Center 分页读模型
      parameters:
        - { $ref: '#/components/parameters/RequestID' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: title, in: query, required: false, schema: { type: string, maxLength: 500 } }
        - { name: summary, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: category_id, in: query, required: false, schema: { type: string, maxLength: 39, pattern: '^EVC[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' } }
        - { name: source_id, in: query, required: false, description: Raw Evidence 发布时 source_id 快照；trim 后最多 32 字符，并精确、区分大小写匹配。, x-trimmed-max-length: 32, schema: { type: string } }
        - { name: source_name, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: source_level, in: query, required: false, schema: { $ref: '#/components/schemas/SourceLevel' } }
        - { name: is_split, in: query, required: false, schema: { type: boolean } }
        - { name: published_from, in: query, required: false, schema: { $ref: '#/components/schemas/UTCTimestamp' } }
        - { name: published_to, in: query, required: false, schema: { $ref: '#/components/schemas/UTCTimestamp' } }
        - { name: collected_from, in: query, required: false, schema: { $ref: '#/components/schemas/UTCTimestamp' } }
        - { name: collected_to, in: query, required: false, schema: { $ref: '#/components/schemas/UTCTimestamp' } }
      responses:
        '200': { $ref: '#/components/responses/EvidencePageSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/raw-evidences/{raw_evidence_id}/collection-document:
    get:
      tags: [Admin data]
      operationId: getAdminPortalCollectionDocument
      summary: 获取 Raw Evidence 对应的采集文档访问地址
      description: 仅返回经过校验并拼接公开 Base URL 的采集文档地址；不返回正文或内部对象路径。
      parameters:
        - { $ref: '#/components/parameters/RequestID' }
        - name: raw_evidence_id
          in: path
          required: true
          schema:
            type: string
            minLength: 39
            maxLength: 39
            pattern: '^RAW[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200': { $ref: '#/components/responses/CollectionDocumentSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/evidence-categories:
    get:
      tags: [Admin data]
      operationId: listAdminPortalEvidenceCategories
      summary: 获取 Evidence Category 筛选目录
      parameters: [{ $ref: '#/components/parameters/RequestID' }]
      responses:
        '200': { $ref: '#/components/responses/EvidenceCategoryListSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/sources:
    get:
      tags: [Admin data]
      operationId: listAdminPortalSources
      summary: 获取信源管理分页读模型
      description: 仅返回管理列表必要字段，不暴露 Adapter、Endpoint、app_key 或 provider 配置。
      parameters:
        - { $ref: '#/components/parameters/RequestID' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: ownership_type, in: query, required: false, schema: { type: string, enum: [fixed, dynamic] } }
        - { name: channel_type, in: query, required: false, schema: { type: string, enum: [web_search, api, rss] } }
        - { name: enabled, in: query, required: false, schema: { type: boolean } }
        - { name: priority, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: default_source_level, in: query, required: false, schema: { $ref: '#/components/schemas/SourceLevel' } }
        - { name: updated_from, in: query, required: false, schema: { $ref: '#/components/schemas/UTCTimestamp' } }
        - { name: updated_to, in: query, required: false, schema: { $ref: '#/components/schemas/UTCTimestamp' } }
      responses:
        '200': { $ref: '#/components/responses/SourcePageSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/v1/runtime-health:
    get:
      tags: [Operations]
      operationId: getAdminPortalRuntimeHealth
      summary: 获取 Admin Portal 与 Data Service 的运行时健康状态
      parameters:
        - { $ref: '#/components/parameters/RequestID' }
      responses:
        '200': { $ref: '#/components/responses/RuntimeHealthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque admin service token
      description: 由运行环境 secret 注入；Swagger UI 不保存或内置 token。
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失或不合法时由 Admin Portal Service 生成。
      schema: { type: string, minLength: 1, maxLength: 128 }
    Page:
      { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
    PageSize:
      {
        name: page_size,
        in: query,
        required: false,
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      }
  headers:
    RequestID:
      required: true
      description: 与响应 body 中 request_id 一致。
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    EventPageSuccess:
      description: Event 分页
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EventPageEnvelope' } } }
    EvidencePageSuccess:
      description: Evidence 分页
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EvidencePageEnvelope' } } }
    CollectionDocumentSuccess:
      description: 采集文档访问结果
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content:
        {
          application/json: { schema: { $ref: '#/components/schemas/CollectionDocumentEnvelope' } }
        }
    EvidenceCategoryListSuccess:
      description: Evidence Category 目录
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceCategoryListEnvelope' } } }
    SourcePageSuccess:
      description: Source 分页
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/SourcePageEnvelope' } } }
    RuntimeHealthSuccess:
      description: Data Service 运行时健康状态；依赖失败由 result.status=degraded 表达
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content:
        { application/json: { schema: { $ref: '#/components/schemas/RuntimeHealthEnvelope' } } }
    BadRequest:
      description: 查询参数不合法
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Admin bearer token 缺失或无效
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: 调用来源不被允许
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Raw Evidence 不存在
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InternalError:
      description: Admin Portal Service 内部错误
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Admin Portal Service 尚未完成运行配置
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestID' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    UTCTimestamp: { type: string, format: date-time, description: UTC RFC3339 timestamp。 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        environment: { type: string }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, checks]
      properties:
        status: { type: string, enum: [ready] }
        service: { type: string }
        environment: { type: string }
        checks: { type: object, additionalProperties: { type: string } }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }
        request_id: { type: string }
    EventPageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id: { type: string }
        result: { $ref: '#/components/schemas/EventPage' }
    EvidencePageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties: { request_id: { type: string }, result: { $ref: '#/components/schemas/EvidencePage' } }
    CollectionDocumentEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id: { type: string }
        result: { $ref: '#/components/schemas/CollectionDocument' }
    EvidenceCategoryListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties: { request_id: { type: string }, result: { $ref: '#/components/schemas/EvidenceCategoryList' } }
    SourcePageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties: { request_id: { type: string }, result: { $ref: '#/components/schemas/SourcePage' } }
    RuntimeHealthEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id: { type: string }
        result: { $ref: '#/components/schemas/RuntimeHealth' }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Event' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
    Event:
      type: object
      additionalProperties: false
      required: [id, title, summary, semantic, modality, occurred_at, announced_at, status]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        semantic: { $ref: '#/components/schemas/EventSemantic' }
        modality: { $ref: '#/components/schemas/EventModality' }
        occurred_at:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UTCTimestamp' }]
        announced_at:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/UTCTimestamp' }]
        status: { $ref: '#/components/schemas/EventLifecycleStatus' }
    SourceLevel: { type: string, enum: [L1_OFFICIAL, L2_WIRE, L3_MEDIA, L4_SOCIAL] }
    EvidencePage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    Evidence:
      type: object
      additionalProperties: false
      required: [id, raw_evidence_id, title, summary, semantic, categories, source_id, source_name, source_level, source_url, is_original, quoted_source_name, keywords, is_split, published_at, collected_at]
      properties:
        id: { type: string }
        raw_evidence_id: { type: string }
        title: { type: string, nullable: true }
        summary: { type: string }
        semantic: { $ref: '#/components/schemas/EvidenceSemantic' }
        categories: { type: array, items: { $ref: '#/components/schemas/EvidenceCategory' } }
        source_id: { type: string, minLength: 1, maxLength: 32 }
        source_name: { type: string }
        source_level: { $ref: '#/components/schemas/SourceLevel' }
        source_url: { type: string, format: uri }
        is_original: { type: boolean }
        quoted_source_name: { type: string, nullable: true }
        keywords: { type: array, items: { type: string } }
        is_split: { type: boolean }
        published_at: { allOf: [{ $ref: '#/components/schemas/UTCTimestamp' }], nullable: true }
        collected_at: { $ref: '#/components/schemas/UTCTimestamp' }
    CollectionDocument:
      type: object
      additionalProperties: false
      required: [available, url]
      properties:
        available: { type: boolean }
        url:
          type: string
          format: uri
          nullable: true
      description: available=true 时 url 必须为 HTTP(S) 绝对地址；available=false 时 url 为 null。
    EvidenceSemantic:
      type: object
      additionalProperties: false
      required: [who, what, when, where, why, how]
      properties:
        who: { type: string, nullable: true }
        what: { type: string }
        when: { type: string, nullable: true }
        where: { type: string, nullable: true }
        why: { type: string, nullable: true }
        how: { type: string, nullable: true }
    EvidenceCategory:
      type: object
      additionalProperties: false
      required: [id, code, name, description]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
    EvidenceCategoryList:
      type: object
      additionalProperties: false
      required: [categories]
      properties: { categories: { type: array, items: { $ref: '#/components/schemas/EvidenceCategory' } } }
    SourcePage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Source' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    Source:
      type: object
      additionalProperties: false
      required: [id, code, name, ownership_type, channel_type, enabled, priority, default_source_level, updated_at]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        ownership_type: { type: string, enum: [fixed, dynamic] }
        channel_type: { type: string, enum: [web_search, api, rss] }
        enabled: { type: boolean }
        priority: { type: integer, minimum: 1, maximum: 5 }
        default_source_level: { $ref: '#/components/schemas/SourceLevel' }
        updated_at: { $ref: '#/components/schemas/UTCTimestamp' }
    RuntimeHealth:
      type: object
      additionalProperties: false
      required: [status, checked_at, services]
      properties:
        status: { type: string, enum: [ready, degraded] }
        checked_at: { $ref: '#/components/schemas/UTCTimestamp' }
        services:
          {
            type: array,
            minItems: 1,
            maxItems: 1,
            items: { $ref: '#/components/schemas/RuntimeHealthService' }
          }
    RuntimeHealthService:
      type: object
      additionalProperties: false
      required: [key, display_name, status, checked_at]
      properties:
        key: { type: string, enum: [data] }
        display_name: { type: string, enum: [Data Service] }
        status: { $ref: '#/components/schemas/RuntimeHealthStatus' }
        checked_at: { $ref: '#/components/schemas/UTCTimestamp' }
        latency_ms: { type: integer, format: int64, minimum: 0, nullable: true }
        reason_code:
          allOf: [{ $ref: '#/components/schemas/RuntimeHealthReasonCode' }]
          nullable: true
    RuntimeHealthStatus: { type: string, enum: [ready, degraded, down, unknown] }
    RuntimeHealthReasonCode:
      {
        type: string,
        enum: [timeout, unreachable, not_ready, authentication_failed, invalid_response]
      }
    EventModality: { type: string, enum: [FACT, PLAN, SPEC] }
    EventLifecycleStatus: { type: string, enum: [ACTIVE, DEPRECATED, ARCHIVED] }
    EventSemantic:
      type: object
      additionalProperties: false
      required: [who, what, when, where, why, how]
      properties:
        who: { type: string, nullable: true }
        what: { type: string, nullable: true }
        when: { type: string, nullable: true }
        where: { type: string, nullable: true }
        why: { type: string, nullable: true }
        how: { type: string, nullable: true }
