name: Audit UAT Runtime

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional full commit SHA from main; defaults to latest main.
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: uat-runtime-audit
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Validate audit commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Dispatch from main" >&2; exit 1; }
          git fetch --no-tags origin main
          target="${REQUESTED_SHA:-$(git rev-parse origin/main)}"
          [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "commit_sha must be a full SHA" >&2; exit 1; }
          git cat-file -e "${target}^{commit}"
          git merge-base --is-ancestor "$target" origin/main \
            || { echo "Audit commit is not part of main" >&2; exit 1; }
          echo "commit_sha=$(git rev-parse "$target")" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.commit_sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            if (!response.data.workflow_runs.some((run) => run.conclusion === 'success')) {
              core.setFailed(`No successful CI run exists for ${process.env.TARGET_SHA}`);
            }

      - name: Set up Go on hosted runner
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build read-only RDS audit command on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/uat-retired-runtime-db-audit"
          mkdir -p "$artifact_dir"
          binary="${artifact_dir}/uat-retired-runtime-db-audit"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$binary" \
            ./data-service/backend/cmd/uat-retired-runtime-audit
          (
            cd "$artifact_dir"
            sha256sum uat-retired-runtime-db-audit > uat-retired-runtime-db-audit.sha256
          )

      - name: Upload read-only RDS audit command
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-retired-runtime-db-audit-${{ steps.release.outputs.commit_sha }}
          path: ${{ runner.temp }}/uat-retired-runtime-db-audit
          if-no-files-found: error
          retention-days: 1

  audit:
    name: Inspect UAT ECS runtime
    runs-on: [self-hosted, linux, x64, tidewise-uat-ecs]
    needs: resolve-release
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/uat
      UAT_RUNNER_NAME: ${{ vars.UAT_RUNNER_NAME }}
    steps:
      - name: Checkout validated audit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Download read-only RDS audit command
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uat-retired-runtime-db-audit-${{ needs.resolve-release.outputs.commit_sha }}
          path: ${{ runner.temp }}/uat-retired-runtime-db-audit-${{ github.run_id }}

      - name: Verify read-only RDS audit command
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/uat-retired-runtime-db-audit-${GITHUB_RUN_ID}"
          (
            cd "$artifact_dir"
            sha256sum --check uat-retired-runtime-db-audit.sha256
          )
          binary="${artifact_dir}/uat-retired-runtime-db-audit"
          chmod 0700 "$binary"
          echo "RDS_AUDIT_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Audit retired and retained runtime
        env:
          APP_ENV: uat
          TIDEWISE_CONFIG_DIR: ${{ github.workspace }}/data-service/backend/configs
          TIDEWISW_DB_PASSWORD: ${{ secrets.TIDEWISW_DB_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          report="${RUNNER_TEMP}/uat-runtime-audit-${GITHUB_RUN_ID}.txt"
          bash infra/uat/audit-retired-runtime.sh | tee "$report"
          {
            echo '## UAT runtime audit'
            echo
            echo '```text'
            sed -n '1,500p' "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary audit files
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/uat-runtime-audit-${GITHUB_RUN_ID}.txt"
          rm -rf -- "${RUNNER_TEMP}/uat-retired-runtime-db-audit-${GITHUB_RUN_ID}"
