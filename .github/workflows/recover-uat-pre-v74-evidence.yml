name: Recover UAT Pre-v74 Evidence

on:
  workflow_dispatch:
    inputs:
      expected_cutover_release_sha:
        description: Full SHA of the interrupted migration-77 release recorded in the UAT cutover marker.
        required: true
        type: string
      confirm_high_risk_backup:
        description: Confirm the current RDS recovery point remains available.
        required: true
        default: false
        type: boolean
      confirm_destructive_data_change:
        description: Confirm deletion of only the incompatible pre-v74 Raw Evidence and Evidence dataset.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: uat-deploy
  cancel-in-progress: false

jobs:
  validate-recovery:
    name: Validate recovery control commit
    runs-on: ubuntu-latest
    outputs:
      control_sha: ${{ steps.release.outputs.control_sha }}
      cutover_sha: ${{ steps.release.outputs.cutover_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate recovery scope
        id: release
        env:
          EXPECTED_CUTOVER_SHA: ${{ inputs.expected_cutover_release_sha }}
          HIGH_RISK_BACKUP_CONFIRMED: ${{ inputs.confirm_high_risk_backup }}
          DESTRUCTIVE_DATA_CHANGE_CONFIRMED: ${{ inputs.confirm_destructive_data_change }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "UAT Evidence recovery must be dispatched from the main workflow ref" >&2
            exit 1
          fi
          if [ "$HIGH_RISK_BACKUP_CONFIRMED" != true ] || [ "$DESTRUCTIVE_DATA_CHANGE_CONFIRMED" != true ]; then
            echo "Both recovery-point and destructive-data confirmations are required" >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_CUTOVER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_cutover_release_sha must be a full 40-character Git commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "${EXPECTED_CUTOVER_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$EXPECTED_CUTOVER_SHA" origin/main; then
            echo "Interrupted cutover release is not part of main" >&2
            exit 1
          fi
          control_sha="$(git rev-parse "$GITHUB_SHA")"
          if ! git merge-base --is-ancestor "$control_sha" origin/main; then
            echo "Recovery control commit is no longer part of main" >&2
            exit 1
          fi
          echo "control_sha=$control_sha" >> "$GITHUB_OUTPUT"
          echo "cutover_sha=${EXPECTED_CUTOVER_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the recovery commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.control_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            const succeeded = response.data.workflow_runs.some(
              (run) => run.head_sha === process.env.TARGET_SHA && run.conclusion === 'success',
            );
            if (!succeeded) {
              core.setFailed(`No successful CI run exists for ${process.env.TARGET_SHA}`);
            }

  build-recovery-image:
    name: Build immutable recovery image
    runs-on: ubuntu-latest
    needs: validate-recovery
    environment: uat
    outputs:
      recovery_image: ${{ steps.image.outputs.recovery_image }}
    env:
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      SWR_NAMESPACE: ${{ vars.SWR_NAMESPACE }}
      SWR_DATA_REPOSITORY: ${{ vars.SWR_DATA_REPOSITORY }}
    steps:
      - name: Checkout validated recovery commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-recovery.outputs.control_sha }}

      - name: Resolve recovery image tag
        id: tag
        env:
          CONTROL_SHA: ${{ needs.validate-recovery.outputs.control_sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SWR_REGISTRY:?Set the SWR_REGISTRY uat Environment variable}"
          : "${SWR_NAMESPACE:?Set the SWR_NAMESPACE uat Environment variable}"
          : "${SWR_DATA_REPOSITORY:?Set the SWR_DATA_REPOSITORY uat Environment variable}"
          echo "tag=${SWR_REGISTRY}/${SWR_NAMESPACE}/${SWR_DATA_REPOSITORY}:${CONTROL_SHA}-pre-v74-recovery" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to SWR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push Data recovery image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: data-service/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.tag }}

      - name: Resolve immutable recovery image
        id: image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Recovery image build did not return an immutable digest" >&2
            exit 1
          fi
          echo "recovery_image=${IMAGE_TAG}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  recover-evidence:
    name: Clear incompatible UAT Evidence dataset
    runs-on: [self-hosted, linux, x64, tidewise-uat-ecs]
    needs: [validate-recovery, build-recovery-image]
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/uat
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      EXPECTED_CUTOVER_SHA: ${{ needs.validate-recovery.outputs.cutover_sha }}
      RECOVERY_IMAGE: ${{ needs.build-recovery-image.outputs.recovery_image }}
      REPORT_DIR: /tmp/tidewise-pre-v74-evidence-recovery-${{ github.run_id }}
    steps:
      - name: Login to SWR with pull credentials
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_PULL_USERNAME }}
          password: ${{ secrets.SWR_PULL_PASSWORD }}

      - name: Validate interrupted cutover and recover Evidence
        shell: bash
        run: |
          set -euo pipefail
          marker="${DEPLOY_ROOT}/state/tidewise-2-cutover-in-progress"
          runtime_file="${DEPLOY_ROOT}/runtime.env"
          lock_file="${DEPLOY_ROOT}/deploy.lock"
          mkdir -m 0700 -p "$REPORT_DIR"
          if [ ! -s "$marker" ] || [ ! -s "$runtime_file" ]; then
            echo "Interrupted cutover marker and UAT runtime configuration are required" >&2
            exit 1
          fi
          grep -Fx "release_sha=${EXPECTED_CUTOVER_SHA}" "$marker" >/dev/null
          grep -Fx "phase=migration-started" "$marker" >/dev/null
          grep -Fx "target_version=77" "$marker" >/dev/null

          exec 9>"$lock_file"
          if ! flock -n 9; then
            echo "Another UAT deployment holds the deployment lock" >&2
            exit 1
          fi
          for service in data miniapp adminportal admin; do
            running="$(docker ps \
              --filter label=com.docker.compose.project=tidewise-uat \
              --filter "label=com.docker.compose.service=${service}" \
              --format '{{.ID}}')"
            if [ -n "$running" ]; then
              echo "UAT service ${service} is still running" >&2
              exit 1
            fi
          done
          if ! [[ "$RECOVERY_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Recovery image must be addressed by digest" >&2
            exit 1
          fi
          docker pull "$RECOVERY_IMAGE"

          docker run --rm \
            --env-file "$runtime_file" \
            -e APP_ENV=uat \
            "$RECOVERY_IMAGE" \
            /usr/local/bin/pre-v74-evidence-recovery > "$REPORT_DIR/check.json"
          python3 - "$REPORT_DIR/check.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if report.get("migration_version") != 73 or report.get("applied") is not False:
              raise SystemExit("check-only recovery report does not confirm migration 73")
          event_keys = (
              "events", "event_evidence_links", "event_actor_links",
              "event_asset_links", "event_publication_receipts",
          )
          if any(report.get("before", {}).get(key) != 0 for key in event_keys):
              raise SystemExit("Event dataset is not empty")
          PY

          docker run --rm \
            --env-file "$runtime_file" \
            -e APP_ENV=uat \
            -e TIDEWISE_PRE_V74_EVIDENCE_RECOVERY_CONFIRMED=issue-374-uat-pre-v74-evidence-clear \
            "$RECOVERY_IMAGE" \
            /usr/local/bin/pre-v74-evidence-recovery -apply > "$REPORT_DIR/apply.json"
          python3 - "$REPORT_DIR/apply.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if report.get("migration_version") != 73 or report.get("applied") is not True:
              raise SystemExit("Evidence recovery was not applied at migration 73")
          if any(value != 0 for value in report.get("after", {}).values()):
              raise SystemExit("Evidence recovery left incompatible rows")
          PY
          {
            echo "### UAT pre-v74 Evidence recovery"
            echo
            echo "- Interrupted release: \`${EXPECTED_CUTOVER_SHA}\`"
            echo "- Cutover marker: retained at migration-started / target 77"
            echo "- Application services: remain stopped"
            echo
            echo '```json'
            cat "$REPORT_DIR/apply.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload count-only recovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-pre-v74-evidence-recovery-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove count-only temporary reports
        if: always()
        shell: bash
        run: rm -rf "$REPORT_DIR"
