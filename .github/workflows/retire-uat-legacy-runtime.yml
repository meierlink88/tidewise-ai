name: Retire UAT Legacy Runtime

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from main; defaults to latest main.
        required: false
        type: string
      confirmation:
        description: Type retire-agentos-reason-openspg-qdrant-391 exactly.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: uat-legacy-runtime-retirement
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Validate retirement commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          RETIREMENT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Dispatch from main" >&2; exit 1; }
          [ "$RETIREMENT_CONFIRMATION" = retire-agentos-reason-openspg-qdrant-391 ] \
            || { echo "invalid retirement confirmation" >&2; exit 1; }
          git fetch --no-tags origin main
          target="${REQUESTED_SHA:-$(git rev-parse origin/main)}"
          [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "commit_sha must be a full SHA" >&2; exit 1; }
          git cat-file -e "${target}^{commit}"
          git merge-base --is-ancestor "$target" origin/main \
            || { echo "Retirement commit is not part of main" >&2; exit 1; }
          echo "commit_sha=$(git rev-parse "$target")" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.commit_sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            if (!response.data.workflow_runs.some((run) => run.conclusion === 'success')) {
              core.setFailed(`No successful CI run exists for ${process.env.TARGET_SHA}`);
            }

      - name: Checkout validated retirement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Go on hosted runner
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build retirement binaries
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/uat-retirement-binaries"
          mkdir -p "$artifact_dir"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "${artifact_dir}/uat-retired-runtime-db-audit" \
            ./data-service/backend/cmd/uat-retired-runtime-audit
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "${artifact_dir}/uat-root-retirement" \
            ./infra/uat/cmd/uat-root-retirement
          (
            cd "$artifact_dir"
            sha256sum uat-retired-runtime-db-audit uat-root-retirement \
              > uat-retired-runtime-binaries.sha256
          )

      - name: Upload retirement binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-retirement-binaries-${{ steps.release.outputs.commit_sha }}
          path: ${{ runner.temp }}/uat-retirement-binaries
          if-no-files-found: error
          retention-days: 1

  retire:
    name: Remove approved UAT legacy runtime
    runs-on: [self-hosted, linux, x64, tidewise-uat-ecs]
    needs: resolve-release
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/uat
      UAT_RUNNER_NAME: ${{ vars.UAT_RUNNER_NAME }}
      RETIREMENT_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout validated retirement code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Download retirement binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uat-retirement-binaries-${{ needs.resolve-release.outputs.commit_sha }}
          path: ${{ runner.temp }}/uat-retirement-binaries-${{ github.run_id }}

      - name: Verify retirement binaries
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/uat-retirement-binaries-${GITHUB_RUN_ID}"
          (cd "$artifact_dir" && sha256sum --check uat-retired-runtime-binaries.sha256)
          chmod 0700 \
            "${artifact_dir}/uat-retired-runtime-db-audit" \
            "${artifact_dir}/uat-root-retirement"
          echo "RDS_AUDIT_BINARY=${artifact_dir}/uat-retired-runtime-db-audit" >> "$GITHUB_ENV"
          echo "ROOT_RETIREMENT_BINARY=${artifact_dir}/uat-root-retirement" >> "$GITHUB_ENV"

      - name: Retire exact approved runtime
        id: retirement
        env:
          APP_ENV: uat
          TIDEWISE_CONFIG_DIR: ${{ github.workspace }}/data-service/backend/configs
          TIDEWISW_DB_PASSWORD: ${{ secrets.TIDEWISW_DB_PASSWORD }}
          ADMIN_SERVICE_TOKEN: ${{ secrets.ADMIN_SERVICE_TOKEN }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          report="${RUNNER_TEMP}/uat-retirement-${GITHUB_RUN_ID}.txt"
          bash infra/uat/retire-legacy-runtime.sh 2>&1 | tee "$report"
          status="${PIPESTATUS[0]}"
          set -e
          echo "report=$report" >> "$GITHUB_OUTPUT"
          {
            echo "## UAT legacy runtime retirement"
            echo
            echo "- validated commit: \`${{ needs.resolve-release.outputs.commit_sha }}\`"
            echo "- exit status: \`${status}\`"
            echo
            echo '```text'
            sed -n '1,500p' "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload sanitized retirement receipt
        if: ${{ always() && steps.retirement.outputs.report != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-retirement-receipt-${{ needs.resolve-release.outputs.commit_sha }}
          path: ${{ steps.retirement.outputs.report }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary retirement binaries
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/uat-retirement-binaries-${GITHUB_RUN_ID}"
          rm -f -- "${RUNNER_TEMP}/uat-retirement-${GITHUB_RUN_ID}.txt"
