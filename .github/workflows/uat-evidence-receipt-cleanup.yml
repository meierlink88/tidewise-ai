name: UAT Evidence Receipt Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm_recovery_point:
        description: Confirm that an RDS automatic backup/PITR or manual recovery point is currently available.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: uat-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate controlled operation
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Require recovery point confirmation
        if: inputs.confirm_recovery_point != true
        run: |
          echo "confirm_recovery_point=true is required" >&2
          exit 1

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve main commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "UAT cleanup must be dispatched from the main workflow ref" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          commit_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$commit_sha" origin/main
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for main commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            if (!response.data.workflow_runs.some((run) => run.head_sha === process.env.TARGET_SHA && run.conclusion === 'success')) {
              core.setFailed(`No successful CI run exists for ${process.env.TARGET_SHA}`);
            }

  build:
    name: Build controlled operation artifacts
    runs-on: ubuntu-latest
    needs: validate
    environment: uat
    outputs:
      data_image: ${{ steps.refs.outputs.data_image }}
      control_image: ${{ steps.refs.outputs.control_image }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Resolve immutable image tags
        id: tags
        env:
          SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
          SWR_NAMESPACE: ${{ vars.SWR_NAMESPACE }}
          SWR_DATA_REPOSITORY: ${{ vars.SWR_DATA_REPOSITORY }}
          SWR_DEPLOY_REPOSITORY: ${{ vars.SWR_DEPLOY_REPOSITORY }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="${SWR_REGISTRY}/${SWR_NAMESPACE}"
          echo "data_tag=${prefix}/${SWR_DATA_REPOSITORY}:${COMMIT_SHA}-receipt-cleanup" >> "$GITHUB_OUTPUT"
          echo "control_tag=${prefix}/${SWR_DEPLOY_REPOSITORY}:${COMMIT_SHA}-receipt-cleanup" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to SWR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push Data migration image
        id: data
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: analyse-data-service/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.data_tag }}
          labels: org.opencontainers.image.revision=${{ needs.validate.outputs.commit_sha }}

      - name: Build and push cleanup control image
        id: control
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: infra/uat
          file: infra/uat/evidence-receipt-cleanup-control.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.control_tag }}
          labels: org.opencontainers.image.revision=${{ needs.validate.outputs.commit_sha }}

      - name: Resolve immutable artifact references
        id: refs
        env:
          DATA_TAG: ${{ steps.tags.outputs.data_tag }}
          DATA_DIGEST: ${{ steps.data.outputs.digest }}
          CONTROL_TAG: ${{ steps.tags.outputs.control_tag }}
          CONTROL_DIGEST: ${{ steps.control.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for digest in "$DATA_DIGEST" "$CONTROL_DIGEST"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "controlled operation image lacks an immutable digest" >&2
              exit 1
            fi
          done
          echo "data_image=${DATA_TAG}@${DATA_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "control_image=${CONTROL_TAG}@${CONTROL_DIGEST}" >> "$GITHUB_OUTPUT"

  execute:
    name: Remove Evidence receipt schema in UAT
    runs-on: [self-hosted, linux, x64, tidewise-uat-ecs]
    timeout-minutes: 15
    needs: [validate, build]
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/uat
      TARGET_DATA_IMAGE: ${{ needs.build.outputs.data_image }}
      CONTROL_IMAGE: ${{ needs.build.outputs.control_image }}
      RECOVERY_POINT_CONFIRMED: ${{ inputs.confirm_recovery_point }}
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
    steps:
      - name: Login to SWR with pull credentials
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_PULL_USERNAME }}
          password: ${{ secrets.SWR_PULL_PASSWORD }}

      - name: Pull immutable operation images
        run: |
          set -euo pipefail
          docker pull "$TARGET_DATA_IMAGE"
          docker pull "$CONTROL_IMAGE"

      - name: Extract trusted cleanup executor
        id: control
        shell: bash
        run: |
          set -euo pipefail
          control_root="${RUNNER_TEMP}/tidewise-evidence-receipt-cleanup-${GITHUB_RUN_ID}"
          mkdir -p "$control_root"
          container="$(docker create "$CONTROL_IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/control/run-evidence-receipt-cleanup.sh" "$control_root/run-evidence-receipt-cleanup.sh"
          docker rm -f "$container" >/dev/null
          trap - EXIT
          chmod 0700 "$control_root/run-evidence-receipt-cleanup.sh"
          echo "script=$control_root/run-evidence-receipt-cleanup.sh" >> "$GITHUB_OUTPUT"

      - name: Execute controlled migration 000044
        run: ${{ steps.control.outputs.script }}

      - name: Remove temporary executor
        if: always() && steps.control.outcome == 'success'
        run: |
          control_root="$(dirname '${{ steps.control.outputs.script }}')"
          find "$control_root" -type f -delete
          rmdir "$control_root"
