name: Deploy UAT Infrastructure

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional full commit SHA from main; defaults to latest main.
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: uat-infrastructure-deploy
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Validate infrastructure release commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Dispatch from main" >&2; exit 1; }
          git fetch --no-tags origin main
          target="${REQUESTED_SHA:-$(git rev-parse origin/main)}"
          [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "commit_sha must be a full SHA" >&2; exit 1; }
          git cat-file -e "${target}^{commit}"
          git merge-base --is-ancestor "$target" origin/main \
            || { echo "Release commit is not part of main" >&2; exit 1; }
          echo "commit_sha=$(git rev-parse "$target")" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.commit_sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            if (!response.data.workflow_runs.some((run) => run.conclusion === 'success')) {
              core.setFailed(`No successful CI run exists for ${process.env.TARGET_SHA}`);
            }

  build-bundle:
    name: Publish immutable infrastructure bundle
    runs-on: ubuntu-latest
    needs: resolve-release
    environment: uat
    outputs:
      bundle_image: ${{ steps.reference.outputs.bundle_image }}
    env:
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      SWR_NAMESPACE: ${{ vars.SWR_NAMESPACE }}
      SWR_DEPLOY_REPOSITORY: ${{ vars.SWR_DEPLOY_REPOSITORY }}
    steps:
      - name: Checkout infrastructure release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to SWR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push infrastructure deployment bundle
        id: bundle
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: infra/uat-infra
          file: infra/uat-infra/deploy-bundle.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/${{ env.SWR_DEPLOY_REPOSITORY }}:infra-${{ needs.resolve-release.outputs.commit_sha }}
          labels: org.opencontainers.image.revision=${{ needs.resolve-release.outputs.commit_sha }}

      - name: Resolve immutable bundle reference
        id: reference
        env:
          DIGEST: ${{ steps.bundle.outputs.digest }}
          SHA: ${{ needs.resolve-release.outputs.commit_sha }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid digest" >&2; exit 1; }
          tag="${SWR_REGISTRY}/${SWR_NAMESPACE}/${SWR_DEPLOY_REPOSITORY}:infra-${SHA}"
          echo "bundle_image=${tag}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy MinIO raw-evidence storage to UAT ECS
    runs-on: [self-hosted, linux, x64, tidewise-uat-ecs]
    needs: [resolve-release, build-bundle]
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/infra-uat
      UAT_RUNNER_NAME: ${{ vars.UAT_RUNNER_NAME }}
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      BUNDLE_IMAGE: ${{ needs.build-bundle.outputs.bundle_image }}
      RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
      RAW_EVIDENCE_PUBLIC_BASE_URL: ${{ vars.RAW_EVIDENCE_PUBLIC_BASE_URL }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
    steps:
      - name: Login to SWR with pull credentials
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_PULL_USERNAME }}
          password: ${{ secrets.SWR_PULL_PASSWORD }}

      - name: Pull immutable deployment bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUNDLE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "bundle must use a digest" >&2; exit 1; }
          docker pull "$BUNDLE_IMAGE"
          root="${RUNNER_TEMP}/tidewise-uat-infra-${GITHUB_RUN_ID}"
          rm -rf "$root"
          mkdir -p "$root"
          container="$(docker create "$BUNDLE_IMAGE" /bin/true)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/bundle/." "$root"
          docker rm -f "$container" >/dev/null
          trap - EXIT
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "compose=$root/docker-compose.yaml" >> "$GITHUB_OUTPUT"

      - name: Prepare protected runtime inputs
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/tidewise-uat-infra-${GITHUB_RUN_ID}.env"
          umask 077
          for name in MINIO_ROOT_USER MINIO_ACCESS_KEY; do
            value="${!name}"
            [[ "$value" =~ ^[A-Za-z0-9_-]{16,20}$ ]] \
              || { echo "$name must be 16-20 URL-safe characters" >&2; exit 1; }
          done
          for name in MINIO_ROOT_PASSWORD MINIO_SECRET_KEY; do
            value="${!name}"
            [[ "$value" =~ ^[A-Za-z0-9_-]{32,64}$ ]] \
              || { echo "$name must be 32-64 URL-safe characters" >&2; exit 1; }
          done
          printf '%s\n' \
            "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
            "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" > "$runtime"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

      - name: Preflight UAT infrastructure
        run: ${{ steps.bundle.outputs.root }}/preflight.sh

      - name: Deploy and verify UAT infrastructure
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime }}
          COMPOSE_FILE: ${{ steps.bundle.outputs.compose }}
        run: ${{ steps.bundle.outputs.root }}/deploy.sh

      - name: Collect sanitized diagnostics
        id: diagnostics
        if: failure() && steps.runtime.outcome == 'success'
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime }}
          COMPOSE_FILE: ${{ steps.bundle.outputs.compose }}
        shell: bash
        run: |
          output="${RUNNER_TEMP}/uat-infra-diagnostics-${GITHUB_RUN_ID}.log"
          "${{ steps.bundle.outputs.root }}/collect-diagnostics.sh" > "$output"
          echo "file=$output" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized diagnostics
        if: failure() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-infra-diagnostics-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.file }}
          retention-days: 7

      - name: Remove temporary protected files
        if: always()
        shell: bash
        run: |
          for path in "${{ steps.runtime.outputs.runtime }}" "${{ steps.diagnostics.outputs.file }}"; do
            [ -z "$path" ] || rm -f -- "$path"
          done
          bundle_root="${{ steps.bundle.outputs.root }}"
          [ -z "$bundle_root" ] || rm -rf -- "$bundle_root"
