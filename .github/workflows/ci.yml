name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect repository architecture risk
        id: risks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-test-risk.sh repository

      - name: Setup Go
        if: steps.risks.outputs.architecture == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test repository architecture and CI contracts
        if: steps.risks.outputs.architecture == 'true'
        run: go test ./scripts/ci/repository-contracts -count=1

      - name: Smoke immutable UAT deployment bundle container
        if: steps.risks.outputs.architecture == 'true'
        run: bash scripts/ci/smoke-uat-deploy-bundle.sh

  data:
    name: Data Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tidewise
          POSTGRES_PASSWORD: tidewise-ci-password
          POSTGRES_DB: tidewise_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tidewise -d tidewise_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Data Service boundary changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-app-change.sh data

      - name: Select Data Service risk suites
        id: risks
        if: steps.paths.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-test-risk.sh data

      - name: Setup Go
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration_smoke == 'true' ||
          steps.risks.outputs.migration_framework == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Data Service formatting
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration_framework == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: |
          unformatted="$(gofmt -l data-service/backend scripts/ci/repository-contracts)"
          if [ -n "$unformatted" ]; then
            echo "The following Data Service or repository contract files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify OpenSPG Object Schemas
        if: steps.risks.outputs.object_schema == 'true'
        run: bash scripts/ci/verify-openspg-schemas.sh

      - name: Vet Data Service
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration_framework == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go vet ./data-service/backend/...

      - name: Test Data Biz and API seams
        if: steps.risks.outputs.default == 'true'
        run: >-
          go test -race
          ./data-service/backend/internal/biz/...
          ./data-service/backend/api/data/v1/...
          ./data-service/backend/internal/service/...
          ./data-service/backend/internal/server
          -count=1

      - name: Test Data PostgreSQL boundaries
        if: steps.risks.outputs.data == 'true'
        env:
          TIDEWISE_TEST_DATABASE_URL: postgres://tidewise:tidewise-ci-password@localhost:5432/tidewise_local?sslmode=disable
        run: |
          go test \
            ./data-service/backend/internal/data/entity \
            ./data-service/backend/internal/data/entity/region \
            ./data-service/backend/internal/data/event \
            ./data-service/backend/internal/data/eventsemantic \
            ./data-service/backend/internal/data/evidence \
            ./data-service/backend/internal/data/rawdocument \
            ./data-service/backend/internal/data/research \
            -count=1
          go test \
            ./data-service/backend/api/data/v1/event \
            -run '^(TestPostgresEventPublicationResponseLossReplayReusesFactsAndPreservesLineage|TestPostgresEventPublicationContractScenarios)$/^(artifact_conflict_rolls_back_the_whole_batch|receipt_failure_rolls_back_Event_evidence_and_Tag_writes)?$' \
            -count=1
          go test \
            ./data-service/backend/api/data/v1/eventsemantic \
            -run '^TestPostgresEventSemanticHTTPFlowPreservesLeaseSubmissionReviewAndRead$' \
            -count=1

      - name: Test Data migration framework
        if: steps.risks.outputs.migration_framework == 'true'
        run: go test ./data-service/backend/internal/data/dbmigration -count=1

      - name: Smoke Data forward migration chain
        if: steps.risks.outputs.migration_smoke == 'true'
        working-directory: data-service/backend
        env:
          APP_ENV: local
          TIDEWISE_CONFIG_DIR: configs
          TIDEWISE_DB_HOST: localhost
          TIDEWISW_DB_PASSWORD: tidewise-ci-password
          PGOPTIONS: >-
            -c tidewise.phase_a_cleanup_write_authorized=reviewed_backup_verified
            -c tidewise.external_identifier_schema_write_authorized=reviewed_backup_verified
            -c tidewise.alliance_economy_schema_write_authorized=reviewed_local_cleanup_verified
        run: |
          go run ./cmd/dbmigrate -apply
          go run ./cmd/dbmigrate -apply

      - name: Test Data configuration and lifecycle
        if: steps.risks.outputs.conf_lifecycle == 'true'
        env:
          TIDEWISE_TEST_DATABASE_URL: postgres://tidewise:tidewise-ci-password@localhost:5432/tidewise_local?sslmode=disable
        run: >-
          go test
          ./data-service/backend/internal/conf
          ./data-service/backend/cmd/research-theme-dev-reset
          -count=1

      - name: Build Data Service binary
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration_framework == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go build -o /tmp/data-service ./data-service/backend/cmd/server

      - name: Build Data Service image
        if: steps.risks.outputs.container == 'true'
        run: docker build -f data-service/backend/Dockerfile -t tidewise-data:ci .

      - name: Validate local and UAT Compose contracts
        if: steps.risks.outputs.container == 'true'
        run: |
          docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.yaml config --quiet
          docker compose --env-file infra/uat/.env.example -f infra/uat/docker-compose.yaml config --quiet

  miniapp:
    name: Miniapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Miniapp boundary changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-app-change.sh miniapp

      - name: Select Miniapp risk suites
        id: risks
        if: steps.paths.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-test-risk.sh miniapp

      - name: Setup Go
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Miniapp Backend formatting
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: |
          unformatted="$(gofmt -l miniapp/backend)"
          if [ -n "$unformatted" ]; then
            echo "The following Miniapp Backend files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet Miniapp Backend
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go vet ./miniapp/backend/...

      - name: Test Miniapp Biz and API seams
        if: steps.risks.outputs.default == 'true'
        run: >-
          go test -race
          ./miniapp/backend/internal/biz/...
          ./miniapp/backend/api/miniapp/v1
          ./miniapp/backend/internal/service
          ./miniapp/backend/internal/server
          -count=1

      - name: Test Miniapp Data API Adapter contract
        if: >-
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go test ./data-service/backend/api/data/v1 ./miniapp/backend/internal/data

      - name: Test Miniapp configuration and lifecycle
        if: steps.risks.outputs.conf_lifecycle == 'true'
        run: go test ./miniapp/backend/internal/conf -count=1

      - name: Build Miniapp Backend binary
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go build -o /tmp/miniapp-service ./miniapp/backend/cmd/server

      - name: Setup Node
        if: steps.risks.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        if: steps.risks.outputs.frontend == 'true'
        run: npm ci

      - name: Verify changed Miniapp formatting
        if: steps.risks.outputs.frontend == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/check-prettier-diff.sh

      - name: Test Miniapp Frontend
        if: steps.risks.outputs.frontend == 'true'
        run: npm run test:miniapp

      - name: Typecheck Miniapp Frontend
        if: steps.risks.outputs.frontend == 'true'
        run: npm run typecheck:miniapp

      - name: Lint Miniapp Frontend
        if: steps.risks.outputs.frontend == 'true'
        run: npm run lint

      - name: Build Miniapp Frontend for WeChat
        if: steps.risks.outputs.frontend == 'true'
        env:
          TARO_APP_RESEARCH_SOURCE: api
          TARO_APP_MINIAPP_API_BASE_URL: https://miniapp.example.invalid
        run: npm run build:weapp

      - name: Build Miniapp Frontend for Douyin
        if: steps.risks.outputs.frontend == 'true'
        env:
          TARO_APP_RESEARCH_SOURCE: api
          TARO_APP_MINIAPP_API_BASE_URL: https://miniapp.example.invalid
        run: npm run build:tt

      - name: Build Miniapp integration images
        if: >-
          steps.risks.outputs.container == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: |
          docker build -f data-service/backend/Dockerfile -t tidewise-data:ci .
          docker build -f miniapp/backend/Dockerfile -t tidewise-miniapp:ci .

      - name: Smoke Miniapp to Data Service
        if: steps.risks.outputs.provider_consumer == 'true'
        run: bash scripts/ci/smoke-miniapp-data-compose.sh

  adminportal:
    name: Admin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Admin Portal boundary changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-app-change.sh adminportal

      - name: Select Admin Portal risk suites
        id: risks
        if: steps.paths.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-test-risk.sh adminportal

      - name: Setup Go
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Admin Portal Backend formatting
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: |
          unformatted="$(gofmt -l admin-portal/backend)"
          if [ -n "$unformatted" ]; then
            echo "The following Admin Portal Backend files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet Admin Portal Backend
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go vet ./admin-portal/backend/...

      - name: Test Admin Portal Biz and API seams
        if: steps.risks.outputs.default == 'true'
        run: >-
          go test -race
          ./admin-portal/backend/internal/biz/...
          ./admin-portal/backend/api/admin/v1
          ./admin-portal/backend/internal/server
          -count=1

      - name: Test Admin Portal provider API Adapter contracts
        if: >-
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go test ./data-service/backend/api/data/v1 ./agent-run/backend/api/agentrun/v1 ./admin-portal/backend/internal/data

      - name: Test Admin Portal configuration and lifecycle
        if: steps.risks.outputs.conf_lifecycle == 'true'
        run: go test ./admin-portal/backend/internal/conf -count=1

      - name: Build Admin Portal Backend binary
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go build -o /tmp/adminportal-service ./admin-portal/backend/cmd/server

      - name: Setup Node
        if: steps.risks.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        if: steps.risks.outputs.frontend == 'true'
        run: npm ci

      - name: Verify changed Admin Portal formatting
        if: steps.risks.outputs.frontend == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/check-prettier-diff.sh

      - name: Test Admin Portal Frontend
        if: steps.risks.outputs.frontend == 'true'
        run: npm run test:admin

      - name: Typecheck Admin Portal Frontend
        if: steps.risks.outputs.frontend == 'true'
        run: npm run typecheck:admin

      - name: Build Admin Portal Frontend
        if: steps.risks.outputs.frontend == 'true'
        run: npm run build:admin

      - name: Build Admin Portal images
        if: steps.risks.outputs.container == 'true'
        run: |
          docker build -f admin-portal/backend/Dockerfile -t tidewise-adminportal:ci .
          docker build -f admin-portal/frontend/Dockerfile -t tidewise-admin:ci .

  agentrun:
    name: AgentRun
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentrun
          POSTGRES_PASSWORD: agentrun-ci-password
          POSTGRES_DB: tidewise_ai_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentrun -d tidewise_ai_server_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect AgentRun boundary changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-app-change.sh agentrun

      - name: Select AgentRun risk suites
        id: risks
        if: steps.paths.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/detect-test-risk.sh agentrun

      - name: Setup Go
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify AgentRun formatting
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: |
          unformatted="$(gofmt -l agent-run/backend)"
          if [ -n "$unformatted" ]; then
            echo "The following AgentRun Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet AgentRun
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: go vet ./agent-run/backend/...

      - name: Test AgentRun Biz, API and Eino seams
        if: steps.risks.outputs.default == 'true'
        run: >-
          go test -race
          ./agent-run/backend/internal/biz/...
          ./agent-run/backend/api/agentrun/v1
          ./agent-run/backend/internal/service
          ./agent-run/backend/internal/server
          -count=1

      - name: Test AgentRun Data, migration and provider boundaries
        if: >-
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        env:
          AGENTRUN_TEST_DATABASE_URL: postgres://agentrun:agentrun-ci-password@localhost:5432/tidewise_ai_server_test?sslmode=disable
        run: go test ./agent-run/backend/internal/data/... -count=1

      - name: Test AgentRun configuration and lifecycle
        if: steps.risks.outputs.conf_lifecycle == 'true'
        env:
          AGENTRUN_TEST_DATABASE_URL: postgres://agentrun:agentrun-ci-password@localhost:5432/tidewise_ai_server_test?sslmode=disable
        run: go test ./agent-run/backend/internal/conf ./agent-run/backend/cmd/server -count=1

      - name: Build AgentRun commands
        if: >-
          steps.risks.outputs.default == 'true' ||
          steps.risks.outputs.data == 'true' ||
          steps.risks.outputs.migration == 'true' ||
          steps.risks.outputs.conf_lifecycle == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: |
          go build -o /tmp/agentrun ./agent-run/backend/cmd/server
          go build -o /tmp/agentrun-migrate ./agent-run/backend/cmd/migrate
          go build -o /tmp/agentrun-config ./agent-run/backend/cmd/config
          go build -o /tmp/agentrun-artifacts ./agent-run/backend/cmd/artifacts

      - name: Build AgentRun image
        if: >-
          steps.risks.outputs.container == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: docker build -f agent-run/backend/Dockerfile -t tidewise-agentrun:ci .

      - name: Smoke AgentRun Artifact bind mount permissions
        if: >-
          steps.risks.outputs.container == 'true' ||
          steps.risks.outputs.provider_consumer == 'true'
        run: bash scripts/ci/smoke-agentrun-artifact-permissions.sh tidewise-agentrun:ci

      - name: Build Data and Admin Portal images for AgentRun smoke
        if: steps.risks.outputs.provider_consumer == 'true'
        run: |
          docker build -f data-service/backend/Dockerfile -t tidewise-data:ci .
          docker build -f admin-portal/backend/Dockerfile -t tidewise-adminportal:ci .
          docker build -f admin-portal/frontend/Dockerfile -t tidewise-admin:ci .

      - name: Smoke Admin Portal to AgentRun
        if: steps.risks.outputs.provider_consumer == 'true'
        run: bash scripts/ci/smoke-admin-agentrun-compose.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed paths and credential patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/check-sensitive-diff.sh

      - name: Scan introduced Git history for credentials
        id: gitleaks
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITLEAKS_REPORT_PATH: ${{ runner.temp }}/gitleaks-results.sarif
        run: bash scripts/ci/scan-git-secrets.sh

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: warn

      - name: Enforce Gitleaks result
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
