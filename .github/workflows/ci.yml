name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check diff scope and credentials
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          if ! git diff --check "$base" "$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Diff contains whitespace errors" >&2
            exit 1
          fi
          changed_paths="$(mktemp "$RUNNER_TEMP/agentrun-changed-paths.XXXXXX")"
          added_diff="$(mktemp "$RUNNER_TEMP/agentrun-added-diff.XXXXXX")"
          trap 'rm -f "$changed_paths" "$added_diff"' EXIT
          git diff --name-only "$base" "$GITHUB_SHA" >"$changed_paths"
          if grep -Eq '(^|/)(data|\.reference)(/|$)|(^|/)\.env$|(^|/)(\.DS_Store|midscene_run)(/|$)' "$changed_paths"; then
            echo "Diff contains a forbidden runtime, credential, or reference path" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "Forbidden-path scan failed" >&2
              exit 1
            fi
          fi
          git diff --unified=0 "$base" "$GITHUB_SHA" >"$added_diff"
          if grep -Eq '^\+.*(sk-[A-Za-z0-9_-]{16,}|tvly-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' "$added_diff"; then
            echo "Diff contains a value matching a credential pattern" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "Credential scan failed" >&2
              exit 1
            fi
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Build commands
        run: go build ./cmd/...

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTRUN_TEST_DATABASE_URL: postgres://agentrun:agentrun-ci-password@localhost:5432/tidewise_ai_server_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentrun
          POSTGRES_PASSWORD: agentrun-ci-password
          POSTGRES_DB: tidewise_ai_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentrun -d tidewise_ai_server_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test PostgreSQL-backed contracts
        run: go test ./internal/agentrun/persistence/postgres ./internal/collector/httpapi -count=1
