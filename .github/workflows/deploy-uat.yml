name: Deploy UAT

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional full commit SHA from main. Defaults to the latest main commit.
        required: false
        type: string
      confirm_high_risk_backup:
        description: Confirm an RDS recovery point for high-risk schema migrations; data publication is never allowed here.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: uat-deploy
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Validate release commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Deploy UAT must be dispatched from the main workflow ref" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          target="${REQUESTED_SHA:-}"
          if [ -z "$target" ]; then
            target="$(git rev-parse origin/main)"
          fi
          if ! [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git commit SHA" >&2
            exit 1
          fi
          git cat-file -e "${target}^{commit}"
          if ! git merge-base --is-ancestor "$target" origin/main; then
            echo "Release commit is not part of main: $target" >&2
            exit 1
          fi
          echo "commit_sha=$(git rev-parse "$target")" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            const succeeded = response.data.workflow_runs.some(
              (run) => run.head_sha === process.env.TARGET_SHA && run.conclusion === 'success',
            );
            if (!succeeded) {
              core.setFailed(`No successful CI run exists for ${process.env.TARGET_SHA}`);
            }

  current-release:
    name: Read current UAT release
    runs-on: [self-hosted, linux, x64, tidewise-uat-ecs]
    needs: resolve-release
    outputs:
      available: ${{ steps.current.outputs.available }}
      state_fingerprint: ${{ steps.current.outputs.state_fingerprint }}
      commit_sha: ${{ steps.current.outputs.commit_sha }}
      data_image: ${{ steps.current.outputs.data_image }}
      miniapp_image: ${{ steps.current.outputs.miniapp_image }}
      adminportal_image: ${{ steps.current.outputs.adminportal_image }}
      admin_image: ${{ steps.current.outputs.admin_image }}
      agentrun_image: ${{ steps.current.outputs.agentrun_image }}
    steps:
      - name: Read repository-managed release state
        id: current
        env:
          DEPLOY_ROOT: /opt/tidewise/uat
        shell: bash
        run: |
          set -euo pipefail
          state_dir="${DEPLOY_ROOT}/state"
          runtime_file="${DEPLOY_ROOT}/runtime.env"
          sha_file="${state_dir}/current.sha"
          images_file="${state_dir}/current.images.env"
          compose_file="${state_dir}/current.compose.yaml"
          write_marker="${state_dir}/release-state-write-in-progress"
          state_fingerprint() {
            for path in "$runtime_file" "$sha_file" "$images_file" "$compose_file" "$write_marker"; do
              if [ -e "$path" ]; then
                sha256sum "$path"
              else
                printf 'missing  %s\n' "$path"
              fi
            done | sha256sum | cut -d ' ' -f 1
          }
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "state_fingerprint=$(state_fingerprint)" >> "$GITHUB_OUTPUT"
          if [ -e "$write_marker" ]; then
            echo "Previous UAT release has an interrupted state write; full deployment required."
            exit 0
          fi
          if [ ! -s "$runtime_file" ] || [ ! -s "$sha_file" ] || [ ! -s "$images_file" ] || [ ! -s "$compose_file" ]; then
            echo "No complete previous UAT release state; full deployment required."
            exit 0
          fi

          current_sha="$(sed -n '1p' "$sha_file")"
          image_value() {
            sed -n "s/^$1=//p" "$images_file" | tail -n 1
          }
          data_image="$(image_value DATA_IMAGE)"
          miniapp_image="$(image_value MINIAPP_IMAGE)"
          adminportal_image="$(image_value ADMINPORTAL_IMAGE)"
          admin_image="$(image_value ADMIN_IMAGE)"
          agentrun_image="$(image_value AGENTRUN_IMAGE)"
          if ! [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Previous UAT release SHA is invalid; full deployment required."
            exit 0
          fi
          for image in "$data_image" "$miniapp_image" "$adminportal_image" "$admin_image" "$agentrun_image"; do
            if ! [[ "$image" =~ ^[^[:space:]]+:[0-9a-f]{40}$ ]]; then
              echo "Previous UAT image state is incomplete; full deployment required."
              exit 0
            fi
          done
          if ! env -u DATA_IMAGE -u MINIAPP_IMAGE -u ADMINPORTAL_IMAGE -u ADMIN_IMAGE -u AGENTRUN_IMAGE \
            docker compose --env-file "$runtime_file" --env-file "$images_file" -f "$compose_file" config --quiet; then
            echo "Previous UAT Compose state is invalid; full deployment required."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "data_image=$data_image" >> "$GITHUB_OUTPUT"
          echo "miniapp_image=$miniapp_image" >> "$GITHUB_OUTPUT"
          echo "adminportal_image=$adminportal_image" >> "$GITHUB_OUTPUT"
          echo "admin_image=$admin_image" >> "$GITHUB_OUTPUT"
          echo "agentrun_image=$agentrun_image" >> "$GITHUB_OUTPUT"

  plan-release:
    name: Plan UAT service deployment
    runs-on: ubuntu-latest
    needs: [resolve-release, current-release]
    outputs:
      deploy_all: ${{ steps.plan.outputs.deploy_all }}
      deploy_data: ${{ steps.plan.outputs.deploy_data }}
      deploy_agentrun: ${{ steps.plan.outputs.deploy_agentrun }}
      deploy_miniapp: ${{ steps.plan.outputs.deploy_miniapp }}
      deploy_adminportal: ${{ steps.plan.outputs.deploy_adminportal }}
      deploy_admin: ${{ steps.plan.outputs.deploy_admin }}
      scope_reason: ${{ steps.plan.outputs.scope_reason }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}
          fetch-depth: 0

      - name: Checkout trusted UAT planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .uat-control
          sparse-checkout: infra/uat

      - name: Resolve changed application services
        id: plan
        env:
          CURRENT_RELEASE_SHA: ${{ needs.current-release.outputs.commit_sha }}
          TARGET_RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          plan="$(.uat-control/infra/uat/plan-service-release.sh "$CURRENT_RELEASE_SHA" "$TARGET_RELEASE_SHA")"
          printf '%s\n' "$plan" >> "$GITHUB_OUTPUT"
          {
            echo "### UAT service deployment plan"
            echo
            echo '```text'
            printf '%s\n' "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and publish SWR images
    runs-on: ubuntu-latest
    needs: [resolve-release, current-release, plan-release]
    environment: uat
    outputs:
      data_image: ${{ steps.images.outputs.data_image }}
      miniapp_image: ${{ steps.images.outputs.miniapp_image }}
      adminportal_image: ${{ steps.images.outputs.adminportal_image }}
      admin_image: ${{ steps.images.outputs.admin_image }}
      agentrun_image: ${{ steps.images.outputs.agentrun_image }}
      deploy_bundle_image: ${{ steps.deploy-bundle-ref.outputs.deploy_bundle_image }}
    env:
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      SWR_NAMESPACE: ${{ vars.SWR_NAMESPACE }}
      SWR_DATA_REPOSITORY: ${{ vars.SWR_DATA_REPOSITORY }}
      SWR_MINIAPP_REPOSITORY: ${{ vars.SWR_MINIAPP_REPOSITORY }}
      SWR_ADMINPORTAL_REPOSITORY: ${{ vars.SWR_ADMINPORTAL_REPOSITORY }}
      SWR_ADMIN_REPOSITORY: ${{ vars.SWR_ADMIN_REPOSITORY }}
      SWR_AGENTRUN_REPOSITORY: ${{ vars.SWR_AGENTRUN_REPOSITORY }}
      SWR_DEPLOY_REPOSITORY: ${{ vars.SWR_DEPLOY_REPOSITORY }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Checkout trusted UAT control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .uat-control
          sparse-checkout: infra/uat

      - name: Resolve immutable image names
        id: images
        env:
          COMMIT_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          DEPLOY_DATA: ${{ needs.plan-release.outputs.deploy_data }}
          DEPLOY_MINIAPP: ${{ needs.plan-release.outputs.deploy_miniapp }}
          DEPLOY_ADMINPORTAL: ${{ needs.plan-release.outputs.deploy_adminportal }}
          DEPLOY_ADMIN: ${{ needs.plan-release.outputs.deploy_admin }}
          DEPLOY_AGENTRUN: ${{ needs.plan-release.outputs.deploy_agentrun }}
          CURRENT_DATA_IMAGE: ${{ needs.current-release.outputs.data_image }}
          CURRENT_MINIAPP_IMAGE: ${{ needs.current-release.outputs.miniapp_image }}
          CURRENT_ADMINPORTAL_IMAGE: ${{ needs.current-release.outputs.adminportal_image }}
          CURRENT_ADMIN_IMAGE: ${{ needs.current-release.outputs.admin_image }}
          CURRENT_AGENTRUN_IMAGE: ${{ needs.current-release.outputs.agentrun_image }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SWR_REGISTRY:?Set the SWR_REGISTRY uat Environment variable}"
          : "${SWR_NAMESPACE:?Set the SWR_NAMESPACE uat Environment variable}"
          : "${SWR_DATA_REPOSITORY:?Set the SWR_DATA_REPOSITORY uat Environment variable}"
          : "${SWR_MINIAPP_REPOSITORY:?Set the SWR_MINIAPP_REPOSITORY uat Environment variable}"
          : "${SWR_ADMINPORTAL_REPOSITORY:?Set the SWR_ADMINPORTAL_REPOSITORY uat Environment variable}"
          : "${SWR_ADMIN_REPOSITORY:?Set the SWR_ADMIN_REPOSITORY uat Environment variable}"
          : "${SWR_AGENTRUN_REPOSITORY:?Set the SWR_AGENTRUN_REPOSITORY uat Environment variable}"
          : "${SWR_DEPLOY_REPOSITORY:?Set the SWR_DEPLOY_REPOSITORY uat Environment variable}"
          prefix="${SWR_REGISTRY}/${SWR_NAMESPACE}"
          data_build_image="${prefix}/${SWR_DATA_REPOSITORY}:${COMMIT_SHA}"
          miniapp_build_image="${prefix}/${SWR_MINIAPP_REPOSITORY}:${COMMIT_SHA}"
          adminportal_build_image="${prefix}/${SWR_ADMINPORTAL_REPOSITORY}:${COMMIT_SHA}"
          admin_build_image="${prefix}/${SWR_ADMIN_REPOSITORY}:${COMMIT_SHA}"
          agentrun_build_image="${prefix}/${SWR_AGENTRUN_REPOSITORY}:${COMMIT_SHA}"
          select_image() {
            local deploy="$1"
            local candidate="$2"
            local current="$3"
            if [ "$deploy" = true ]; then
              printf '%s\n' "$candidate"
              return
            fi
            if [ -z "$current" ]; then
              echo "unchanged service is missing its current immutable image" >&2
              exit 1
            fi
            printf '%s\n' "$current"
          }
          echo "data_build_image=$data_build_image" >> "$GITHUB_OUTPUT"
          echo "miniapp_build_image=$miniapp_build_image" >> "$GITHUB_OUTPUT"
          echo "adminportal_build_image=$adminportal_build_image" >> "$GITHUB_OUTPUT"
          echo "admin_build_image=$admin_build_image" >> "$GITHUB_OUTPUT"
          echo "agentrun_build_image=$agentrun_build_image" >> "$GITHUB_OUTPUT"
          echo "data_image=$(select_image "$DEPLOY_DATA" "$data_build_image" "$CURRENT_DATA_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "miniapp_image=$(select_image "$DEPLOY_MINIAPP" "$miniapp_build_image" "$CURRENT_MINIAPP_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "adminportal_image=$(select_image "$DEPLOY_ADMINPORTAL" "$adminportal_build_image" "$CURRENT_ADMINPORTAL_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "admin_image=$(select_image "$DEPLOY_ADMIN" "$admin_build_image" "$CURRENT_ADMIN_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "agentrun_image=$(select_image "$DEPLOY_AGENTRUN" "$agentrun_build_image" "$CURRENT_AGENTRUN_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "deploy_bundle_tag=${prefix}/${SWR_DEPLOY_REPOSITORY}:${COMMIT_SHA}-${CONTROL_PLANE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to SWR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Stage immutable UAT deployment bundle
        id: deploy-bundle
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_context="${RUNNER_TEMP}/tidewise-uat-deploy-bundle-${GITHUB_RUN_ID}"
          rm -rf "$bundle_context"
          bash .uat-control/infra/uat/stage-deploy-bundle.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/.uat-control" \
            "$bundle_context" \
            "$RELEASE_SHA" \
            "$CONTROL_PLANE_SHA"
          echo "context=$bundle_context" >> "$GITHUB_OUTPUT"

      - name: Build and push Data Service
        if: needs.plan-release.outputs.deploy_data == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: data-service/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.images.outputs.data_build_image }}

      - name: Build and push Miniapp Backend Service
        if: needs.plan-release.outputs.deploy_miniapp == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: miniapp/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.images.outputs.miniapp_build_image }}

      - name: Build and push Admin Portal Backend Service
        if: needs.plan-release.outputs.deploy_adminportal == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: admin-portal/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.images.outputs.adminportal_build_image }}

      - name: Build and push Admin Portal Frontend
        if: needs.plan-release.outputs.deploy_admin == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: admin-portal/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.images.outputs.admin_build_image }}

      - name: Build and push AgentRun
        if: needs.plan-release.outputs.deploy_agentrun == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: agent-run/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.images.outputs.agentrun_build_image }}

      - name: Build and push immutable UAT deployment bundle
        id: deploy-bundle-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.deploy-bundle.outputs.context }}
          file: .uat-control/infra/uat/deploy-bundle.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.images.outputs.deploy_bundle_tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-release.outputs.commit_sha }}
            com.tidewise.uat.control-plane-revision=${{ github.sha }}

      - name: Resolve immutable deployment bundle digest
        id: deploy-bundle-ref
        env:
          DEPLOY_BUNDLE_TAG: ${{ steps.images.outputs.deploy_bundle_tag }}
          DEPLOY_BUNDLE_DIGEST: ${{ steps.deploy-bundle-image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "deployment bundle build did not return an immutable digest" >&2
            exit 1
          fi
          echo "deploy_bundle_image=${DEPLOY_BUNDLE_TAG}@${DEPLOY_BUNDLE_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to UAT ECS
    runs-on: [self-hosted, linux, x64, tidewise-uat-ecs]
    needs: [resolve-release, current-release, build-and-push]
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/uat
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      UAT_RUNNER_NAME: ${{ vars.UAT_RUNNER_NAME }}
      UAT_PUBLIC_BASE_URL: ${{ vars.UAT_PUBLIC_BASE_URL }}
      COMMIT_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
      EXPECTED_CURRENT_RELEASE_AVAILABLE: ${{ needs.current-release.outputs.available }}
      EXPECTED_CURRENT_RELEASE_STATE_FINGERPRINT: ${{ needs.current-release.outputs.state_fingerprint }}
      EXPECTED_CURRENT_RELEASE_SHA: ${{ needs.current-release.outputs.commit_sha }}
      EXPECTED_CURRENT_DATA_IMAGE: ${{ needs.current-release.outputs.data_image }}
      EXPECTED_CURRENT_MINIAPP_IMAGE: ${{ needs.current-release.outputs.miniapp_image }}
      EXPECTED_CURRENT_ADMINPORTAL_IMAGE: ${{ needs.current-release.outputs.adminportal_image }}
      EXPECTED_CURRENT_ADMIN_IMAGE: ${{ needs.current-release.outputs.admin_image }}
      EXPECTED_CURRENT_AGENTRUN_IMAGE: ${{ needs.current-release.outputs.agentrun_image }}
      DATA_IMAGE: ${{ needs.build-and-push.outputs.data_image }}
      MINIAPP_IMAGE: ${{ needs.build-and-push.outputs.miniapp_image }}
      ADMINPORTAL_IMAGE: ${{ needs.build-and-push.outputs.adminportal_image }}
      ADMIN_IMAGE: ${{ needs.build-and-push.outputs.admin_image }}
      AGENTRUN_IMAGE: ${{ needs.build-and-push.outputs.agentrun_image }}
      DEPLOY_BUNDLE_IMAGE: ${{ needs.build-and-push.outputs.deploy_bundle_image }}
      TIDEWISW_DB_PASSWORD: ${{ secrets.TIDEWISW_DB_PASSWORD }}
      AGENTRUN_DB_PASSWORD: ${{ secrets.AGENTRUN_DB_PASSWORD }}
      DATA_SERVICE_TOKEN: ${{ secrets.DATA_SERVICE_TOKEN }}
      ADMIN_SERVICE_TOKEN: ${{ secrets.ADMIN_SERVICE_TOKEN }}
      AGENTRUN_SERVICE_TOKEN: ${{ secrets.AGENTRUN_SERVICE_TOKEN }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      HIGH_RISK_BACKUP_CONFIRMED: ${{ inputs.confirm_high_risk_backup }}
    steps:
      - name: Login to SWR with pull credentials
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_PULL_USERNAME }}
          password: ${{ secrets.SWR_PULL_PASSWORD }}

      - name: Pull and verify immutable UAT deployment bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_BUNDLE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "deployment bundle must be addressed by digest" >&2
            exit 1
          fi
          docker pull "$DEPLOY_BUNDLE_IMAGE"
          bundle_root="${RUNNER_TEMP}/tidewise-uat-deploy-bundle-${GITHUB_RUN_ID}"
          rm -rf "$bundle_root"
          mkdir -p "$bundle_root"
          bundle_container="$(docker create "$DEPLOY_BUNDLE_IMAGE")"
          cleanup_bundle_container() {
            docker rm -f "$bundle_container" >/dev/null 2>&1 || true
          }
          trap cleanup_bundle_container EXIT
          docker cp "${bundle_container}:/bundle/." "$bundle_root"
          cleanup_bundle_container
          trap - EXIT

          (
            cd "$bundle_root"
            sha256sum --check SHA256SUMS
          )
          metadata_value() {
            local key="$1"
            sed -n "s/^${key}=//p" "$bundle_root/metadata.env"
          }
          bundle_release_sha="$(metadata_value RELEASE_SHA)"
          bundle_control_plane_sha="$(metadata_value CONTROL_PLANE_SHA)"
          if [ "$bundle_release_sha" != "${COMMIT_SHA,,}" ]; then
            echo "deployment bundle release SHA does not match the validated release" >&2
            exit 1
          fi
          if [ "$bundle_control_plane_sha" != "${GITHUB_SHA,,}" ]; then
            echo "deployment bundle control-plane SHA does not match this workflow" >&2
            exit 1
          fi

          release_root="${bundle_root}/release"
          control_root="${bundle_root}/control"
          compose_file="${release_root}/infra/uat/docker-compose.yaml"
          while IFS=$'\t' read -r scope path extra; do
            if [ -n "${extra:-}" ] || ! [[ "$scope" =~ ^(release|control)$ ]] || ! [[ "$path" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "/$path/" == *"/../"* ]]; then
              echo "invalid deployment bundle manifest row" >&2
              exit 1
            fi
            test -f "${bundle_root}/${scope}/${path}"
          done < "$bundle_root/files.manifest"
          echo "bundle_root=$bundle_root" >> "$GITHUB_OUTPUT"
          echo "release_root=$release_root" >> "$GITHUB_OUTPUT"
          echo "control_root=$control_root" >> "$GITHUB_OUTPUT"
          echo "compose_file=$compose_file" >> "$GITHUB_OUTPUT"
          echo "PASS immutable-deployment-bundle"

      - name: Preflight ECS runtime and network
        shell: bash
        run: |
          cd "${{ steps.bundle.outputs.release_root }}"
          "${{ steps.bundle.outputs.control_root }}/infra/uat/preflight.sh"

      - name: Prepare deployment environment
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="${RUNNER_TEMP}/tidewise-uat-${GITHUB_RUN_ID}.env"
          images_env="${RUNNER_TEMP}/tidewise-uat-${GITHUB_RUN_ID}.images.env"
          umask 077
          printf '%s\n' \
            "ADMIN_ALLOWED_ORIGIN=${UAT_PUBLIC_BASE_URL}:9014" \
            "TIDEWISW_DB_PASSWORD=${TIDEWISW_DB_PASSWORD}" \
            "AGENTRUN_DB_PASSWORD=${AGENTRUN_DB_PASSWORD}" \
            "AGENTRUN_ARTIFACT_DIR=${DEPLOY_ROOT}/agentrun-artifacts" \
            "AGENTRUN_SERVICE_TOKEN=${AGENTRUN_SERVICE_TOKEN}" \
            "EMBEDDING_API_KEY=${EMBEDDING_API_KEY}" \
            "DATA_SERVICE_TOKEN=${DATA_SERVICE_TOKEN}" \
            "ADMIN_SERVICE_TOKEN=${ADMIN_SERVICE_TOKEN}" > "$runtime_env"
          printf '%s\n' \
            "DATA_IMAGE=${DATA_IMAGE}" \
            "MINIAPP_IMAGE=${MINIAPP_IMAGE}" \
            "ADMINPORTAL_IMAGE=${ADMINPORTAL_IMAGE}" \
            "ADMIN_IMAGE=${ADMIN_IMAGE}" \
            "AGENTRUN_IMAGE=${AGENTRUN_IMAGE}" > "$images_env"
          echo "runtime_env=$runtime_env" >> "$GITHUB_OUTPUT"
          echo "images_env=$images_env" >> "$GITHUB_OUTPUT"
          docker compose --env-file "$runtime_env" --env-file "$images_env" -f "${{ steps.bundle.outputs.compose_file }}" config --quiet

      - name: Pull immutable release images
        shell: bash
        run: |
          docker compose --env-file "${{ steps.runtime.outputs.runtime_env }}" --env-file "${{ steps.runtime.outputs.images_env }}" -f "${{ steps.bundle.outputs.compose_file }}" pull
          echo "PASS swr-login-and-image-pull"

      - name: Apply schema migrations and deploy the complete release unit
        shell: bash
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime_env }}
          CANDIDATE_IMAGES: ${{ steps.runtime.outputs.images_env }}
          COMPOSE_FILE: ${{ steps.bundle.outputs.compose_file }}
          MIGRATION_RISK_MANIFEST: ${{ steps.bundle.outputs.control_root }}/infra/uat/migration-risk.tsv
          AGENTRUN_MIGRATION_RISK_MANIFEST: ${{ steps.bundle.outputs.control_root }}/infra/uat/agentrun-migration-risk.tsv
        run: ${{ steps.bundle.outputs.control_root }}/infra/uat/deploy.sh

      - name: Show diagnostics on failure
        id: diagnostics
        if: failure() && steps.runtime.outcome == 'success'
        shell: bash
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime_env }}
          CANDIDATE_IMAGES: ${{ steps.runtime.outputs.images_env }}
          COMPOSE_FILE: ${{ steps.bundle.outputs.compose_file }}
        run: |
          diagnostics_file="${RUNNER_TEMP}/uat-diagnostics-${GITHUB_RUN_ID}.log"
          "${{ steps.bundle.outputs.control_root }}/infra/uat/collect-diagnostics.sh" > "$diagnostics_file"
          echo "diagnostics_file=$diagnostics_file" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized failure diagnostics
        if: failure() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uat-diagnostics-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.diagnostics_file }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary secret files
        if: always() && steps.runtime.outcome == 'success'
        shell: bash
        run: |
          rm -f "${{ steps.runtime.outputs.runtime_env }}" "${{ steps.runtime.outputs.images_env }}" "${{ steps.diagnostics.outputs.diagnostics_file }}"

      - name: Remove temporary deployment bundle
        if: always() && steps.bundle.outcome == 'success'
        shell: bash
        run: rm -rf "${{ steps.bundle.outputs.bundle_root }}"
