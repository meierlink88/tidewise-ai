openapi: 3.0.4
info:
  title: Tidewise Data Service API
  version: 1.0.0
  description: >-
    Data Service 内部 HTTP REST + JSON 合同。消费方拥有小型手写 typed client，
    并以本文件的 operationId、schema drift anchor 和静态合同测试防止漂移。
x-contract-id: tidewise-data-v1
x-handwritten-client-policy: consumer-owned-small-typed-clients
servers:
  - url: /
    description: 由运行环境注入 Data Service origin；合同只冻结路径。
security:
  - ServiceBearer: []
tags:
  - name: Operations
  - name: Research
  - name: Admin aggregates
  - name: Event publication
  - name: Event Tag Catalog
  - name: Research Theme import
  - name: Research Reason Tree import

paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getDataServiceHealth
      summary: Data Service 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string

  /readyz:
    get:
      tags: [Operations]
      operationId: getDataServiceReadiness
      summary: Data Service 就绪检查
      security: []
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment, checks]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string

  /api/data/v1/research/themes:
    get:
      tags: [Research]
      operationId: listResearchThemes
      x-client-drift-anchor: data.v1.listResearchThemes
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Miniapp Research theme 页面聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Theme 页面聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: getResearchTheme
      x-client-drift-anchor: data.v1.getResearchTheme
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Research theme 及其证据聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
      responses:
        '200':
          description: Theme 详情聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: listResearchThemeReasoningTrees
      x-client-drift-anchor: data.v1.listResearchThemeReasoningTrees
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 的全部推理树 Tab 摘要
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Theme 摘要和完整推理树 Tab 集合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees/{reasoning_tree_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
      - $ref: '#/components/parameters/ReasoningTreeID'
    get:
      tags: [Research]
      operationId: getResearchThemeReasoningTree
      x-client-drift-anchor: data.v1.getResearchThemeReasoningTree
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 下的一棵完整推理树
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 单棵推理树完整快照
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/event-tags:
    get:
      tags: [Event Tag Catalog]
      operationId: listActiveEventTags
      x-client-drift-anchor: data.v1.listActiveEventTags
      x-required-service-scope: data.event-tags.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 active Event Tag Catalog 快照
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: active
          in: query
          required: true
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: 按 tag_kind、code、id 稳定排序的 active Event Tag Catalog
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTagCatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/raw-documents:
    get:
      tags: [Admin aggregates]
      operationId: listAdminRawDocuments
      x-client-drift-anchor: data.v1.listAdminRawDocuments
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Admin 原始文档分页聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: source_ref
          in: query
          schema:
            type: string
            maxLength: 256
        - name: ingest_status
          in: query
          schema:
            $ref: '#/components/schemas/IngestStatus'
      responses:
        '200':
          description: 原始文档分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRawDocumentPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/events:
    get:
      tags: [Admin aggregates]
      operationId: listAdminEvents
      x-client-drift-anchor: data.v1.listAdminEvents
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Admin 全球事件分页聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: event_status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: fact_status
          in: query
          schema:
            $ref: '#/components/schemas/FactStatus'
        - name: event_time_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: event_time_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
      responses:
        '200':
          description: 全球事件分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/reviewed-event-imports:
    post:
      tags: [Event publication]
      operationId: publishReviewedEvents
      x-client-drift-anchor: data.v1.publishReviewedEvents
      x-required-service-scope: data.reviewed-events.import
      x-retry-policy: retry-failed-call-with-natural-identities
      x-timeout-budget-ms: 15000
      x-atomicity: whole-batch-single-postgresql-transaction
      x-receipt-schema: event_publication_receipts
      x-transaction-membership: raw-document,event,event-source,event-tag,event-publication-receipt
      summary: 原子发布 1 到 10 个已审核 Event 及其轻量证据
      description: >-
        每次成功调用创建新的 immutable receipt。接口不使用幂等键；已存在的 Event、
        Artifact、Evidence Link 和 Tag Link 仅在自然身份和语义内容完全一致时复用，
        任一冲突或失败都会回滚整个 batch。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              maxLength: 1048576
              x-max-body-bytes: 1048576
              allOf:
                - $ref: '#/components/schemas/EventPublicationRequest'
      responses:
        '201':
          description: 完整 publication 和新 receipt 已原子提交
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPublicationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research-theme-imports:
    post:
      tags: [Research Theme import]
      operationId: importResearchThemes
      x-client-drift-anchor: data.v1.importResearchThemes
      x-required-service-scope: data.research.import
      x-retry-policy: idempotent-with-analysis-batch-id
      x-timeout-budget-ms: 15000
      x-canonicalization: rfc8785-sha256
      x-atomicity: whole-batch-single-postgresql-transaction
      x-receipt-schema: research_theme_import_receipts
      x-transaction-membership: research-theme-import-receipt,research-theme,research-theme-chain-node,research-theme-event
      summary: 原子发布一个不可变 Research Theme 批次快照
      description: >-
        analysis_batch_id 是唯一批次及幂等身份。发布者身份只从 Bearer service principal
        派生；同一主体、批次和 payload 重放首次结果，内容或主体冲突返回 409。
        themes、chain_nodes 和 events 必须按合同键升序提交，任一引用无效时整批回滚。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              maxLength: 1048576
              x-max-body-bytes: 1048576
              allOf:
                - $ref: '#/components/schemas/ResearchThemeImportRequest'
      responses:
        '200':
          description: 相同发布主体、analysis_batch_id 与 payload 的首次结果重放
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeImportEnvelope'
        '201':
          description: Theme 批次和 immutable receipt 已原子提交
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research-reasoning-tree-imports:
    post:
      tags: [Research Reason Tree import]
      operationId: importResearchReasoningTrees
      x-client-drift-anchor: data.v1.importResearchReasoningTrees
      x-required-service-scope: data.research.import
      x-retry-policy: idempotent-with-theme-id
      x-timeout-budget-ms: 15000
      x-canonicalization: rfc8785-sha256
      x-atomicity: whole-theme-single-postgresql-transaction
      x-receipt-schema: research_reasoning_tree_import_receipts
      x-transaction-membership: research-reasoning-tree-import-receipt,research-reasoning-tree,research-reasoning-tree-event,research-reasoning-tree-node,research-reasoning-tree-node-signal
      summary: 原子发布一个 Theme 的完整 Reason Tree 快照
      description: >-
        theme_id 是唯一幂等身份。发布主体必须与父 Theme Publication Receipt 一致；
        每棵树限定一个 Industry Chain，nodes 顺序是业务事实。任一 Tree、Event、
        Chain Node 或 Graph Edge 引用无效时，整个 Theme 的 Reason Tree 集合回滚。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              maxLength: 1048576
              x-max-body-bytes: 1048576
              allOf:
                - $ref: '#/components/schemas/ResearchReasoningTreeImportRequest'
      responses:
        '200':
          description: 相同发布主体、theme_id 与 payload 的首次结果重放
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeImportEnvelope'
        '201':
          description: 完整 Reason Tree 集合和 immutable receipt 已原子提交
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service identity token
      description: >-
        环境 secret 注入的 service identity。服务端从认证 principal 派生 caller identity
        与 scope；request body 不得声明或覆盖 caller identity。

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失时服务端生成。不得作为业务幂等 identity。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WindowHours:
      name: window_hours
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 168
        default: 24
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ThemeID:
      name: theme_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ReasoningTreeID:
      name: reasoning_tree_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'

  headers:
    RequestID:
      description: 本次 transport attempt 的 request id；重放时可以与首次请求不同。
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: 请求 DTO、query 或边界不合法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: service bearer identity 缺失或无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证 principal 不具有 operation 所需 scope
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: caller scope 内不存在目标资源
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 幂等 key 与 payload hash 冲突或 raw identity 冲突；零 mutation
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: JSON request body 超过 1048576 bytes
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 已解析 DTO 未通过 whole-batch 业务 validation；零 mutation
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Data Service 内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    UUID:
      type: string
      format: uuid
      description: RFC 4122 UUID string。
    LowercaseUUID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: V1 publication contract 使用的标准小写 RFC 4122 UUID string。
    UTCTimestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp；response 必须使用 UTC offset Z。
    PayloadHash:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
      description: 服务端生成的 lowercase SHA-256 hex。
    IngestStatus:
      type: string
      enum: [collected, duplicate, failed, pending_extract]
    EventStatus:
      type: string
      enum: [candidate, confirmed, rejected]
    FactStatus:
      type: string
      enum: [unverified, verified, disputed]
    EvidenceRelation:
      type: string
      enum: [supports, contradicts, context]
    TagKind:
      type: string
      enum: [news_category, index_category]
    TagAssignSource:
      type: string
      enum: [ai, rule]

    EventTagCatalogItem:
      type: object
      additionalProperties: false
      required: [id, tag_kind, code, name, is_active]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        tag_kind:
          $ref: '#/components/schemas/TagKind'
        code:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        is_active:
          type: boolean
          enum: [true]
    EventTagCatalog:
      type: object
      additionalProperties: false
      required: [catalog_revision, catalog_hash, tags]
      properties:
        catalog_revision:
          type: string
          minLength: 1
          maxLength: 128
        catalog_hash:
          $ref: '#/components/schemas/PayloadHash'
        tags:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventTagCatalogItem'
    EventTagCatalogEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        result:
          $ref: '#/components/schemas/EventTagCatalog'

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: 稳定 machine-readable error code。
        message:
          type: string
