openapi: 3.0.4
info:
  title: Tidewise Data Service API
  version: 1.0.0
  description: >-
    Data Service 内部 HTTP REST + JSON 合同。消费方拥有小型手写 typed client，
    并以本文件的 operationId、schema drift anchor 和静态合同测试防止漂移。
x-contract-id: tidewise-data-v1
x-handwritten-client-policy: consumer-owned-small-typed-clients
servers:
  - url: /
    description: 由运行环境注入 Data Service origin；合同只冻结路径。
security:
  - ServiceBearer: []
tags:
  - name: Operations
  - name: Research
  - name: Admin aggregates
  - name: Event publication
  - name: Event Tag Catalog
  - name: Event Semantics
  - name: Research Theme import
  - name: Research Reason Tree import

paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getDataServiceHealth
      summary: Data Service 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string

  /readyz:
    get:
      tags: [Operations]
      operationId: getDataServiceReadiness
      summary: Data Service 就绪检查
      security: []
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment, checks]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string

  /api/data/v1/research/themes:
    get:
      tags: [Research]
      operationId: listResearchThemes
      x-client-drift-anchor: data.v1.listResearchThemes
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Miniapp Research theme 页面聚合
      description: 返回固定查询时间范围内全部成功发布的单 Theme Aggregate，按 published_at DESC、id ASC 稳定排序并通过 cursor 分页。
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Theme 页面聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: getResearchTheme
      x-client-drift-anchor: data.v1.getResearchTheme
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Research theme 及其证据聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
      responses:
        '200':
          description: Theme 详情聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: listResearchThemeReasoningTrees
      x-client-drift-anchor: data.v1.listResearchThemeReasoningTrees
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 的全部推理树 Tab 摘要
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Theme 摘要和完整推理树 Tab 集合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees/{reasoning_tree_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
      - $ref: '#/components/parameters/ReasoningTreeID'
    get:
      tags: [Research]
      operationId: getResearchThemeReasoningTree
      x-client-drift-anchor: data.v1.getResearchThemeReasoningTree
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 下的一棵完整推理树
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 单棵推理树完整快照
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/event-tags:
    get:
      tags: [Event Tag Catalog]
      operationId: listActiveEventTags
      x-client-drift-anchor: data.v1.listActiveEventTags
      x-required-service-scope: data.event-tags.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 active Event Tag Catalog 快照
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: active
          in: query
          required: true
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: 按 tag_kind、code、id 稳定排序的 active Event Tag Catalog
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTagCatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/raw-documents:
    get:
      tags: [Admin aggregates]
      operationId: listAdminRawDocuments
      x-client-drift-anchor: data.v1.listAdminRawDocuments
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Admin 原始文档分页聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: source_ref
          in: query
          schema:
            type: string
            maxLength: 256
        - name: ingest_status
          in: query
          schema:
            $ref: '#/components/schemas/IngestStatus'
      responses:
        '200':
          description: 原始文档分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRawDocumentPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/events:
    get:
      tags: [Admin aggregates]
      operationId: listAdminEvents
      x-client-drift-anchor: data.v1.listAdminEvents
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Admin 全球事件分页聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: event_status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: fact_status
          in: query
          schema:
            $ref: '#/components/schemas/FactStatus'
        - name: event_time_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: event_time_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
      responses:
        '200':
          description: 全球事件分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/event-semantics/eligible-events:
    get:
      tags: [Event Semantics]
      operationId: listEligibleEventSemanticEvents
      x-client-drift-anchor: data.v1.listEligibleEventSemanticEvents
      x-required-service-scope: data.event-semantics.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 列出可创建首次语义分析 Work Item 的 Event
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Eligible Event 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleEventSemanticEventsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/context-leases:
    post:
      tags: [Event Semantics]
      operationId: createEventSemanticContextLease
      x-client-drift-anchor: data.v1.createEventSemanticContextLease
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: no-automatic-retry
      x-timeout-budget-ms: 5000
      summary: 为 AgentRun 已领取的 Work Item 创建数据侧 Context Lease
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticContextLeaseRequest'
      responses:
        '201':
          description: Context Lease 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticContextLeaseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/context-leases/{context_lease_id}/context:
    get:
      tags: [Event Semantics]
      operationId: getEventSemanticContext
      x-client-drift-anchor: data.v1.getEventSemanticContext
      x-required-service-scope: data.event-semantics.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Context Lease 对应 Event 与版本化本体上下文
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: context_lease_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Event Semantic Context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticContextEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/entity-resolutions:
    post:
      tags: [Event Semantics]
      operationId: resolveEventSemanticEntities
      x-client-drift-anchor: data.v1.resolveEventSemanticEntities
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: idempotent-read-via-post
      x-timeout-budget-ms: 5000
      summary: 在 Context Lease 边界内解析既有规范 Entity
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticEntityResolutionRequest'
      responses:
        '200':
          description: Entity Resolution 候选
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticEntityResolutionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/direct-targets:search:
    post:
      tags: [Event Semantics]
      operationId: searchEventSemanticDirectTargets
      x-client-drift-anchor: data.v1.searchEventSemanticDirectTargets
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: idempotent-read-via-post
      x-timeout-budget-ms: 5000
      summary: 查询已批准 EntityRelation 上的一跳 Direct Target
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticDirectTargetSearchRequest'
      responses:
        '200':
          description: Direct Target 候选
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticDirectTargetSearchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/submissions:
    post:
      tags: [Event Semantics]
      operationId: createEventSemanticSubmission
      x-client-drift-anchor: data.v1.createEventSemanticSubmission
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: idempotent-with-agent-execution-id-and-canonical-payload
      x-timeout-budget-ms: 15000
      x-atomicity: whole-submission-candidate-snapshot
      summary: 持久化一个 Event 的候选快照并执行确定性预检
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticSubmissionRequest'
      responses:
        '200':
          description: 相同 canonical payload 的安全重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticSubmissionEnvelope'
        '201':
          description: Submission 与候选快照已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticSubmissionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/submissions/{submission_id}/reviews:
    post:
      tags: [Event Semantics]
      operationId: submitEventSemanticReview
      x-client-drift-anchor: data.v1.submitEventSemanticReview
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: idempotent-with-reviewer-execution-key-and-canonical-payload
      x-timeout-budget-ms: 15000
      x-atomicity: whole-review-snapshot
      summary: 提交独立 Reviewer 或 Adjudicator 结构化结果
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: submission_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticReviewRequest'
      responses:
        '200':
          description: Review 已保存并由 Data 完成状态裁决
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticSubmissionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/events/{event_id}/semantics:
    get:
      tags: [Event Semantics]
      operationId: getEventSemantics
      x-client-drift-anchor: data.v1.getEventSemantics
      x-required-service-scope: data.event-semantics.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 读取 Event 的完整语义结果与审计状态
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Event Semantics 结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/research-analysis-context:
    get:
      tags: [Research Analysis]
      operationId: listResearchAnalysisContext
      x-client-drift-anchor: data.v1.listResearchAnalysisContext
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get-restart-from-first-page-on-cursor-mismatch
      x-timeout-budget-ms: 15000
      summary: 按显式研究时间窗口读取正式 Event Semantics 批量上下文
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: discovery_window_start
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: discovery_window_end
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: analysis_as_of
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: prediction_horizon_start
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: prediction_horizon_end
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 实时正式 Event Semantic Bundles 与解析字典
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchAnalysisContextEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ResearchAnalysisContextInconsistent'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/ResearchResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/research-graph:search:
    post:
      tags: [Research Analysis]
      operationId: searchResearchGraph
      x-client-drift-anchor: data.v1.searchResearchGraph
      x-required-service-scope: data.research.read
      x-retry-policy: safe-idempotent-read-reduce-scope-on-resource-limit
      x-timeout-budget-ms: 15000
      summary: 按 Codex 显式范围执行受预算约束的确定性研究图谱检索
      description: >-
        Data 只执行确定性、只读、受预算约束的图遍历。industry_chain_entity_id 仅约束
        Industry Chain Graph Edge；全局 EntityRelation 仍由显式 relation_filters 控制。
        超过预算时整次失败，不返回静默截断的部分子图。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchGraphSearchRequest'
      responses:
        '200':
          description: 引用完整、稳定排序的可达子图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchGraphSearchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/ResearchResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/reviewed-event-imports:
    post:
      tags: [Event publication]
      operationId: publishReviewedEvents
      x-client-drift-anchor: data.v1.publishReviewedEvents
      x-required-service-scope: data.reviewed-events.import
      x-retry-policy: retry-failed-call-with-natural-identities
      x-timeout-budget-ms: 15000
      x-atomicity: whole-batch-single-postgresql-transaction
      x-receipt-schema: event_publication_receipts
      x-transaction-membership: raw-document,event,event-source,event-tag,event-publication-receipt
      summary: 原子发布 1 到 10 个已审核 Event 及其轻量证据
      description: >-
        每次成功调用创建新的 immutable receipt。接口不使用幂等键；已存在的 Event、
        Artifact、Evidence Link 和 Tag Link 仅在自然身份和语义内容完全一致时复用，
        任一冲突或失败都会回滚整个 batch。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              maxLength: 1048576
              x-max-body-bytes: 1048576
              allOf:
                - $ref: '#/components/schemas/EventPublicationRequest'
      responses:
        '201':
          description: 完整 publication 和新 receipt 已原子提交
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPublicationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research-theme-imports:
    post:
      tags: [Research Theme publication]
      operationId: publishResearchTheme
      x-client-drift-anchor: data.v1.publishResearchTheme
      x-required-service-scope: data.research.import
      x-retry-policy: idempotent-with-analysis-batch-id
      x-timeout-budget-ms: 15000
      x-canonicalization: rfc8785-sha256
      x-atomicity: one-theme-and-all-reason-trees-single-postgresql-transaction
      x-receipt-schema: research_theme_import_receipts
      x-transaction-membership: research-theme-import-receipt,research-theme,research-theme-impact,research-theme-event,research-reasoning-tree-import-receipt,research-reasoning-tree,research-reasoning-tree-event,research-reasoning-tree-node,research-reasoning-tree-node-signal
      summary: 原子发布一条不可变 Theme 及其全部 Reason Trees
      description: >-
        analysis_batch_id 是本次单 Theme Aggregate 的幂等身份。Data Service 只校验
        结构、正式引用、accepted/latest/non-superseded 状态与 Evidence 血缘，不判断投研
        结论是否正确。Theme 与 1..N Reason Trees 在同一事务内全部发布或全部回滚。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              maxLength: 1048576
              x-max-body-bytes: 1048576
              allOf:
                - $ref: '#/components/schemas/ResearchThemeImportRequest'
      responses:
        '200':
          description: 相同发布主体、analysis_batch_id 与 payload 的首次结果重放
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeImportEnvelope'
        '201':
          description: Theme Aggregate 和 immutable receipt 已原子提交
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service identity token
      description: >-
        环境 secret 注入的 service identity。服务端从认证 principal 派生 caller identity
        与 scope；request body 不得声明或覆盖 caller identity。

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失时服务端生成。不得作为业务幂等 identity。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WindowHours:
      name: window_hours
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 168
        default: 24
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ThemeID:
      name: theme_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ReasoningTreeID:
      name: reasoning_tree_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'

  headers:
    RequestID:
      description: 本次 transport attempt 的 request id；重放时可以与首次请求不同。
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: 请求 DTO、query 或边界不合法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: service bearer identity 缺失或无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证 principal 不具有 operation 所需 scope
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: caller scope 内不存在目标资源
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 幂等 key 与 payload hash 冲突或 raw identity 冲突；零 mutation
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: JSON request body 超过 1048576 bytes
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 已解析 DTO 未通过 whole-batch 业务 validation；零 mutation
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 查询超过当前资源保护预算
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResearchResourceLimit:
      description: 研究查询超过资源预算；整次失败且不返回静默截断结果
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchResourceLimitErrorEnvelope'
    ResearchAnalysisContextInconsistent:
      description: 实时页级引用无法闭合；调用方必须丢弃本轮结果并从第一页重查
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchAnalysisContextInconsistentErrorEnvelope'
    InternalError:
      description: Data Service 内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Event Semantics 依赖暂时不可用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    UUID:
      type: string
      format: uuid
      description: RFC 4122 UUID string。
    LowercaseUUID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: V1 publication contract 使用的标准小写 RFC 4122 UUID string。
    UTCTimestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp；response 必须使用 UTC offset Z。
    PayloadHash:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
      description: 服务端生成的 lowercase SHA-256 hex。
    IngestStatus:
      type: string
      enum: [collected, duplicate, failed, pending_extract]
    EventStatus:
      type: string
      enum: [candidate, confirmed, rejected]
    FactStatus:
      type: string
      enum: [unverified, verified, disputed]
    EvidenceRelation:
      type: string
      enum: [supports, contradicts, context]
    TagKind:
      type: string
      enum: [news_category, index_category]
    TagAssignSource:
      type: string
      enum: [ai, rule]

    EventTagCatalogItem:
      type: object
      additionalProperties: false
      required: [id, tag_kind, code, name, is_active]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        tag_kind:
          $ref: '#/components/schemas/TagKind'
        code:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        is_active:
          type: boolean
          enum: [true]
    EventTagCatalog:
      type: object
      additionalProperties: false
      required: [catalog_revision, catalog_hash, tags]
      properties:
        catalog_revision:
          type: string
          minLength: 1
          maxLength: 128
        catalog_hash:
          $ref: '#/components/schemas/PayloadHash'
        tags:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventTagCatalogItem'
    EventTagCatalogEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        result:
          $ref: '#/components/schemas/EventTagCatalog'

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: 稳定 machine-readable error code。
        message:
          type: string
          minLength: 1
          maxLength: 500
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      x-client-drift-anchor: data.v1.schema.ErrorEnvelope
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          minLength: 1
          maxLength: 128

    ResearchThemeImportRequest:
      type: object
      additionalProperties: false
      x-client-drift-anchor: data.v1.schema.ResearchThemeImportRequest
      required: [analysis_batch_id, analysis_as_of, discovery_window_start, discovery_window_end, theme, reasoning_trees]
      properties:
        analysis_batch_id: {type: string, minLength: 1, maxLength: 200}
        analysis_as_of: {$ref: '#/components/schemas/UTCTimestamp'}
        discovery_window_start: {$ref: '#/components/schemas/UTCTimestamp'}
        discovery_window_end: {$ref: '#/components/schemas/UTCTimestamp'}
        theme: {$ref: '#/components/schemas/ResearchThemeImportItem'}
        reasoning_trees:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ResearchReasoningTreeImportItem'}
    ResearchThemeImportItem:
      type: object
      additionalProperties: false
      required: [theme_key, title, one_line_conclusion, conclusion_direction, impact_strength, attention_level, conclusion_status, transmission_stage, investment_guidance_action, investment_guidance_summary, time_horizon_category, time_horizon_summary, transmission_summary, checkpoint_summary, risk_summary, impacts, events]
      properties:
        theme_key: {type: string, pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'}
        title: {type: string, minLength: 1}
        one_line_conclusion: {type: string, minLength: 1}
        conclusion_direction: {$ref: '#/components/schemas/ResearchDirection'}
        impact_strength: {$ref: '#/components/schemas/ResearchImpactStrength'}
        attention_level: {type: string, enum: [high, medium, low], nullable: true}
        conclusion_status: {type: string, enum: [supported, partial, conflicted], nullable: true}
        transmission_stage: {type: string, enum: [identification, validation, diffusion, dampening]}
        investment_guidance_action: {type: string, enum: [focus, avoid, observe, differentiate]}
        investment_guidance_summary: {type: string, minLength: 1}
        time_horizon_category: {type: string, enum: [short_term, medium_term, long_term, custom]}
        time_horizon_summary: {type: string, nullable: true}
        transmission_summary: {type: string, nullable: true}
        checkpoint_summary: {type: string, nullable: true}
        risk_summary: {type: string, nullable: true}
        impacts:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ResearchThemeImportImpact'}
        events:
          type: array
          items: {$ref: '#/components/schemas/ResearchThemeImportEvent'}
    ResearchThemeImportImpact:
      type: object
      additionalProperties: false
      required: [chain_node_entity_id, relation_role, impact_direction, impact_summary, display_order]
      properties:
        chain_node_entity_id: {$ref: '#/components/schemas/LowercaseUUID'}
        relation_role: {type: string, enum: [driver, beneficiary, constraint, exposure]}
        impact_direction: {$ref: '#/components/schemas/ResearchDirection'}
        impact_summary: {type: string, nullable: true}
        display_order: {type: integer, minimum: 1}
    ResearchThemeImportEvent:
      type: object
      additionalProperties: false
      required: [event_id, evidence_role, supported_claim]
      properties:
        event_id: {$ref: '#/components/schemas/LowercaseUUID'}
        evidence_role: {type: string, enum: [driver, supporting, contradicting, context]}
        supported_claim: {type: string, nullable: true}
    ResearchThemeImportCounts:
      type: object
      additionalProperties: false
      required: [themes, impacts, theme_event_associations, reasoning_trees, nodes, tree_event_associations, signal_associations, receipts]
      properties:
        themes: {type: integer, minimum: 1, maximum: 1}
        impacts: {type: integer, minimum: 1}
        theme_event_associations: {type: integer, minimum: 0}
        reasoning_trees: {type: integer, minimum: 1}
        nodes: {type: integer, minimum: 1}
        tree_event_associations: {type: integer, minimum: 0}
        signal_associations: {type: integer, minimum: 1}
        receipts: {type: integer, minimum: 2, maximum: 2}
    ResearchThemeImportResult:
      type: object
      additionalProperties: false
      x-client-drift-anchor: data.v1.schema.ResearchThemeImportResult
      required: [receipt_id, analysis_batch_id, payload_hash, theme_id, reasoning_tree_ids_by_industry_chain_entity_id, counts, published_at, imported_at, replayed]
      properties:
        receipt_id: {$ref: '#/components/schemas/LowercaseUUID'}
        analysis_batch_id: {type: string}
        payload_hash: {$ref: '#/components/schemas/PayloadHash'}
        theme_id: {$ref: '#/components/schemas/LowercaseUUID'}
        reasoning_tree_ids_by_industry_chain_entity_id:
          type: object
          additionalProperties: {$ref: '#/components/schemas/LowercaseUUID'}
        counts: {$ref: '#/components/schemas/ResearchThemeImportCounts'}
        published_at: {$ref: '#/components/schemas/UTCTimestamp'}
        imported_at: {$ref: '#/components/schemas/UTCTimestamp'}
        replayed: {type: boolean}
    ResearchThemeImportEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id: {type: string}
        result: {$ref: '#/components/schemas/ResearchThemeImportResult'}

    ResearchReasoningTreeImportItem:
      type: object
      additionalProperties: false
      required: [industry_chain_entity_id, title, display_order, one_line_conclusion, fact_summary, transmission_summary, impact_direction, impact_strength, impact_summary, conclusion_boundary_summary, support_summary, counter_summary, invalidation_conditions, checkpoints, events, nodes]
      properties:
        industry_chain_entity_id: {$ref: '#/components/schemas/LowercaseUUID'}
        title: {type: string, minLength: 1}
        display_order: {type: integer, minimum: 1}
        one_line_conclusion: {type: string, minLength: 1}
        fact_summary: {type: string, nullable: true}
        transmission_summary: {type: string, nullable: true}
        impact_direction: {$ref: '#/components/schemas/ResearchDirection'}
        impact_strength: {$ref: '#/components/schemas/ResearchImpactStrength'}
        impact_summary: {type: string, nullable: true}
        conclusion_boundary_summary: {type: string, nullable: true}
        support_summary: {type: string, nullable: true}
        counter_summary: {type: string, nullable: true}
        invalidation_conditions: {type: array, items: {type: string}}
        checkpoints:
          type: array
          items: {$ref: '#/components/schemas/ResearchReasoningTreeImportCheckpoint'}
        events:
          type: array
          description: Must cover every source Event of each formal Signal, DirectImpact, or upstream formal fact referenced by this Reason Tree; Theme-level inclusion alone is insufficient.
          items: {$ref: '#/components/schemas/ResearchReasoningTreeImportEvent'}
        nodes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ResearchReasoningTreeImportNode'}
    ResearchReasoningTreeImportCheckpoint:
      type: object
      additionalProperties: false
      required: [type, summary]
      properties:
        type: {type: string, enum: [event, relationship, metric]}
        summary: {type: string, minLength: 1}
    ResearchReasoningTreeImportEvent:
      type: object
      additionalProperties: false
      required: [event_id, evidence_role, display_order]
      properties:
        event_id: {$ref: '#/components/schemas/LowercaseUUID'}
        evidence_role: {type: string, enum: [driver, supporting, contradicting, context]}
        display_order: {type: integer, minimum: 1}
    ResearchReasoningTreeImportNode:
      type: object
      additionalProperties: false
      required: [position, chain_node_entity_id, state_summary, impact_direction, impact_strength, impact_summary, reasoning_basis_summary, evidence_gap_summary, incoming_industry_chain_graph_edge_id, incoming_transmission_title, incoming_transmission_mechanism, incoming_condition_summary, incoming_lineage, signals]
      properties:
        position: {type: integer, minimum: 1}
        chain_node_entity_id: {$ref: '#/components/schemas/LowercaseUUID'}
        state_summary: {type: string, nullable: true}
        impact_direction: {$ref: '#/components/schemas/ResearchDirection'}
        impact_strength: {$ref: '#/components/schemas/ResearchImpactStrength'}
        impact_summary: {type: string, nullable: true}
        reasoning_basis_summary: {type: string, nullable: true}
        evidence_gap_summary: {type: string, nullable: true}
        incoming_industry_chain_graph_edge_id:
          allOf: [{$ref: '#/components/schemas/LowercaseUUID'}]
          nullable: true
        incoming_transmission_title: {type: string, nullable: true}
        incoming_transmission_mechanism: {type: string, nullable: true}
        incoming_condition_summary: {type: string, nullable: true}
        incoming_lineage:
          description: Null for the first Node and required for every later Node. A formal DirectImpact source Signal subject must equal the previous Node and its target must equal this Node.
          nullable: true
          allOf: [{$ref: '#/components/schemas/ResearchReasoningTreeIncomingLineage'}]
        signals:
          type: array
          minItems: 1
          maxItems: 5
          items: {$ref: '#/components/schemas/ResearchReasoningTreeImportSignal'}
    ResearchReasoningTreeImportSignal:
      type: object
      additionalProperties: false
      required: [variable_signal_key, signal_role, signal_direction, display_summary, display_order, lineage]
      properties:
        variable_signal_key: {type: string, pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'}
        signal_role: {type: string, enum: [primary, supporting, contradicting]}
        signal_direction: {type: string, enum: [increase, decrease, mixed, unchanged, uncertain]}
        display_summary: {type: string, minLength: 1}
        display_order: {type: integer, minimum: 1, maximum: 5}
        lineage: {$ref: '#/components/schemas/ResearchReasoningTreeSignalLineage'}
    ResearchReasoningTreeSignalLineage:
      type: object
      additionalProperties: false
      required: [source_kind, variable_signal_id, semantic_submission_id, evidence_id, evidence_hash, upstream_variable_signal_id, upstream_direct_impact_assertion_id, entity_relation_id, industry_chain_graph_edge_id]
      properties:
        source_kind: {type: string, enum: [formal_signal, analyst_inference]}
        variable_signal_id: {allOf: [{$ref: '#/components/schemas/LowercaseUUID'}], nullable: true}
        semantic_submission_id: {allOf: [{$ref: '#/components/schemas/LowercaseUUID'}], nullable: true}
        evidence_id: {allOf: [{$ref: '#/components/schemas/LowercaseUUID'}], nullable: true}
        evidence_hash: {allOf: [{$ref: '#/components/schemas/PayloadHash'}], nullable: true}
        upstream_variable_signal_id: {allOf: [{$ref: '#/components/schemas/LowercaseUUID'}], nullable: true}
