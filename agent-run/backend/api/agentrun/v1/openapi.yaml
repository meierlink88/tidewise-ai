        message:
          type: string
        active_execution_id:
          type: string
          format: uuid
        skipped_execution_id:
          type: string
          format: uuid
    CollectorRunResponse:
      type: object
      additionalProperties: false
      required:
        - schema
        - agent_key
        - agent_version
        - execution_id
        - status
        - status_url
        - prompt_sha256
        - prompt_bytes
        - invocations
        - candidate_counts
        - artifacts
        - created_at
        - started_at
        - completed_at
        - error_code
        - error_summary
        - stop_reason
        - blocked_by_execution_id
      properties:
        schema:
          type: string
          enum:
            - collector_run.v1
        agent_key:
          type: string
          enum:
            - collector
        agent_version:
          type: string
        execution_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        status_url:
          type: string
          description: Relative URL for this Agent Execution.
        prompt_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the exact accepted Collection Prompt.
        prompt_bytes:
          type: integer
          minimum: 0
          description: Collection Prompt length in UTF-8 bytes.
        invocations:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorInvocation"
        candidate_counts:
          $ref: "#/components/schemas/CandidateCounts"
        artifacts:
          $ref: "#/components/schemas/ArtifactReferences"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          type: string
        error_summary:
          type: string
        stop_reason:
          type: string
        blocked_by_execution_id:
          type: string
          description: Empty unless this skipped Execution was blocked by an active Execution.
    ExecutionStatus:
      type: string
      enum:
        - queued
        - planning
        - collecting
        - materializing
        - running
        - succeeded
        - succeeded_no_change
        - partially_succeeded
        - failed
        - skipped
    ConnectorInvocation:
      type: object
      additionalProperties: false
      required:
        - connector_key
        - status
        - result_count
      properties:
        connector_key:
          type: string
        status:
          $ref: "#/components/schemas/InvocationStatus"
        result_count:
          type: integer
          minimum: 0
        error_code:
          type: string
        error_summary:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    InvocationStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - not_invoked
    CandidateCounts:
      type: object
      description: Collector Candidate and content-level conservation counters.
      additionalProperties:
        type: integer
        minimum: 0
    ArtifactReferences:
      type: object
      description: Completed local Artifact names mapped to their service-side paths.
      additionalProperties:
        type: string
