name: tidewise-neo4j-uat

services:
  neo4j:
    container_name: tidewise-uat-openspg-neo4j
    image: spg-registry.cn-hangzhou.cr.aliyuncs.com/spg/openspg-neo4j@sha256:4bc5b7f6b83d333b1d2c8f60ac145c068d77d50bca65b3a07c927f9e2a541eb9
    restart: unless-stopped
    ports:
      - '0.0.0.0:7474:7474'
      - '0.0.0.0:7687:7687'
    environment:
      TZ: Asia/Shanghai
      NEO4J_AUTH: '${OPENSPG_NEO4J_USER:?OPENSPG_NEO4J_USER is required}/${OPENSPG_NEO4J_PASSWORD:?OPENSPG_NEO4J_PASSWORD is required}'
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_dbms_security_procedures_unrestricted: '*'
      NEO4J_dbms_security_procedures_allowlist: '*'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:7474']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    networks:
      tidewise-uat:
        aliases:
          - release-openspg-neo4j

networks:
  tidewise-uat:
    external: true
    name: tidewise-uat

volumes:
  neo4j-data:
    external: true
    name: tidewise-uat-openspg-neo4j-data
  neo4j-logs:
    external: true
    name: tidewise-uat-openspg-neo4j-logs
