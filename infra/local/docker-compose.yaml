name: tidewise-local

services:
  data-migrate:
    build:
      context: ../..
      dockerfile: data-service/backend/Dockerfile
    image: '${DATA_SERVICE_IMAGE:-tidewise-data:local}'
    entrypoint: ['/usr/local/bin/dbmigrate']
    command: ['-apply']
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      TIDEWISE_DB_HOST: '${TIDEWISE_DB_HOST:-host.docker.internal}'
      TIDEWISW_DB_PASSWORD: '${TIDEWISW_DB_PASSWORD:?set TIDEWISW_DB_PASSWORD in infra/local/.env.local}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'no'
    networks: [tidewise-local]

  data:
    build:
      context: ../..
      dockerfile: data-service/backend/Dockerfile
    image: '${DATA_SERVICE_IMAGE:-tidewise-data:local}'
    ports:
      - '${DATA_SERVICE_PORT:-9011}:9011'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      TIDEWISE_DB_HOST: '${TIDEWISE_DB_HOST:-host.docker.internal}'
      TIDEWISW_DB_PASSWORD: '${TIDEWISW_DB_PASSWORD:?set TIDEWISW_DB_PASSWORD in infra/local/.env.local}'
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      data-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9011/healthz >/dev/null && wget -qO- http://127.0.0.1:9011/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  agentrun:
    build:
      context: ../..
      dockerfile: agent-run/backend/Dockerfile
    image: '${AGENTRUN_SERVICE_IMAGE:-tidewise-agentrun:local}'
    ports:
      - '${AGENTRUN_SERVICE_PORT:-9080}:9080'
    environment:
      APP_ENV: dev
      AGENTRUN_CONFIG_DIR: /app/configs
      AGENTRUN_DB_HOST: '${AGENTRUN_DB_HOST:-host.docker.internal}'
      AGENTRUN_QDRANT_URL: '${AGENTRUN_QDRANT_URL:-http://host.docker.internal:6333}'
      TZ: Asia/Shanghai
      AGENTRUN_DB_PASSWORD: '${AGENTRUN_DB_PASSWORD:?set AGENTRUN_DB_PASSWORD in infra/local/.env.local}'
      AGENTRUN_SERVICE_TOKEN: '${AGENTRUN_SERVICE_TOKEN:?set AGENTRUN_SERVICE_TOKEN in infra/local/.env.local}'
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
      EMBEDDING_API_KEY: '${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY in infra/local/.env.local}'
      QDRANT_API_KEY: '${QDRANT_API_KEY:-}'
    volumes:
      - agentrun_artifacts:/app/data
    depends_on:
      agentrun-agent-version:
        condition: service_completed_successfully
      data:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9080/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  agentrun-migrate:
    build:
      context: ../..
      dockerfile: agent-run/backend/Dockerfile
    image: '${AGENTRUN_SERVICE_IMAGE:-tidewise-agentrun:local}'
    entrypoint: ['/app/agentrun-migrate']
    environment:
      APP_ENV: dev
      AGENTRUN_CONFIG_DIR: /app/configs
      AGENTRUN_DB_HOST: '${AGENTRUN_DB_HOST:-host.docker.internal}'
      TZ: Asia/Shanghai
      AGENTRUN_DB_PASSWORD: '${AGENTRUN_DB_PASSWORD:?set AGENTRUN_DB_PASSWORD in infra/local/.env.local}'
      AGENTRUN_SERVICE_TOKEN: '${AGENTRUN_SERVICE_TOKEN:?set AGENTRUN_SERVICE_TOKEN in infra/local/.env.local}'
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'no'
    networks: [tidewise-local]

  agentrun-agent-version:
    build:
      context: ../..
      dockerfile: agent-run/backend/Dockerfile
    image: '${AGENTRUN_SERVICE_IMAGE:-tidewise-agentrun:local}'
    entrypoint: ['/app/agentrun-agent-version']
    command: ['publish-current']
    environment:
      APP_ENV: dev
      AGENTRUN_CONFIG_DIR: /app/configs
      AGENTRUN_DB_HOST: '${AGENTRUN_DB_HOST:-host.docker.internal}'
      TZ: Asia/Shanghai
      AGENTRUN_DB_PASSWORD: '${AGENTRUN_DB_PASSWORD:?set AGENTRUN_DB_PASSWORD in infra/local/.env.local}'
    depends_on:
      agentrun-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'no'
    networks: [tidewise-local]

  miniapp:
    build:
      context: ../..
      dockerfile: miniapp/backend/Dockerfile
    image: '${MINIAPP_SERVICE_IMAGE:-tidewise-miniapp:local}'
    ports:
      - '${MINIAPP_SERVICE_PORT:-9012}:9012'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      DATA_SERVICE_BASE_URL: http://data:9011
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9012/healthz >/dev/null && wget -qO- http://127.0.0.1:9012/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  adminportal:
    build:
      context: ../..
      dockerfile: admin-portal/backend/Dockerfile
    image: '${ADMIN_SERVICE_IMAGE:-tidewise-adminportal:local}'
    ports:
      - '${ADMIN_SERVICE_PORT:-9013}:9013'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      ADMIN_SERVICE_TOKEN: '${ADMIN_SERVICE_TOKEN:?set ADMIN_SERVICE_TOKEN in infra/local/.env.local}'
      ADMIN_ALLOWED_ORIGIN: '${ADMIN_ALLOWED_ORIGIN:-http://127.0.0.1:9014}'
      DATA_SERVICE_BASE_URL: http://data:9011
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
      AGENTRUN_BASE_URL: http://agentrun:9080
      AGENTRUN_SERVICE_TOKEN: '${AGENTRUN_SERVICE_TOKEN:?set AGENTRUN_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      data:
        condition: service_healthy
      agentrun:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9013/healthz >/dev/null && wget -qO- http://127.0.0.1:9013/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  admin:
    build:
      context: ../..
      dockerfile: admin-portal/frontend/Dockerfile
    image: '${ADMIN_WEB_IMAGE:-tidewise-admin:local}'
    ports:
      - '${ADMIN_WEB_PORT:-9014}:9014'
    environment:
      ADMIN_BACKEND_URL: http://adminportal:9013
    depends_on:
      adminportal:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9014/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

networks:
  tidewise-local:
    name: '${COMPOSE_NETWORK_NAME:-tidewise-local}'

volumes:
  agentrun_artifacts:
