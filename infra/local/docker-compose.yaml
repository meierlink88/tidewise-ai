name: tidewise-local

services:
  postgres:
    image: postgres:16
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-tidewise}'
      POSTGRES_PASSWORD: '${TIDEWISW_DB_PASSWORD:?set TIDEWISW_DB_PASSWORD in infra/local/.env.local}'
      POSTGRES_DB: '${POSTGRES_DB:-tidewise_local}'
    volumes:
      - tidewise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tidewise} -d ${POSTGRES_DB:-tidewise_local}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tidewise-local]

  agentrun-db-init:
    image: postgres:16
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: '${POSTGRES_USER:-tidewise}'
      POSTGRES_PASSWORD: '${TIDEWISW_DB_PASSWORD:?set TIDEWISW_DB_PASSWORD in infra/local/.env.local}'
      POSTGRES_DB: '${POSTGRES_DB:-tidewise_local}'
      AGENTRUN_DATABASE_USER: '${AGENTRUN_DATABASE_USER:-agentrun}'
      AGENTRUN_DB_PASSWORD: '${AGENTRUN_DB_PASSWORD:?set AGENTRUN_DB_PASSWORD in infra/local/.env.local}'
      AGENTRUN_DATABASE_NAME: '${AGENTRUN_DATABASE_NAME:-tidewise_ai_server}'
    volumes:
      - ./bootstrap-agentrun-db.sh:/usr/local/bin/bootstrap-agentrun-db:ro
    entrypoint: ['/usr/local/bin/bootstrap-agentrun-db']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [tidewise-local]

  neo4j:
    image: neo4j:5-community
    ports:
      - '${NEO4J_HTTP_PORT:-7474}:7474'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    environment:
      NEO4J_AUTH: '${NEO4J_USERNAME:?set NEO4J_USERNAME in infra/local/.env.local}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in infra/local/.env.local}'
      NEO4J_server_memory_heap_initial__size: '${NEO4J_HEAP_INITIAL_SIZE:-512m}'
      NEO4J_server_memory_heap_max__size: '${NEO4J_HEAP_MAX_SIZE:-1G}'
    volumes:
      - tidewise_neo4j_data:/data
      - tidewise_neo4j_logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  data:
    build:
      context: ../..
      dockerfile: analyse-data-service/backend/Dockerfile
    image: '${DATA_SERVICE_IMAGE:-tidewise-data:local}'
    ports:
      - '${DATA_SERVICE_PORT:-9011}:9011'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs/compose
      TIDEWISW_DB_PASSWORD: '${TIDEWISW_DB_PASSWORD:?set TIDEWISW_DB_PASSWORD in infra/local/.env.local}'
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9011/healthz >/dev/null && wget -qO- http://127.0.0.1:9011/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  agentrun:
    build:
      context: ../..
      dockerfile: agent-run/backend/Dockerfile
    image: '${AGENTRUN_SERVICE_IMAGE:-tidewise-agentrun:local}'
    ports:
      - '${AGENTRUN_SERVICE_PORT:-9080}:9080'
    environment:
      APP_ENV: dev
      AGENTRUN_CONFIG_DIR: /app/configs/compose
      TZ: Asia/Shanghai
      AGENTRUN_DB_PASSWORD: '${AGENTRUN_DB_PASSWORD:?set AGENTRUN_DB_PASSWORD in infra/local/.env.local}'
      AGENTRUN_SERVICE_TOKEN: '${AGENTRUN_SERVICE_TOKEN:?set AGENTRUN_SERVICE_TOKEN in infra/local/.env.local}'
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
      AGENTRUN_DATA_BASE_URL: http://data:9011
    volumes:
      - agentrun_artifacts:/app/data
    depends_on:
      agentrun-migrate:
        condition: service_completed_successfully
      data:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9080/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  agentrun-migrate:
    build:
      context: ../..
      dockerfile: agent-run/backend/Dockerfile
    image: '${AGENTRUN_SERVICE_IMAGE:-tidewise-agentrun:local}'
    entrypoint: ['/app/agentrun-migrate']
    environment:
      APP_ENV: dev
      AGENTRUN_CONFIG_DIR: /app/configs/compose
      TZ: Asia/Shanghai
      AGENTRUN_DB_PASSWORD: '${AGENTRUN_DB_PASSWORD:?set AGENTRUN_DB_PASSWORD in infra/local/.env.local}'
      AGENTRUN_SERVICE_TOKEN: '${AGENTRUN_SERVICE_TOKEN:?set AGENTRUN_SERVICE_TOKEN in infra/local/.env.local}'
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      agentrun-db-init:
        condition: service_completed_successfully
    restart: 'no'
    networks: [tidewise-local]

  miniapp:
    build:
      context: ../..
      dockerfile: miniapp/backend/Dockerfile
    image: '${MINIAPP_SERVICE_IMAGE:-tidewise-miniapp:local}'
    ports:
      - '${MINIAPP_SERVICE_PORT:-9012}:9012'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/config
      DATA_SERVICE_BASE_URL: http://data:9011
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9012/healthz >/dev/null && wget -qO- http://127.0.0.1:9012/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  adminportal:
    build:
      context: ../..
      dockerfile: admin-portal/backend/Dockerfile
    image: '${ADMIN_SERVICE_IMAGE:-tidewise-adminportal:local}'
    ports:
      - '${ADMIN_SERVICE_PORT:-9013}:9013'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/config
      ADMIN_SERVICE_TOKEN: '${ADMIN_SERVICE_TOKEN:?set ADMIN_SERVICE_TOKEN in infra/local/.env.local}'
      ADMIN_ALLOWED_ORIGIN: '${ADMIN_ALLOWED_ORIGIN:-http://127.0.0.1:5174}'
      DATA_SERVICE_BASE_URL: http://data:9011
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
      AGENTRUN_BASE_URL: http://agentrun:9080
      AGENTRUN_SERVICE_TOKEN: '${AGENTRUN_SERVICE_TOKEN:?set AGENTRUN_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      data:
        condition: service_healthy
      agentrun:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9013/healthz >/dev/null && wget -qO- http://127.0.0.1:9013/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

networks:
  tidewise-local:
    name: '${COMPOSE_NETWORK_NAME:-tidewise-local}'

volumes:
  tidewise_postgres_data:
  tidewise_neo4j_data:
  tidewise_neo4j_logs:
  agentrun_artifacts:
