name: tidewise-app

services:
  data-migrate:
    profiles: ['operations']
    build:
      context: ../..
      dockerfile: data-service/backend/Dockerfile
    image: '${DATA_SERVICE_IMAGE:-tidewise-data:local}'
    entrypoint: ['/usr/local/bin/dbmigrate']
    command: ['-apply']
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      TIDEWISE_DB_HOST: '${TIDEWISE_DB_HOST:-postgres}'
      TIDEWISW_DB_PASSWORD: '${TIDEWISW_DB_PASSWORD:-${POSTGRES_PASSWORD:?set TIDEWISW_DB_PASSWORD or POSTGRES_PASSWORD in infra/local/.env.local}}'
    healthcheck:
      disable: true
    restart: 'no'
    networks: [tidewise-local]

  data:
    container_name: data-service
    build:
      context: ../..
      dockerfile: data-service/backend/Dockerfile
    image: '${DATA_SERVICE_IMAGE:-tidewise-data:local}'
    ports:
      - '${DATA_SERVICE_PORT:-9011}:9011'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      TIDEWISE_DB_HOST: '${TIDEWISE_DB_HOST:-postgres}'
      TIDEWISW_DB_PASSWORD: '${TIDEWISW_DB_PASSWORD:-${POSTGRES_PASSWORD:?set TIDEWISW_DB_PASSWORD or POSTGRES_PASSWORD in infra/local/.env.local}}'
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9011/healthz >/dev/null && wget -qO- http://127.0.0.1:9011/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  miniapp:
    container_name: miniapp-service
    build:
      context: ../..
      dockerfile: miniapp/backend/Dockerfile
    image: '${MINIAPP_SERVICE_IMAGE:-tidewise-miniapp:local}'
    ports:
      - '${MINIAPP_SERVICE_PORT:-9012}:9012'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      DATA_SERVICE_BASE_URL: http://data:9011
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9012/healthz >/dev/null && wget -qO- http://127.0.0.1:9012/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  adminportal:
    container_name: admin-portal-service
    build:
      context: ../..
      dockerfile: admin-portal/backend/Dockerfile
    image: '${ADMIN_SERVICE_IMAGE:-tidewise-adminportal:local}'
    ports:
      - '${ADMIN_SERVICE_PORT:-9013}:9013'
    environment:
      APP_ENV: local
      TIDEWISE_CONFIG_DIR: /app/configs
      ADMIN_SERVICE_TOKEN: '${ADMIN_SERVICE_TOKEN:?set ADMIN_SERVICE_TOKEN in infra/local/.env.local}'
      ADMIN_ALLOWED_ORIGIN: '${ADMIN_ALLOWED_ORIGIN:-http://127.0.0.1:9014}'
      RAW_EVIDENCE_PUBLIC_BASE_URL: '${RAW_EVIDENCE_PUBLIC_BASE_URL:-http://127.0.0.1:9000}'
      DATA_SERVICE_BASE_URL: http://data:9011
      DATA_SERVICE_TOKEN: '${DATA_SERVICE_TOKEN:?set DATA_SERVICE_TOKEN in infra/local/.env.local}'
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9013/healthz >/dev/null && wget -qO- http://127.0.0.1:9013/readyz >/dev/null'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

  admin:
    container_name: admin-portal-web
    build:
      context: ../..
      dockerfile: admin-portal/frontend/Dockerfile
    image: '${ADMIN_WEB_IMAGE:-tidewise-admin:local}'
    ports:
      - '${ADMIN_WEB_PORT:-9014}:9014'
    environment:
      ADMIN_BACKEND_URL: http://adminportal:9013
    depends_on:
      adminportal:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9014/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [tidewise-local]

networks:
  tidewise-local:
    external: true
    name: '${COMPOSE_NETWORK_NAME:-tidewise-local}'
