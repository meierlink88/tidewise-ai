name: tidewise-infra

services:
  postgres:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-tidewise}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/local/.env.local}'
      POSTGRES_DB: '${POSTGRES_DB:-tidewise_local}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tidewise} -d ${POSTGRES_DB:-tidewise_local}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tidewise-local]

  mysql:
    image: spg-registry.cn-hangzhou.cr.aliyuncs.com/spg/openspg-mysql@sha256:71eb546d5fc5faf70b3d8a358c022f601591b54a029b79298f2fa0302e46de9a
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: '${OPENSPG_MYSQL_ROOT_PASSWORD:-openspg}'
      MYSQL_DATABASE: openspg
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [tidewise-local]

  minio:
    image: spg-registry.cn-hangzhou.cr.aliyuncs.com/spg/openspg-minio@sha256:9493c8e8f77edb10d556255d49ba8b5761b0fe57889235dfd10619c0513da007
    restart: unless-stopped
    command:
      - server
      - --console-address
      - :9001
      - /data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ACCESS_KEY: '${OPENSPG_MINIO_ACCESS_KEY:-minio}'
      MINIO_SECRET_KEY: '${OPENSPG_MINIO_SECRET_KEY:-minio@openspg}'
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [tidewise-local]

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - '127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333'
      - '127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD', 'bash', '-c', ': >/dev/tcp/127.0.0.1/6333']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [tidewise-local]

networks:
  tidewise-local:
    name: '${COMPOSE_NETWORK_NAME:-tidewise-local}'

volumes:
  postgres-data:
    external: true
    name: local_tidewise_postgres_data
  mysql-data:
    external: true
    name: tidewise-reason_mysql-data
  minio-data:
    external: true
    name: tidewise-reason_minio-data
  qdrant-data:
    external: true
    name: tidewise-qdrant-local-storage
