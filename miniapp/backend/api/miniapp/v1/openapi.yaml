openapi: 3.0.4
info:
  title: Tidewise Miniapp Service API
  version: 1.0.0
  description: Miniapp BFF 的手写 REST + JSON 合同；报告内容只重组 Data 投影，不翻译 code 或 label。
servers:
  - url: /
    description: 由运行环境注入 Miniapp Service origin。
tags:
  - name: Operations
  - name: Reports
  - name: Identity
paths:
  /api/miniapp/v1/auth/wechat/login:
    post:
      tags:
        - Identity
      operationId: loginMiniappWechat
      summary: 微信登录
      security:
        - {}
        - UserSession: []
      responses:
        '200':
          description: '成功；Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityEnvelope'
        '400':
          description: INVALID_REQUEST / WECHAT_CODE_INVALID
        '401':
          description: UNAUTHENTICATED
        '403':
          description: USER_DISABLED / WECHAT_LOGIN_REJECTED
        '429':
          description: LOGIN_RATE_LIMITED
        '503':
          description: AUTH_SERVICE_UNAVAILABLE
      description: 可携带旧会话，同一微信身份成功登录后撤销旧会话。code 不自动重试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 512
  /api/miniapp/v1/auth/me:
    get:
      tags:
        - Identity
      operationId: getMiniappUser
      summary: 验证会话并读取用户
      security:
        - UserSession: []
      responses:
        '200':
          description: '成功；Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityEnvelope'
        '400':
          description: INVALID_REQUEST / WECHAT_CODE_INVALID
        '401':
          description: UNAUTHENTICATED
        '403':
          description: USER_DISABLED / WECHAT_LOGIN_REJECTED
        '429':
          description: LOGIN_RATE_LIMITED
        '503':
          description: AUTH_SERVICE_UNAVAILABLE
  /api/miniapp/v1/auth/logout:
    post:
      tags:
        - Identity
      operationId: logoutMiniappUser
      summary: 撤销当前会话
      security:
        - UserSession: []
      responses:
        '200':
          description: '成功；Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '400':
          description: INVALID_REQUEST / WECHAT_CODE_INVALID
        '401':
          description: UNAUTHENTICATED
        '403':
          description: USER_DISABLED / WECHAT_LOGIN_REJECTED
        '429':
          description: LOGIN_RATE_LIMITED
        '503':
          description: AUTH_SERVICE_UNAVAILABLE
  /api/miniapp/v1/auth/profile:
    patch:
      tags:
        - Identity
      operationId: updateMiniappNickname
      summary: 更新当前用户昵称
      security:
        - UserSession: []
      responses:
        '200':
          description: '成功；Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityEnvelope'
        '400':
          description: INVALID_REQUEST / WECHAT_CODE_INVALID
        '401':
          description: UNAUTHENTICATED
        '403':
          description: USER_DISABLED / WECHAT_LOGIN_REJECTED
        '429':
          description: LOGIN_RATE_LIMITED
        '503':
          description: AUTH_SERVICE_UNAVAILABLE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - nickname
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 32
  /healthz:
    get:
      tags: [Operations]
      operationId: getMiniappHealth
      summary: Miniapp Service 存活检查
      responses:
        '200':
          {
            description: 进程存活,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } }
          }
  /readyz:
    get:
      tags: [Operations]
      operationId: getMiniappReadiness
      summary: Miniapp Service 就绪检查
      responses:
        '200':
          {
            description: 服务配置就绪,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } } }
          }
  /api/miniapp/v1/reports/home:
    get:
      tags: [Reports]
      operationId: getReportHome
      summary: 读取最新 v4/v5 Report，返回三个分组首批卡片
      responses:
        '200':
          {
            description: Report 首页集合或明确空集合,
            content: { application/json: { schema: { $ref: '#/components/schemas/HomeEnvelope' } } }
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ReportServiceUnavailable' }
  /api/miniapp/v1/reports/{report_id}/evidences:
    get:
      tags: [Reports]
      operationId: listReportEvidences
      summary: 使用 Data 签发的 opaque scope token 读取 Evidence 展示投影
      parameters:
        - $ref: '#/components/parameters/ReportID'
        - name: scope_token
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ScopeToken' }
      responses:
        '200':
          {
            description: Evidence 展示列表,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EvidenceEnvelope' } } }
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ReportServiceUnavailable' }
  /api/miniapp/v1/reports/{report_id}/analyses/{kind}:
    get:
      tags:
        - Reports
      operationId: listReportAnalyses
      summary: 分页读取故事线或概念结论卡片
      parameters:
        - $ref: '#/components/parameters/ReportID'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - geopolitical_stories
              - macroeconomic_stories
              - concept_analyses
              - industry_chain_analyses
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Report v4/v5 读取投影，证据数量由 Data 发布端计算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ReportServiceUnavailable'
  /api/miniapp/v1/reports/{report_id}/analyses/{kind}/{analysis_key}:
    get:
      tags:
        - Reports
      operationId: getReportAnalysis
      summary: 读取故事线或概念的因果链目录
      parameters:
        - $ref: '#/components/parameters/ReportID'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - geopolitical_stories
              - macroeconomic_stories
              - concept_analyses
              - industry_chain_analyses
        - name: analysis_key
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LocalKey'
      responses:
        '200':
          description: Report v4/v5 读取投影，证据数量由 Data 发布端计算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDetailEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ReportServiceUnavailable'
  /api/miniapp/v1/reports/{report_id}/analyses/{kind}/{analysis_key}/industry-chains/{chain_key}:
    get:
      tags:
        - Reports
      operationId: getReportAnalysisChain
      summary: 读取指定故事线或概念下的产业链推理与节点图谱
      parameters:
        - $ref: '#/components/parameters/ReportID'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - geopolitical_stories
              - macroeconomic_stories
              - concept_analyses
              - industry_chain_analyses
        - name: analysis_key
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LocalKey'
        - name: chain_key
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LocalKey'
      responses:
        '200':
          description: Report v4/v5 读取投影，证据数量由 Data 发布端计算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisChainEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ReportServiceUnavailable'
components:
  securitySchemes:
    UserSession:
      type: http
      scheme: bearer
      description: User Service 签发的用户会话，不是服务调用 token。
  parameters:
    ReportID:
      name: report_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ReportID' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 2048 }
  responses:
    InvalidRequest:
      description: 请求参数无效
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Report、详情或 Evidence scope 不存在
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ReportServiceUnavailable:
      description: Data Report 服务暂不可用或返回无效合同
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    IdentityProfile:
      type: object
      required:
        - user_id
        - nickname
        - status
        - expires_at
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 32
        status:
          type: string
          enum:
            - active
        expires_at:
          type: string
          format: date-time
        session_token:
          type: string
          description: 仅登录成功时返回
          minLength: 43
          maxLength: 43
    IdentityEnvelope:
      type: object
      required:
        - request_id
        - result
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/IdentityProfile'
    LogoutEnvelope:
      type: object
      required:
        - request_id
        - result
      properties:
        request_id:
          type: string
        result:
          type: object
          required:
            - revoked
          properties:
            revoked:
              type: boolean
              enum:
                - true
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        environment: { type: string }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, checks]
      properties:
        status: { type: string, enum: [ready] }
        service: { type: string }
        environment: { type: string }
        checks: { type: object, additionalProperties: { type: string } }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        request_id: { type: string }
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    ReportID:
      type: string
      pattern: '^RPT[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ScopeToken:
      type: string
      pattern: '^RPE[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    NullableScopeToken:
      type: string
      nullable: true
      pattern: '^RPE[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    LocalKey:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    CodedLabel:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
      description: BFF 原样透传 Data 发布的 code 与中文 label；前端未知 code 使用中性样式。
    Confidence:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
    TimeWindow:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
    Reference:
      type: object
      additionalProperties: false
      required: [type, local_key]
      properties:
        type:
          { type: string, enum: [layer, anchor, macro_anchor, industry_chain, industry_chain_node] }
        local_key: { $ref: '#/components/schemas/LocalKey' }
    Summary:
      type: object
      additionalProperties: false
      required: [id, generated_at, published_at, industry_chain_count]
      properties:
        id: { $ref: '#/components/schemas/ReportID' }
        generated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        industry_chain_count: { type: integer, minimum: 0 }
        schema_version: { type: string, enum: [report-publication/v6] }
    Selection:
      type: object
      additionalProperties: false
      required: [mode, date, timezone]
      properties:
        mode: { type: string, enum: [today, latest_fallback] }
        date: { type: string, format: date }
        timezone: { type: string, enum: [Asia/Shanghai] }
    CardImpactItem:
      type: object
      additionalProperties: false
      required:
        [
          ref,
          name,
          result,
          conclusion_basis,
          validation_status,
          confidence,
          time_window,
          evidence_scope_token
        ]
      properties:
        ref: { $ref: '#/components/schemas/Reference' }
        name: { type: string }
        result: { $ref: '#/components/schemas/CodedLabel' }
        conclusion_basis: { $ref: '#/components/schemas/CodedLabel' }
        validation_status: { $ref: '#/components/schemas/CodedLabel' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        time_window: { $ref: '#/components/schemas/TimeWindow' }
        evidence_scope_token: { $ref: '#/components/schemas/NullableScopeToken' }
    Card:
      type: object
      additionalProperties: false
      required:
        [
          local_key,
          kind,
          detail_ref,
          title,
          subtitle,
          conclusion,
          result,
          confidence,
          time_window,
          impact_items,
          evidence_scope_token
        ]
      properties:
        local_key: { $ref: '#/components/schemas/LocalKey' }
        kind: { type: string, enum: [geopolitics, macroeconomics, industry_chain] }
        detail_ref: { $ref: '#/components/schemas/Reference' }
        title: { type: string }
        subtitle: { type: string }
        conclusion: { type: string }
        result: { $ref: '#/components/schemas/CodedLabel' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        time_window: { $ref: '#/components/schemas/TimeWindow' }
        impact_items: { type: array, items: { $ref: '#/components/schemas/CardImpactItem' } }
        evidence_scope_token: { $ref: '#/components/schemas/NullableScopeToken' }
    HomeReport:
      type: object
      additionalProperties: false
      required: [report, cards, next_cursor]
      properties:
        analysis_groups:
          {
            type: array,
            minItems: 3,
            maxItems: 4,
            items: { $ref: '#/components/schemas/AnalysisGroup' }
          }
        report: { $ref: '#/components/schemas/Summary' }
        cards: { type: array, items: { $ref: '#/components/schemas/Card' } }
        next_cursor: { type: string, minLength: 1, maxLength: 2048, nullable: true }
    HomeResponse:
      type: object
      additionalProperties: false
      required: [selection, reports]
      properties:
        selection: { $ref: '#/components/schemas/Selection' }
        reports: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/HomeReport' } }
    EvidenceItem:
      type: object
      additionalProperties: false
      required: [published_at, summary, keywords]
      properties:
        published_at: { type: string, format: date-time, nullable: true }
        summary: { type: string }
        keywords: { type: array, items: { type: string } }
        semantic_tags:
          description: Optional preformatted labels extracted from existing Evidence semantic; absent when unavailable. Existing fields remain unchanged.
          type: array
          items: { $ref: '#/components/schemas/EvidenceSemanticTag' }
    EvidenceSemanticTag:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: { type: string, enum: [actor, action, object, metric] }
        text: { type: string, minLength: 1, maxLength: 2000 }

    EvidenceCollection:
      type: object
      additionalProperties: false
      required: [report_id, scope_token, items]
      properties:
        report_id: { $ref: '#/components/schemas/ReportID' }
        scope_token: { $ref: '#/components/schemas/ScopeToken' }
        items: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } }
    HomeEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id: { type: string }
        result: { $ref: '#/components/schemas/HomeResponse' }
    EvidenceEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id: { type: string }
        result: { $ref: '#/components/schemas/EvidenceCollection' }
    NormalizedSummaryProjection:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - local_key
        - source_id
        - title
        - summary
        - affected_anchors
        - chain_count
      properties:
        judgment_origin:
          type: string
          enum:
            - direct
            - inferred
        schema_version:
          type: string
          enum:
            - report-publication/v4
            - report-publication/v5
        local_key:
          type: string
        source_id:
          type: string
        title:
          type: string
        summary:
          type: object
          properties:
            conclusion:
              type: string
              minLength: 1
            transmission_logic:
              type: string
              minLength: 1
            impact_assessment:
              type: object
              properties:
                level:
                  type: string
                  enum:
                    - high
                    - medium
                    - low
                    - pending
                rationale:
                  type: string
                  minLength: 1
                evidence_count:
                  type: integer
                  minimum: 0
                  description: Server-computed distinct Evidence count in this scope.
                evidence_scope_token:
                  type: string
                  nullable: true
                  pattern: ^RPE[0-9a-f-]{36}$
              required:
                - level
                - rationale
                - evidence_count
                - evidence_scope_token
              additionalProperties: false
            affected_refs:
              type: array
              items:
                $ref: '#/components/schemas/NormalizedReadAnchorRef'
            evidence_count:
              type: integer
              minimum: 0
              description: Server-computed distinct Evidence count in this scope.
            evidence_scope_token:
              type: string
              nullable: true
              pattern: ^RPE[0-9a-f-]{36}$
          required:
            - conclusion
            - transmission_logic
            - impact_assessment
            - affected_refs
            - evidence_count
            - evidence_scope_token
          additionalProperties: false
        affected_anchors:
          type: array
          items:
            $ref: '#/components/schemas/NormalizedResolvedAnchor'
        chain_count:
          type: integer
          minimum: 0
    NormalizedReadAnchorRef:
      type: object
      properties:
        target_type:
          type: string
          enum:
            - macroeconomic_story
            - industry_chain
            - industry_chain_node
        local_key:
          type: string
          minLength: 1
        chain_local_key:
          type: string
          minLength: 1
          nullable: true
      required:
        - target_type
        - local_key
        - chain_local_key
      additionalProperties: false
    NormalizedResolvedAnchor:
      type: object
      additionalProperties: false
      required:
        - reference
        - source_id
        - name
        - assessment
      properties:
        judgment_origin:
          type: string
          enum:
            - direct
            - inferred
        reference:
          $ref: '#/components/schemas/NormalizedAnchorRef'
        source_id:
          type: string
        name:
          type: string
        assessment:
          $ref: '#/components/schemas/NormalizedReadAssessment'
    NormalizedAnchorRef:
      type: object
      properties:
        target_type:
          type: string
          enum:
            - macroeconomic_story
            - industry_chain
            - industry_chain_node
        local_key:
          type: string
          minLength: 1
        chain_local_key:
          type: string
          minLength: 1
          nullable: true
      required:
        - target_type
        - local_key
        - chain_local_key
      additionalProperties: false
    NormalizedReadAssessment:
      type: object
      properties:
        conclusion:
          type: string
          minLength: 1
        direction:
          type: string
          enum:
            - warming
            - cooling
            - diverging
            - pending
        conclusion_basis:
          type: string
          enum:
            - reasoning_hypothesis
            - observation_only
        validation_status:
          type: string
          enum:
            - pending_validation
            - insufficient_evidence
        confidence:
          type: string
          enum:
            - low
            - medium
            - high
          nullable: true
        forecast_window:
          $ref: '#/components/schemas/NormalizedReadWindow'
        scope:
          type: string
          minLength: 1
        conditions:
          type: array
          items:
            type: string
            minLength: 1
        follow_up:
          type: array
          items:
            type: string
            minLength: 1
        transmission_logic:
          type: string
          minLength: 1
        evidence_count:
          type: integer
          minimum: 0
          description: Server-computed distinct Evidence count in this scope.
        evidence_scope_token:
          type: string
          nullable: true
          pattern: ^RPE[0-9a-f-]{36}$
      required:
        - conclusion
        - direction
        - conclusion_basis
        - validation_status
        - confidence
        - forecast_window
        - scope
        - conditions
        - follow_up
        - transmission_logic
        - evidence_count
        - evidence_scope_token
      additionalProperties: false
    NormalizedReadWindow:
      type: object
      properties:
        kind:
          type: string
          enum:
            - relative
            - calendar
            - stage
            - mixed
            - not_applicable
        description:
          type: string
          minLength: 1
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
      required:
        - kind
        - description
        - start_at
        - end_at
      additionalProperties: false
    NormalizedDetailProjection:
      type: object
      additionalProperties: false
      required:
        - summary
        - macro_impacts
        - industry_chains
      properties:
        published_at:
          type: string
          format: date-time
          description: Publication time of the owning report, composed by Miniapp Service from existing Data report summaries. Optional for compatibility with older Miniapp Service responses.
        judgment_origin:
          type: string
          enum:
            - direct
            - inferred
        reasoning_sources:
          $ref: '#/components/schemas/NormalizedReasoningSources'
