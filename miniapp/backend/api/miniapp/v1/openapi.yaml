openapi: 3.0.4
info:
  title: Tidewise Miniapp Service API
  version: 1.0.0
  description: Miniapp BFF 的手写 REST + JSON 合同。当前公开业务接口不要求认证。
servers:
  - url: /
    description: 由运行环境注入 Miniapp Service origin。
tags:
  - name: Operations
  - name: Research
paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getMiniappHealth
      summary: Miniapp Service 存活检查
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [Operations]
      operationId: getMiniappReadiness
      summary: Miniapp Service 就绪检查
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/miniapp/v1/research/themes:
    get:
      tags: [Research]
      operationId: listMiniappResearchThemes
      summary: 获取首页 Research Theme 列表
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ResearchThemePageSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/miniapp/v1/research/themes/{theme_id}:
    get:
      tags: [Research]
      operationId: getMiniappResearchTheme
      summary: 获取一个 Research Theme 详情
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ThemeID'
        - $ref: '#/components/parameters/WindowHours'
      responses:
        '200':
          $ref: '#/components/responses/ResearchThemeDetailSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/miniapp/v1/research/themes/{theme_id}/reasoning-trees:
    get:
      tags: [Research]
      operationId: listMiniappResearchReasoningTrees
      summary: 获取 Theme 的推理树 Tab 列表
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ThemeID'
      responses:
        '200':
          $ref: '#/components/responses/ReasoningTreeListSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/miniapp/v1/research/themes/{theme_id}/reasoning-trees/{reasoning_tree_id}:
    get:
      tags: [Research]
      operationId: getMiniappResearchReasoningTree
      summary: 获取 Theme 下的一棵推理树
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/ThemeID'
        - $ref: '#/components/parameters/ReasoningTreeID'
      responses:
        '200':
          $ref: '#/components/responses/ReasoningTreeDetailSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失或不合法时由 Miniapp Service 生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ThemeID:
      name: theme_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ReasoningTreeID:
      name: reasoning_tree_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    WindowHours:
      name: window_hours
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 168
        default: 24
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
  headers:
    RequestID:
      required: true
      description: 与响应 body 中 request_id 一致。
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    ResearchThemePageSuccess:
      description: 首页 Theme 列表
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchThemePageEnvelope'
    ResearchThemeDetailSuccess:
      description: Theme 详情
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchThemeDetailEnvelope'
    ReasoningTreeListSuccess:
      description: 推理树 Tab 列表
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReasoningTreeListEnvelope'
    ReasoningTreeDetailSuccess:
      description: 单棵推理树
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReasoningTreeDetailEnvelope'
    BadRequest:
      description: 请求参数不合法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Theme 或推理树不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Miniapp Service 内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: Data Service 暂时不可用或返回不可信结果
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    UUID:
      type: string
      format: uuid
    UTCTimestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp。
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        environment:
          type: string
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, checks]
      properties:
        status:
          type: string
          enum: [ready]
        service:
          type: string
        environment:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
    ResearchThemePageEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ResearchThemePage'
    ResearchThemeDetailEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ResearchThemeDetail'
    ReasoningTreeListEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ReasoningTreeList'
    ReasoningTreeDetailEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/ReasoningTreeDetail'
    ResearchThemePage:
      type: object
      additionalProperties: false
      required: [window_start, window_end, as_of, theme_count, event_count, items, next_cursor]
      properties:
        window_start: {$ref: '#/components/schemas/UTCTimestamp'}
        window_end: {$ref: '#/components/schemas/UTCTimestamp'}
        as_of: {$ref: '#/components/schemas/UTCTimestamp'}
        theme_count: {type: integer, minimum: 0}
        event_count: {type: integer, minimum: 0}
        items: {type: array, items: {$ref: '#/components/schemas/ResearchTheme'}}
        next_cursor: {type: string, nullable: true}
    ResearchTheme:
      type: object
      additionalProperties: false
      required: [id, analysis_batch_id, title, one_line_conclusion, conclusion_direction, impact_strength, attention_level, conclusion_status, transmission_stage, investment_guidance_action, investment_guidance_summary, time_horizon_category, time_horizon_summary, transmission_summary, checkpoint_summary, risk_summary, analysis_as_of, window_start, window_end, published_at, impacts, evidence_event_count, reasoning_tree_count]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        analysis_batch_id: {type: string}
        title: {type: string}
        one_line_conclusion: {type: string}
        conclusion_direction: {type: string, enum: [positive, negative, mixed, neutral, uncertain]}
        impact_strength: {type: string, enum: [strong, medium, weak, unknown]}
        attention_level: {type: string, enum: [high, medium, low], nullable: true}
        conclusion_status: {type: string, enum: [supported, partial, conflicted], nullable: true}
        transmission_stage: {type: string, enum: [identification, validation, diffusion, dampening]}
        investment_guidance_action: {type: string, enum: [focus, avoid, observe, differentiate]}
        investment_guidance_summary: {type: string}
        time_horizon_category: {type: string, enum: [short_term, medium_term, long_term, custom]}
        time_horizon_summary: {type: string, nullable: true}
        transmission_summary: {type: string, nullable: true}
        checkpoint_summary: {type: string, nullable: true}
        risk_summary: {type: string, nullable: true}
        analysis_as_of: {$ref: '#/components/schemas/UTCTimestamp'}
        window_start: {$ref: '#/components/schemas/UTCTimestamp'}
        window_end: {$ref: '#/components/schemas/UTCTimestamp'}
        published_at: {$ref: '#/components/schemas/UTCTimestamp'}
        impacts: {type: array, items: {$ref: '#/components/schemas/ResearchThemeImpact'}}
        evidence_event_count: {type: integer, minimum: 0}
        reasoning_tree_count: {type: integer, minimum: 0}
    ResearchThemeDetail:
      allOf:
        - $ref: '#/components/schemas/ResearchTheme'
        - type: object
          required: [events]
          properties:
            events: {type: array, items: {$ref: '#/components/schemas/ResearchEvent'}}
    ResearchThemeImpact:
      type: object
      additionalProperties: false
      required: [chain_node_entity_id, name, relation_role, impact_direction, impact_summary, primary_signal_display_summary, display_order]
      properties:
        chain_node_entity_id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        relation_role: {type: string}
        impact_direction: {type: string}
        impact_summary: {type: string, nullable: true}
        primary_signal_display_summary: {type: string, nullable: true, minLength: 1, maxLength: 200}
        display_order: {type: integer}
    ResearchEvent:
      type: object
      additionalProperties: false
      required: [event_id, title, summary, event_time, evidence_role, supported_claim, display_order]
      properties:
        event_id: {$ref: '#/components/schemas/UUID'}
        title: {type: string}
        summary: {type: string}
        event_time:
          allOf: [{$ref: '#/components/schemas/UTCTimestamp'}]
          nullable: true
        evidence_role: {type: string}
        supported_claim: {type: string, nullable: true}
        display_order: {type: integer}
    ReasoningTreeList:
      type: object
      additionalProperties: false
      required: [theme, reasoning_trees]
      properties:
        theme: {$ref: '#/components/schemas/ResearchTheme'}
        reasoning_trees: {type: array, items: {$ref: '#/components/schemas/ReasoningTreeSummary'}}
    ReasoningTreeSummary:
      type: object
      additionalProperties: false
      required: [reasoning_tree_id, industry_chain_entity_id, industry_chain_name, title, display_order, event_count, published_at]
      properties:
        reasoning_tree_id: {$ref: '#/components/schemas/UUID'}
        industry_chain_entity_id: {$ref: '#/components/schemas/UUID'}
        industry_chain_name: {type: string}
        title: {type: string}
        display_order: {type: integer}
        event_count: {type: integer}
        published_at: {$ref: '#/components/schemas/UTCTimestamp'}
    ReasoningTreeDetail:
      type: object
      additionalProperties: false
      required: [theme_id, impact_node_ids, reasoning_tree]
      properties:
        theme_id: {$ref: '#/components/schemas/UUID'}
        impact_node_ids: {type: array, items: {$ref: '#/components/schemas/UUID'}}
        reasoning_tree: {$ref: '#/components/schemas/ReasoningTree'}
    ReasoningTreeSignal:
      type: object
      additionalProperties: false
      required: [variable_signal_key, signal_role, signal_direction, display_summary, display_order]
      properties:
        variable_signal_key: {type: string}
        signal_role: {type: string, enum: [primary, supporting, contradicting]}
        signal_direction: {type: string, enum: [increase, decrease, mixed, unchanged, uncertain]}
        display_summary: {type: string}
        display_order: {type: integer}
    ReasoningTreeGraphEdge:
      type: object
      additionalProperties: false
      required: [id, relation_type, review_status, status]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        relation_type: {type: string}
        review_status: {type: string}
        status: {type: string}
    ReasoningTreeCheckpoint:
      type: object
      additionalProperties: false
      required: [type, summary]
      properties:
        type: {type: string, enum: [event, relationship, metric]}
        summary: {type: string}
    ReasoningTreeNode:
      type: object
      additionalProperties: false
      required:
        - id
        - position
        - chain_node_entity_id
        - name
        - state_summary
        - impact_direction
        - impact_strength
        - impact_summary
        - reasoning_basis_summary
        - evidence_gap_summary
        - incoming_industry_chain_graph_edge_id
        - incoming_transmission_title
        - incoming_transmission_mechanism
        - incoming_condition_summary
        - incoming_graph_edge
        - signals
        - primary_signal
        - signal_display_summary
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        position: {type: integer}
        chain_node_entity_id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        state_summary: {type: string, nullable: true}
        impact_direction: {type: string, enum: [positive, negative, mixed, neutral, uncertain]}
        impact_strength: {type: string, enum: [strong, medium, weak, unknown]}
        impact_summary: {type: string, nullable: true}
        reasoning_basis_summary: {type: string, nullable: true}
        evidence_gap_summary: {type: string, nullable: true}
        incoming_industry_chain_graph_edge_id:
          allOf: [{$ref: '#/components/schemas/UUID'}]
          nullable: true
        incoming_transmission_title: {type: string, nullable: true}
        incoming_transmission_mechanism: {type: string, nullable: true}
        incoming_condition_summary: {type: string, nullable: true}
        incoming_graph_edge:
          allOf: [{$ref: '#/components/schemas/ReasoningTreeGraphEdge'}]
          nullable: true
        signals: {type: array, items: {$ref: '#/components/schemas/ReasoningTreeSignal'}}
        primary_signal: {$ref: '#/components/schemas/ReasoningTreeSignal'}
        signal_display_summary: {type: string}
    ReasoningTree:
      type: object
      additionalProperties: false
      required:
        - reasoning_tree_id
        - theme_id
        - industry_chain_entity_id
        - industry_chain_name
        - title
        - display_order
        - one_line_conclusion
        - fact_summary
        - transmission_summary
        - impact_direction
        - impact_strength
        - impact_summary
        - conclusion_boundary_summary
        - support_summary
        - counter_summary
        - invalidation_conditions
        - checkpoints
        - published_at
        - event_count
        - events
        - nodes
      properties:
        reasoning_tree_id: {$ref: '#/components/schemas/UUID'}
        theme_id: {$ref: '#/components/schemas/UUID'}
        industry_chain_entity_id: {$ref: '#/components/schemas/UUID'}
        industry_chain_name: {type: string}
        title: {type: string}
        display_order: {type: integer}
        one_line_conclusion: {type: string}
        fact_summary: {type: string, nullable: true}
        transmission_summary: {type: string, nullable: true}
        impact_direction: {type: string, enum: [positive, negative, mixed, neutral, uncertain]}
        impact_strength: {type: string, enum: [strong, medium, weak, unknown]}
        impact_summary: {type: string, nullable: true}
        conclusion_boundary_summary: {type: string, nullable: true}
        support_summary: {type: string, nullable: true}
        counter_summary: {type: string, nullable: true}
        invalidation_conditions: {type: array, items: {type: string}}
        checkpoints: {type: array, items: {$ref: '#/components/schemas/ReasoningTreeCheckpoint'}}
        published_at: {$ref: '#/components/schemas/UTCTimestamp'}
        event_count: {type: integer, minimum: 0}
        events: {type: array, items: {$ref: '#/components/schemas/ResearchEvent'}}
        nodes: {type: array, items: {$ref: '#/components/schemas/ReasoningTreeNode'}}
