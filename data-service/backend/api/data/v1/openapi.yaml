      properties:
        contract_version:
          type: string
          enum: [research-graph-search.v2]
        analysis_as_of:
          $ref: '#/components/schemas/UTCTimestamp'
        query_fingerprint:
          $ref: '#/components/schemas/PayloadHash'
        graph_fingerprint:
          $ref: '#/components/schemas/PayloadHash'
        actual_depth:
          type: integer
          minimum: 0
          maximum: 5
        entities:
          type: array
          items:
            $ref: '#/components/schemas/ResearchGraphEntity'
        relation_definitions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [relation_type, direction]
            properties:
              relation_type: {type: string}
              direction: {type: string, enum: [directed]}
        entity_relations:
          type: array
          items:
            $ref: '#/components/schemas/ResearchGraphEntityRelation'
        industry_chains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [industry_chain_id, scope, target_output, end_use, geography, as_of_date, review_status]
            properties:
              industry_chain_id: {$ref: '#/components/schemas/IndustryChainID'}
              scope: {type: string}
              target_output: {type: string}
              end_use: {type: string}
              geography: {type: string}
              primary_country_id: {type: string, pattern: '^COU[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
              as_of_date: {type: string, format: date}
              review_status: {type: string, enum: [approved]}
        industry_chain_memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [industry_chain_id, chain_node_id, position, contextual_stage]
            properties:
              industry_chain_id: {$ref: '#/components/schemas/IndustryChainID'}
              chain_node_id: {$ref: '#/components/schemas/ChainNodeID'}
              position: {type: integer, minimum: 1}
              contextual_stage: {type: string}
        industry_chain_graph_edges:
          type: array
