openapi: 3.0.4
info:
  title: Tidewise Data Service API
  version: 1.0.0
  description: >-
    Data Service 内部 HTTP REST + JSON 合同。消费方拥有小型手写 typed client，
    并以本文件的 operationId、schema drift anchor 和静态合同测试防止漂移。
x-contract-id: tidewise-data-v1
x-handwritten-client-policy: consumer-owned-small-typed-clients
servers:
  - url: /
    description: 由运行环境注入 Data Service origin；合同只冻结路径。
security:
  - ServiceBearer: []
tags:
  - name: Operations
  - name: Research
  - name: Admin aggregates
  - name: Evidence publication
  - name: Evidence Category Catalog
  - name: Event publication
  - name: Event Tag Catalog
  - name: Event Semantics
  - name: Research Theme import
  - name: Research Reason Tree import
  - name: Country
  - name: Industry
  - name: Concept
  - name: Organization

paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getDataServiceHealth
      summary: Data Service 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string

  /readyz:
    get:
      tags: [Operations]
      operationId: getDataServiceReadiness
      summary: Data Service 就绪检查
      security: []
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment, checks]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string

  /api/data/v1/research/themes:
    get:
      tags: [Research]
      operationId: listResearchThemes
      x-client-drift-anchor: data.v1.listResearchThemes
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Miniapp Research theme 页面聚合
      description: >-
        返回半开区间 [published_from, published_to) 内成功发布的 Theme Aggregate，按
        published_at DESC、id ASC 稳定排序并通过 cursor 分页。published_from 和
        published_to 必须成对传入，与兼容参数 window_hours 互斥。
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
        - $ref: '#/components/parameters/PublishedFrom'
        - $ref: '#/components/parameters/PublishedTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Theme 页面聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: getResearchTheme
      x-client-drift-anchor: data.v1.getResearchTheme
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Research theme 及其证据聚合
      description: 按 theme_id 读取已发布主题，不受列表时间窗口限制。
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
      responses:
        '200':
          description: Theme 详情聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: listResearchThemeReasoningTrees
      x-client-drift-anchor: data.v1.listResearchThemeReasoningTrees
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 的全部推理树 Tab 摘要
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Theme 摘要和完整推理树 Tab 集合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees/{reasoning_tree_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
      - $ref: '#/components/parameters/ReasoningTreeID'
    get:
      tags: [Research]
      operationId: getResearchThemeReasoningTree
      x-client-drift-anchor: data.v1.getResearchThemeReasoningTree
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 下的一棵完整推理树
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 单棵推理树完整快照
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/event-tags:
    get:
      tags: [Event Tag Catalog]
      operationId: listActiveEventTags
      x-client-drift-anchor: data.v1.listActiveEventTags
      x-required-service-scope: data.event-tags.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 active Event Tag Catalog 快照
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: active
          in: query
          required: true
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: 按 tag_kind、code、id 稳定排序的 active Event Tag Catalog
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTagCatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/raw-documents:
    get:
      tags: [Admin aggregates]
      operationId: listAdminRawDocuments
      x-client-drift-anchor: data.v1.listAdminRawDocuments
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Admin 原始文档分页聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: source_ref
          in: query
          schema:
            type: string
            maxLength: 256
        - name: ingest_status
          in: query
          schema:
            $ref: '#/components/schemas/IngestStatus'
      responses:
        '200':
          description: 原始文档分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRawDocumentPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/events:
    get:
      tags: [Admin aggregates]
      operationId: listAdminEvents
      x-client-drift-anchor: data.v1.listAdminEvents
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Admin 全球事件分页聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: event_status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: fact_status
          in: query
          schema:
            $ref: '#/components/schemas/FactStatus'
        - name: event_time_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: event_time_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: first_seen_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
      responses:
        '200':
          description: 全球事件分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/runtime-health:
    get:
      tags: [Operations]
      operationId: getDataRuntimeHealth
      x-client-drift-anchor: data.v1.getRuntimeHealth
      x-required-service-scope: data.admin.read
      x-retry-policy: none
      x-timeout-budget-ms: 1500
      summary: 获取 Data Service 的安全运行状态
      description: 仅返回 Data Service 自身状态、检查时间和可选延迟；不返回凭据、地址或业务数据。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Data Provider 运行状态
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeHealthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/event-semantics/eligible-events:
    get:
      tags: [Event Semantics]
      operationId: listEligibleEventSemanticEvents
      x-client-drift-anchor: data.v1.listEligibleEventSemanticEvents
      x-required-service-scope: data.event-semantics.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 列出可创建首次语义分析 Work Item 的 Event
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 由上一页返回的 opaque cursor。
          schema:
            type: string
            maxLength: 1024
        - name: pagination
          in: query
          required: false
          description: 新消费者显式设置为 cursor 后，响应才返回 next_cursor；省略时保持旧版 only-events 响应。
          schema:
            type: string
            enum: [cursor]
      responses:
        '200':
          description: Eligible Event 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleEventSemanticEventsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/context-leases:
    post:
      tags: [Event Semantics]
      operationId: createEventSemanticContextLease
      x-client-drift-anchor: data.v1.createEventSemanticContextLease
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: no-automatic-retry
      x-timeout-budget-ms: 5000
      summary: 为 AgentRun 已领取的 Work Item 创建数据侧 Context Lease
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticContextLeaseRequest'
      responses:
        '201':
          description: Context Lease 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticContextLeaseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/context-leases/{context_lease_id}/context:
    get:
      tags: [Event Semantics]
      operationId: getEventSemanticContext
      x-client-drift-anchor: data.v1.getEventSemanticContext
      x-required-service-scope: data.event-semantics.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Context Lease 对应 Event 与版本化本体上下文
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: context_lease_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EventSemanticContextLeaseID'
      responses:
        '200':
          description: Event Semantic Context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticContextEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EventSemanticContextDrift'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/submissions:
    post:
      tags: [Event Semantics]
      operationId: createEventSemanticSubmission
      x-client-drift-anchor: data.v1.createEventSemanticSubmission
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: idempotent-with-agent-execution-id-and-canonical-payload
      x-timeout-budget-ms: 15000
      x-atomicity: whole-submission-candidate-snapshot
      summary: 持久化一个 Event 的候选快照并执行确定性预检
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticSubmissionRequest'
      responses:
        '200':
          description: 相同 canonical payload 的安全重放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticSubmissionEnvelope'
        '201':
          description: Submission 与候选快照已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticSubmissionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/event-semantics/submissions/{submission_id}/reviews:
    post:
      tags: [Event Semantics]
      operationId: submitEventSemanticReview
      x-client-drift-anchor: data.v1.submitEventSemanticReview
      x-required-service-scope: data.event-semantics.write
      x-retry-policy: idempotent-with-reviewer-execution-key-and-canonical-payload
      x-timeout-budget-ms: 15000
      x-atomicity: whole-review-snapshot
      summary: 提交独立 Reviewer 或 Adjudicator 结构化结果
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: submission_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EventSemanticSubmissionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSemanticReviewRequest'
      responses:
        '200':
          description: Review 已保存并由 Data 完成状态裁决
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticSubmissionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/events/{event_id}/semantics:
    get:
      tags: [Event Semantics]
      operationId: getEventSemantics
      x-client-drift-anchor: data.v1.getEventSemantics
      x-required-service-scope: data.event-semantics.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 读取 Event 的完整语义结果与审计状态
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EventID'
      responses:
        '200':
          description: Event Semantics 结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSemanticsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/research-analysis-context:
    get:
      tags: [Research Analysis]
      operationId: listResearchAnalysisContext
      x-client-drift-anchor: data.v1.listResearchAnalysisContext
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get-restart-from-first-page-on-cursor-mismatch
      x-timeout-budget-ms: 15000
      summary: 按显式研究时间窗口读取正式 Event Semantics 批量上下文
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: discovery_window_start
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: discovery_window_end
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: analysis_as_of
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: prediction_horizon_start
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: prediction_horizon_end
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 实时正式 Event Semantic Bundles 与解析字典
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchAnalysisContextEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ResearchAnalysisContextInconsistent'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/ResearchResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/research-graph:search:
    post:
      tags: [Research Analysis]
      operationId: searchResearchGraph
      x-client-drift-anchor: data.v1.searchResearchGraph
      x-required-service-scope: data.research.read
      x-retry-policy: safe-idempotent-read-reduce-scope-on-resource-limit
      x-timeout-budget-ms: 15000
      summary: 按 Codex 显式范围执行受预算约束的确定性研究图谱检索
      description: >-
        Data 只执行确定性、只读、受预算约束的图遍历。industry_chain_entity_id 仅约束
        Industry Chain Graph Edge；全局 EntityRelation 仍由显式 relation_filters 控制。
        超过预算时整次失败，不返回静默截断的部分子图。
      parameters:
