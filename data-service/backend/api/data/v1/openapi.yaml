      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/EventSemanticSubmissionResult'

    EventSemanticReviewItem:
      type: object
      additionalProperties: false
      required: [candidate_type, candidate_key, decision, reason_codes, evidence_ids]
      properties:
        candidate_type:
          type: string
          enum: [entity_link, variable_signal]
        candidate_key:
          type: string
        decision:
          type: string
          enum: [pass, fail, indeterminate]
        reason_codes:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/EventEvidenceLinkID'

    EventSemanticReviewRequest:
      type: object
      additionalProperties: false
      required: [reviewer_execution_key, prompt_hash, model, items]
      properties:
        reviewer_execution_key:
          type: string
        prompt_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        model:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventSemanticReviewItem'

    EventSemanticsResult:
      type: object
      additionalProperties: false
      required: [event_id, submissions]
      properties:
        event_id:
          $ref: '#/components/schemas/EventID'
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/EventSemanticSubmissionResult'

    EventSemanticsEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id:
          type: string
        result:
          $ref: '#/components/schemas/EventSemanticsResult'
