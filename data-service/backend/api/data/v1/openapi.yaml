    ObjectID:
      description: 领域对象缩写前缀直接连接 canonical lowercase UUID。
      oneOf:
        - type: string
          pattern: '^ENT[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        - $ref: '#/components/schemas/IndustryID'
        - $ref: '#/components/schemas/ConceptID'
        - $ref: '#/components/schemas/ChainNodeID'
        - $ref: '#/components/schemas/IndustryChainID'
        - $ref: '#/components/schemas/CompanyID'
        - type: string
          pattern: '^COU[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        - type: string
          pattern: '^REG[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        - type: string
          pattern: '^ORG[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
