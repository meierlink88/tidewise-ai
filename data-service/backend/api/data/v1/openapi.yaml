              industry_chain_graph_edge_id: {$ref: '#/components/schemas/IndustryChainGraphEdgeID'}
              industry_chain_id: {$ref: '#/components/schemas/IndustryChainID'}
              from_chain_node_id: {$ref: '#/components/schemas/ChainNodeID'}
              to_chain_node_id: {$ref: '#/components/schemas/ChainNodeID'}
              relation_type: {type: string}

