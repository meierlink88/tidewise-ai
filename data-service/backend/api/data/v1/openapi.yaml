    ReportEvidenceItem:
      type: object
      additionalProperties: false
      required: [published_at, summary, keywords]
      properties:
        published_at: {type: string, format: date-time, nullable: true}
        summary: {type: string, minLength: 1}
        keywords: {type: array, items: {type: string}}

    ReportEvidenceCollection:
      type: object
      additionalProperties: false
      required: [report_id, scope_token, items]
      properties:
        report_id: {$ref: '#/components/schemas/ReportID'}
        scope_token: {$ref: '#/components/schemas/ReportEvidenceScopeToken'}
        items: {type: array, items: {$ref: '#/components/schemas/ReportEvidenceItem'}}

    ReportEvidenceCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, result]
      properties:
        request_id: {type: string}
        result: {$ref: '#/components/schemas/ReportEvidenceCollection'}
