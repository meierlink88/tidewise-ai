          type: integer
          minimum: 1
          maximum: 5
        industry_chain_id:
          $ref: '#/components/schemas/IndustryChainID'
        node_budget:
          type: integer
          minimum: 1
          maximum: 500
        edge_budget:
          type: integer
          minimum: 1
          maximum: 1000

    ResearchGraphSearchResult:
      type: object
      additionalProperties: false
