          $ref: '#/components/schemas/UTCTimestamp'
        seed_entity_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ObjectID'
        relation_filters:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ResearchGraphRelationFilter'
