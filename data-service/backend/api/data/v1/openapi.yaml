components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service identity token
      description: >-
        环境 secret 注入的 service identity。服务端从认证 principal 派生 caller identity
        与 scope；request body 不得声明或覆盖 caller identity。

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失时服务端生成。不得作为业务幂等 identity。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WindowHours:
      name: window_hours
      in: query
      required: false
      deprecated: true
      description: 兼容旧列表调用；不得与 published_from/published_to 同时传入。详情路由仅校验参数。
      schema:
        type: integer
        minimum: 1
        maximum: 168
        default: 24
    PublishedFrom:
      name: published_from
      in: query
      required: false
      description: 发布时间可选下界（含），必须为 UTC RFC3339；可单独传入。
      schema:
        $ref: '#/components/schemas/UTCTimestamp'
    PublishedTo:
      name: published_to
      in: query
      required: false
      description: 发布时间可选上界（不含），必须为 UTC RFC3339；可单独传入。
      schema:
        $ref: '#/components/schemas/UTCTimestamp'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    EntityListCursor:
