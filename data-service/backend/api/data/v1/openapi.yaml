      type: string
      format: uuid
      description: RFC 4122 UUID string。
    LowercaseUUID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: V1 publication contract 使用的标准小写 RFC 4122 UUID string。
    EntityID:
      type: string
      pattern: '^ENT[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Entity 领域前缀直接连接 canonical lowercase UUID。
    IndustryID:
      type: string
      pattern: '^IND[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Industry 领域前缀直接连接 canonical lowercase UUID。
    CompanyID:
      type: string
      pattern: '^COM[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 39
      description: Company 领域前缀直接连接 canonical lowercase UUID。
    CompanyIndustryLinkID:
      type: string
      pattern: '^CIL[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      maxLength: 39
      description: CompanyIndustryLink 领域前缀直接连接 canonical lowercase UUID。
    ConceptID:
      type: string
      pattern: '^CON[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Concept 领域前缀直接连接 canonical lowercase UUID。
    ChainNodeID:
      type: string
      pattern: '^CND[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: ChainNode 领域前缀直接连接 canonical lowercase UUID。
    IndustryChainID:
      type: string
      pattern: '^ICH[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: IndustryChain 领域前缀直接连接 canonical lowercase UUID。
    EntityRelationID:
      type: string
      pattern: '^ERL[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Entity Relation 领域前缀直接连接 canonical lowercase UUID。
    EventID:
      type: string
      pattern: '^EVT[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    EventEvidenceLinkID:
      type: string
      pattern: '^EEL[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    IndustryChainGraphEdgeID:
