components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service identity token
      description: >-
        环境 secret 注入的 service identity。服务端从认证 principal 派生 caller identity
        与 scope；request body 不得声明或覆盖 caller identity。

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 可选 caller request id；缺失时服务端生成。不得作为业务幂等 identity。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WindowHours:
      name: window_hours
      in: query
      required: false
      deprecated: true
      description: 兼容旧列表调用；不得与 published_from/published_to 同时传入。详情路由仅校验参数。
      schema:
        type: integer
        minimum: 1
        maximum: 168
        default: 24
    PublishedFrom:
      name: published_from
      in: query
      required: false
      description: 发布时间半开区间下界，必须为 UTC RFC3339，与 published_to 成对传入。
      schema:
        $ref: '#/components/schemas/UTCTimestamp'
    PublishedTo:
      name: published_to
      in: query
      required: false
      description: 发布时间半开区间上界，必须为 UTC RFC3339，与 published_from 成对传入。
      schema:
        $ref: '#/components/schemas/UTCTimestamp'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ThemeID:
      name: theme_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResearchThemeID'
    ReasoningTreeID:
      name: reasoning_tree_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResearchReasoningTreeID'
    CountryID:
      name: country_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^COU[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    IndustryID:
      name: industry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityID'
    ConceptID:
      name: concept_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityID'
    RegionIDQuery:
      name: region_id
      in: query
      required: false
      schema:
        type: string
        pattern: '^REG[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema: {type: string, pattern: '^ORG[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$', maxLength: 39}

  headers:
    RequestID:
      description: 本次 transport attempt 的 request id；重放时可以与首次请求不同。
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: 请求 DTO、query 或边界不合法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: service bearer identity 缺失或无效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证 principal 不具有 operation 所需 scope
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    EvidenceCategoryCatalogFailed:
      description: Evidence Category Catalog 读取或完整性校验失败；错误码 EVIDENCE_CATEGORY_CATALOG_FAILED
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvidenceCategoryCatalogFailedErrorEnvelope'
    EvidenceCategoryCatalogTimeout:
      description: Evidence Category Catalog 超过内部执行预算；错误码 EVIDENCE_CATEGORY_CATALOG_TIMEOUT
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvidenceCategoryCatalogTimeoutErrorEnvelope'
    NotFound:
      description: caller scope 内不存在目标资源
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 幂等合同或自然身份对应内容冲突；零 mutation
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    EventSemanticContextDrift:
      description: Context Lease、分页请求身份或所选正式路径已漂移；调用方应以新 lease 重试
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventSemanticContextDriftErrorEnvelope'
    PayloadTooLarge:
      description: JSON request body 超过 1048576 bytes
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 已解析 DTO 未通过 whole-batch 业务 validation；零 mutation
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 查询超过当前资源保护预算
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResearchResourceLimit:
      description: 研究查询超过资源预算；整次失败且不返回静默截断结果
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchResourceLimitErrorEnvelope'
    ResearchAnalysisContextInconsistent:
      description: 实时页级引用无法闭合；调用方必须丢弃本轮结果并从第一页重查
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResearchAnalysisContextInconsistentErrorEnvelope'
    InternalError:
      description: Data Service 内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Event Semantics 依赖暂时不可用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    OrganizationCategory:
      type: object
      additionalProperties: false
      required: [id, code, name_zh]
      properties:
        id: {type: string, pattern: '^OCA[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$', maxLength: 39}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
