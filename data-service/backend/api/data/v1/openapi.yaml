openapi: 3.0.4
info:
  title: Tidewise Data Service API
  version: 1.0.0
  description: >-
    Data Service 内部 HTTP REST + JSON 合同。消费方拥有小型手写 typed client，
    并以本文件的 operationId、schema drift anchor 和静态合同测试防止漂移。
x-contract-id: tidewise-data-v1
x-handwritten-client-policy: consumer-owned-small-typed-clients
servers:
  - url: /
    description: 由运行环境注入 Data Service origin；合同只冻结路径。
security:
  - ServiceBearer: []
tags:
  - name: Operations
  - name: Research
  - name: Admin aggregates
  - name: Evidence publication
  - name: Evidence Category Catalog
  - name: Event publication
  - name: Event Tag Catalog
  - name: Event Semantics
  - name: Research Theme import
  - name: Research Reason Tree import
  - name: Country
  - name: Industry
  - name: Concept
  - name: Organization
  - name: Source

paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getDataServiceHealth
      summary: Data Service 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string

  /readyz:
    get:
      tags: [Operations]
      operationId: getDataServiceReadiness
      summary: Data Service 就绪检查
      security: []
      responses:
        '200':
          description: 服务配置就绪
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, environment, checks]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  service:
                    type: string
                    enum: [data-service]
                  environment:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string

  /api/data/v1/research/themes:
    get:
      tags: [Research]
      operationId: listResearchThemes
      x-client-drift-anchor: data.v1.listResearchThemes
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Miniapp Research theme 页面聚合
      description: >-
        返回半开区间 [published_from, published_to) 内成功发布的 Theme Aggregate，按
        published_at DESC、id ASC 稳定排序并通过 cursor 分页。published_from 和
        published_to 必须成对传入，与兼容参数 window_hours 互斥。
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
        - $ref: '#/components/parameters/PublishedFrom'
        - $ref: '#/components/parameters/PublishedTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Theme 页面聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: getResearchTheme
      x-client-drift-anchor: data.v1.getResearchTheme
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Research theme 及其证据聚合
      description: 按 theme_id 读取已发布主题，不受列表时间窗口限制。
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/WindowHours'
      responses:
        '200':
          description: Theme 详情聚合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
    get:
      tags: [Research]
      operationId: listResearchThemeReasoningTrees
      x-client-drift-anchor: data.v1.listResearchThemeReasoningTrees
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 的全部推理树 Tab 摘要
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Theme 摘要和完整推理树 Tab 集合
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research/themes/{theme_id}/reasoning-trees/{reasoning_tree_id}:
    parameters:
      - $ref: '#/components/parameters/ThemeID'
      - $ref: '#/components/parameters/ReasoningTreeID'
    get:
      tags: [Research]
      operationId: getResearchThemeReasoningTree
      x-client-drift-anchor: data.v1.getResearchThemeReasoningTree
      x-required-service-scope: data.research.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取一个 Theme 下的一棵完整推理树
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 单棵推理树完整快照
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReasoningTreeDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/events:
    get:
      tags: [Admin aggregates]
      operationId: listAdminEvents
      x-client-drift-anchor: data.v1.listAdminEvents
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取 Admin 全球事件分页聚合
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: title
          in: query
          schema:
            type: string
            maxLength: 200
        - name: modality
          in: query
          schema:
            $ref: '#/components/schemas/EventModality'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventLifecycleStatus'
        - name: occurred_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: occurred_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: announced_from
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
        - name: announced_to
          in: query
          schema:
            $ref: '#/components/schemas/UTCTimestamp'
      responses:
        '200':
          description: 全球事件分页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/runtime-health:
    get:
      tags: [Operations]
      operationId: getDataRuntimeHealth
      x-client-drift-anchor: data.v1.getRuntimeHealth
      x-required-service-scope: data.admin.read
      x-retry-policy: none
      x-timeout-budget-ms: 1500
      summary: 获取 Data Service 的安全运行状态
      description: 仅返回 Data Service 自身状态、检查时间和可选延迟；不返回凭据、地址或业务数据。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Data Provider 运行状态
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeHealthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/research-graph:search:
    post:
      tags: [Research Analysis]
      operationId: searchResearchGraph
      x-client-drift-anchor: data.v1.searchResearchGraph
      x-required-service-scope: data.research.read
      x-retry-policy: safe-idempotent-read-reduce-scope-on-resource-limit
      x-timeout-budget-ms: 15000
      summary: 按 Codex 显式范围执行受预算约束的确定性研究图谱检索
      description: >-
        Data 只执行确定性、只读、受预算约束的图遍历。industry_chain_id 仅约束
        Industry Chain Graph Edge；全局 EntityRelation 仍由显式 relation_filters 控制。
        超过预算时整次失败，不返回静默截断的部分子图。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchGraphSearchRequest'
      responses:
        '200':
          description: 引用完整、稳定排序的可达子图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchGraphSearchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/ResearchResourceLimit'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/raw-evidences/{id}:
    get:
      tags: [Evidence publication]
      operationId: getRawEvidence
      x-client-drift-anchor: data.v1.getRawEvidence
      x-required-service-scope: data.raw-evidences.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 3000
      summary: 读取一份完整 Raw Evidence
      description: >-
        按正式身份读取完整 Raw Evidence、原始 Keywords 和按 Category ID 稳定排序的
        Evidence Category 内容。历史未分类 Raw Evidence 返回空 categories。
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 39
            pattern: '^RAW[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200':
          description: 返回完整 Raw Evidence 及其内容分类
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawEvidenceReadEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/evidence-categories:
    get:
      tags: [Evidence Category Catalog]
      operationId: listEvidenceCategories
      x-client-drift-anchor: data.v1.listEvidenceCategories
      x-required-service-scope: data.evidence-categories.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 3000
      summary: 获取完整 Evidence Category Catalog
      description: >-
        从 Data PostgreSQL 返回当前全部固定 Evidence Category，按 code ASC、id ASC 稳定排序。
        目录用于把受控 code 确定性映射为 Raw Evidence Publication 使用的正式 category_id；
        不提供分页、筛选、版本、revision 或内容 hash。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 完整且已验证的 Evidence Category Catalog
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceCategoryCatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/EvidenceCategoryCatalogFailed'
        '503':
          $ref: '#/components/responses/EvidenceCategoryCatalogTimeout'

  /api/data/v1/evidences:
    get:
      tags: [Admin aggregates]
      operationId: listAdminEvidence
      x-client-drift-anchor: data.v1.listAdminEvidence
      x-required-service-scope: data.admin.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 3000
      summary: 分页查询 Admin Evidence Center 读模型
      description: >-
        以 Atomic Evidence 为分页单位，关联其唯一 Raw Evidence 与完整 Evidence Category 集合。
        文本筛选为不区分大小写的 contains；时间范围两端均包含且必须为 UTC RFC3339。
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - {name: title, in: query, required: false, schema: {type: string, maxLength: 500}}
        - {name: summary, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: category_id, in: query, required: false, schema: {type: string, maxLength: 39, pattern: '^EVC[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
        - {name: source_name, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: source_level, in: query, required: false, schema: {$ref: '#/components/schemas/SourceLevel'}}
        - {name: is_split, in: query, required: false, schema: {type: boolean}}
        - {name: published_from, in: query, required: false, schema: {$ref: '#/components/schemas/UTCTimestamp'}}
        - {name: published_to, in: query, required: false, schema: {$ref: '#/components/schemas/UTCTimestamp'}}
        - {name: collected_from, in: query, required: false, schema: {$ref: '#/components/schemas/UTCTimestamp'}}
        - {name: collected_to, in: query, required: false, schema: {$ref: '#/components/schemas/UTCTimestamp'}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Evidence Center 分页结果
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvidencePageEnvelope'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/data/v1/raw-evidence-publications:
    post:
      tags: [Evidence publication]
      operationId: publishRawEvidence
      x-client-drift-anchor: data.v1.publishRawEvidence
      x-required-service-scope: data.raw-evidences.import
      x-retry-policy: retry-failed-call-with-natural-identities
      x-timeout-budget-ms: 3000
      x-atomicity: raw-evidence-single-postgresql-transaction
      x-transaction-membership: raw-evidence
      summary: 发布一份完整 Raw Evidence
      description: >-
        采集完成后同步发布完整 Raw Evidence 及有序 Keywords。接口不使用
        Idempotency-Key；相同 publication_key 仅在全部业务字段一致时安全重试。Data
        由该自然键确定性生成正式 Raw Evidence ID，成功响应只返回该系统身份。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              maxLength: 1048576
              x-max-body-bytes: 1048576
              allOf:
                - $ref: '#/components/schemas/RawEvidencePublicationRequest'
      responses:
        '201':
          description: Raw Evidence 已原子提交并返回正式身份
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawEvidencePublicationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/evidence-publications:
    post:
      tags: [Evidence publication]
      operationId: publishEvidence
      x-client-drift-anchor: data.v1.publishEvidence
      x-required-service-scope: data.evidences.import
      x-retry-policy: retry-failed-call-with-natural-identities
      x-timeout-budget-ms: 3000
      x-atomicity: complete-evidence-set-single-postgresql-transaction
      x-transaction-membership: evidence
      summary: 为既有 Raw Evidence 发布完整原子 Evidence 集合
      description: >-
        清洗完成后一次提交一个既有 Raw Evidence 的完整 1..N Evidence 集合。Data 根据
        集合基数派生 is_split；零项、部分成功、追加、覆盖和删除均不允许。接口不使用
        Idempotency-Key；相同完整集合仅在内容一致时安全重试。成功响应只返回正式 Raw
        Evidence ID 与按正式 Evidence ID 确定性排序的 Evidence IDs；该顺序不表达业务语义。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              maxLength: 1048576
              x-max-body-bytes: 1048576
              allOf:
                - $ref: '#/components/schemas/EvidencePublicationRequest'
      responses:
        '201':
          description: 完整 Evidence 集合已原子提交并返回正式身份
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePublicationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/data/v1/research-theme-imports:
    post:
      tags: [Research Theme publication]
      operationId: publishResearchTheme
      x-client-drift-anchor: data.v1.publishResearchTheme
      x-required-service-scope: data.research.import
      x-retry-policy: idempotent-with-analysis-batch-id
      x-timeout-budget-ms: 15000
      x-canonicalization: rfc8785-sha256
      x-atomicity: one-theme-and-all-reason-trees-single-postgresql-transaction
      x-receipt-schema: research_theme_import_receipts
      x-transaction-membership: research-theme-import-receipt,research-theme,research-theme-impact,research-theme-event,research-reasoning-tree-import-receipt,research-reasoning-tree,research-reasoning-tree-event,research-reasoning-tree-node,research-reasoning-tree-node-signal
      summary: 原子发布一条不可变 Theme 及其全部 Reason Trees
      description: >-
        analysis_batch_id 是本次单 Theme Aggregate 的幂等身份。V3
        analyst_snapshot 是分析师提交的不可变展示报告，只要求 Event 存在，Evidence
        仅在提交时校验归属。Theme 与 1..N Reason Trees 在同一事务内全部发布或全部回滚。
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-max-body-bytes: 1048576
              $ref: '#/components/schemas/ResearchThemeImportRequest'
      responses:
        '200':
          description: 相同发布主体、analysis_batch_id 与 payload 的首次结果重放
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeImportEnvelope'
        '201':
          description: Theme Aggregate 和 immutable receipt 已原子提交
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchThemeImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/data/v1/entities/countries:
    get:
      tags: [Country]
      operationId: listCountries
      x-client-drift-anchor: data.v1.listCountries
      x-required-service-scope: data.countries.read
      x-retry-policy: safe-get
      x-timeout-budget-ms: 5000
      summary: 获取国家目录
      description: 按 ISO 3166-1 alpha-2 code 升序返回全部 Country；region_id 可筛选属于指定 Region 的 Country。
