亿美元的Project Vault公私合作储备计划，其中包括美国进出口银行提供的100亿美元融资。", "EVD567d653c-eceb-562e-b856-bc9401ee603a": "中国于2025年11月将铒等部分稀土的出口限制暂停一年，但钇未被纳入暂停范围。", "EVD8cf1d628-bb69-5d5d-ae0c-66bad94a0fd0": "中国预计将在2026年11月决定延长或取消部分或全部受控稀土的暂停措施，现行出口限制可能于11月10日全面生效。", "EVDbb70c579-896a-5469-9202-495f8bd58b91": "中国在2026年3月和4月分别批准60吨和10吨氧化钇输美，但当年对美钇发货量较2025年下降约75%。", "EVDe1923077-6943-57a2-87a4-703c95af7de1": "美国财政部周五制裁一家土耳其投资银行及其两家子公司，指控其协助伊朗相关网络转移并兑换石油收入。", "EVD32c66d12-55f7-5d13-8e27-384af7017964": "美联储7月会议维持利率不变，Beth Hammack、Neel Kashkari和Lorie Logan三人持异议并支持加息25个基点。", "EVD4634deec-556b-5364-83e3-7ea042d0599b": "特朗普政府多名高级官员在过去一周公开要求美联储避免加息，部分官员进一步主张降息。", "EVD5e3dc40d-564f-5f4e-ab50-6ea1a51e3210": "美国8月非农数据大超预期，美联储加息预期随之升温。", "EVD60c0fd46-ffe5-553b-8952-b63b5220cdb0": "美国8月非农就业数据大幅超出预期，市场对美联储加息的预期升温。", "EVD125ee432-912f-5289-a5e1-b05d5b72ef3e": "美国与伊朗一个多月来首次交火后，国际油价上涨。", "EVD2254b436-ca93-592b-ab3d-49b6b76d393d": "CREA称，美国、以色列与伊朗之间的战争推高油气价格，使3月至8月全球能源进口账单较原预期增加3300亿美元。", "EVD2b86bc11-fd22-5b15-a088-573c03d9d587": "CREA称，3月至8月全球能源进口支出较原预期增加3300亿美元，油气涨价与美以和伊朗之间的战争有关。", "EVD31f9e937-9f5b-58d1-a03b-87cfeeb11be6": "海口市住建局9月5日印发楼市新政，落户人员自落户之日起即可享受海南居民同等购房待遇。", "EVD35e19465-a40a-5bf9-a3f4-da2b20d835fc": "湖南省三部门联合印发并施行老旧住房自主更新支持政策，设置三种更新模式，以产权人出资为主并辅以财政奖补、社会资本和专项贷款，政策有效期5年。", "EVDded666d8-c847-5b19-8c27-3c7541779be5": "截至7月末，河南银行机构对城市更新项目授信1146亿元、放款350亿元，并对城中村改造专项借款授信1928亿元、投放1311亿元。", "EVD68e4ec72-7a86-5d8f-8a97-ff14cda44fb3": "中国人民银行公告将于2026年9月7日开展5000亿元、期限89天的买断式逆回购操作，以保持银行体系流动性充裕。", "EVD00d82162-b4b5-5b51-90bb-0d6808e719d6": "今年以来，技术门槛下降、从业者涌入和产能扩张推动AI短剧每分钟制作报价从5000元降至几百元，定制业务仍报1万至2万元。", "EVD203a2cb8-22d4-535e-af9f-f4bc6545e709": "Google发布并上线生产就绪的Gemini Omni 1.1 Flash，新增最长40秒场景延展、首尾帧插值、360p快速低成本预览和最高4K输出等能力。", "EVDcaf71077-ee98-54cd-b953-c51b72912b6c": "Adobe已将Gemini Omni Flash集成到Adobe Firefly，用于提供生成式视频编辑能力。", "EVD2ed90fa6-a8db-5a83-a3c9-8c6d946cdab4": "Playco使用GPT-6 Astra从同一灰盒基础构建了三个主题游戏原型，并称人工修正次数较上一代模型减少50%。", "EVD1a74d115-d55c-544c-8e9b-984cfb12e910": "面向“十五五”，山西计划推进两大非常规天然气勘探开发基地及煤与煤层气共采，目标实现年产量300亿立方米、年产值1000亿元。", "EVD4857addd-f54b-5a5e-863f-90a082ab34de": "雪佛龙宣布将投资70亿美元，并计划到2031年把其在委内瑞拉的石油产量提高一倍以上。", "EVD3ce39261-2539-5aa0-b0c7-158a5060ca7f": "美国国防部战略资本办公室将无偿取得NABEP 35%股权，国务院可按成本购买20%产量并对其余80%享有优先购买权，美国政府还拥有董事任命否决权。", "EVD506e6f27-8b22-5f26-9e95-fa10575dc422": "委内瑞拉罗德里格斯政府向North America Blue Energy Partners授予17个油田为期100年的特许经营权，涉及白宫所称650亿桶已探明原油储量。", "EVD1575267d-9617-5620-8b31-8cf6b12bb7c0": "Equinor已启动弗吉尼亚州PJM市场四个电池储能项目的建设，合计规模为80MW/160MWh。", "EVD0ed8b665-10ae-5e74-bca1-168a439acfad": "随着Megapack需求增长，特斯拉已在美国得州Brookshire工厂开始生产下一代Megapack 3储能系统。", "EVD34c9095c-bf55-55a1-a67b-50e533046329": "特斯拉推出采用磷酸铁锂电芯的Megapack 3，单机容量5MWh、功率2.5MW，能量密度较上一代提高28%，最长支持8小时储能。", "EVDa8937789-809e-584d-b911-01d50774fc11": "Equinor预计弗吉尼亚州PJM市场四个储能项目将于2027年初投入商业运营。", "EVDdcdf81cf-8d0c-584a-b30c-9adb622844a3": "特斯拉计划使得州Brookshire工厂具备50GWh的Megapack 3年产能，并预计于2026年底开始交付。", "EVDdd64abbf-446c-5e52-b187-95dfcf3f4226": "特斯拉近期与NatPower签署多年期协议，将向意大利和英国供应超过25GWh储能系统，该协议属于目标部署超100GWh的更大项目。", "EVDecba0a46-6fa1-5a13-8ed9-1ddfa0835cf7": "美国总统唐纳德·特朗普发布行政命令，禁止从包括中国在内的24个国家进口逆变器、变压器、储能系统及其他大宗电力设备。", "EVD17a4e165-551e-50e7-907f-de10373ec9f8": "印度中央电力管理局发布修订条例草案，拟要求2027年7月1日起投运的可再生能源电站至少15%的逆变器具备构网型控制，电池储能系统的全部功率转换系统也须具备该能力。", "EVD33ef95a3-e365-5c55-a6bc-bf2343afd84d": "印度中央电力管理局拟要求2027年7月1日起投运的地面光伏和陆上风电项目配建不低于装机容量10%、时长至少2小时的共址储能，并从2029年7月起将时长提高至4小时。", "EVD27980646-8dd7-52cd-8a32-3de3f6ed0911": "JLi Battery创始人Jerry Wan称，宁德时代本周下调了314Ah磷酸铁锂电芯价格。", "EVD24f3fcec-634f-50b5-8632-a3e0f0cbfa55": "AmpVerve的Farah Z称，澳大利亚电池储能系统对电价价差的利用正反过来压缩可套利价差。", "EVD0eba6120-b55d-5a62-bd52-3b1b082a34ee": "Enspired的Ryan Alexander称，其储能组合在德国电网遭遇双重破坏袭击期间参与维持系统稳定。", "EVD5a8cf714-5a40-503a-871f-6d43dfe106cf": "EPC Power上月在南卡罗来纳州启用第三座美国制造工厂，新增27GW年名义产能，并可扩至40GW。", "EVDdd89d9e2-93ea-507e-b27c-d70dee075e51": "Flex预计EPC Power在2026年实现约8亿美元营收，2027年营收增长约40%，并预计2027年EBITDA利润率约30%。", "EVD32ff51bc-b8e1-5d6b-a1e9-97b5470d1520": "8月31日，江西寻乌抽水蓄能电站启动地下厂房中导洞开挖，装机容量120万千瓦的主体工程进入全面建设阶段。", "EVD364a8b92-a9f7-5e7c-a1e8-3f0a72f09b28": "江西寻乌抽水蓄能电站预计2030年首台机组投产发电，2031年全部机组投产发电。", "EVD29cc719e-6d30-5970-bae1-c49899ae11a8": "Inox Clean Energy于2026年4月完成约7.5亿美元收购Boviet Solar，取得其美国北卡罗来纳州工厂3GW光伏组件年产能。", "EVD2c032da7-cc4c-53c8-9010-b9e0052a8513": "Boviet Solar收购交易还包括新增3GW光伏电池年产能的计划，相关电池工厂预计于2027年投产。", "EVD52a7e296-9b2c-55ad-a64f-7599fcab0d37": "非洲光伏制造产能预计在2026年增至约3.5GW、达到原来的四倍，主要由埃及和坦桑尼亚新工厂投产推动，但多数产出将出口美国。", "EVD9791e7d3-b651-5f76-830c-1c93b10a7a7e": "Inox Solar Americas计划从2027年开始，为美国北卡罗来纳州和得克萨斯州三个合计约767MW的光伏项目交付组件。", "EVD919523ff-5fc0-5b3b-a25c-12527cc35b60": "研究预计非洲2026年新增光伏装机每年可发电约23TWh，足以覆盖非洲过去十年的平均年度用电需求增量；十国年度发电量将因此增加逾10%。", "EVD1ef72162-dbf8-5bde-a673-9eab87c12c6d": "印度上一财年新增约45GW太阳能装机，同比增长逾40%；屋顶光伏装机由约17GW增至25GW，增幅逾47%。", "EVD141b941f-7f71-5719-a8c3-8aee08c7cf06": "澳大利亚可再生能源署白皮书显示，公用事业级光伏加权平均安装成本停滞在每瓦1.52澳元，系统平衡成本已成为主要成本项。", "EVD419512fc-131a-5568-86e2-9b71c9837173": "印度电力部已启动为期12个月的印度能源栈概念验证，在德里、古吉拉特、安得拉、北方邦和孟买的配电企业开展试点，示范安排在FY2026-27。", "EVD0e1994ee-b1af-5333-83c4-690fcd12039e": "印度AI影响力峰会2026期间，印度能源栈现场演示点对点能源交易，一名农户通过数字平台向小型商业用户出售剩余太阳能电力并实时结算。", "EVDc8f0f17a-a5cf-5e95-ad9f-7aea3c1da1ec": "印度政府于2025年宣布建设印度能源栈，拟以统一数字身份、资产登记、数据交换和开放接口支撑分布式能源并网及电力市场协同。", "EVD21332969-bf02-5d3b-9b5d-2300c573549d": "中国电子学会报告显示，2026年上半年中国人形机器人出货量已超4万台，全球占比提升至97%。", "EVD5b83cab3-f215-5e03-b628-a8b18b3c734e": "欧洲委员会的AI大陆行动计划包括19座AI工厂，并将AI千兆工厂规划由最多5座上调至7座，同时拟在未来5至7年至少把欧盟数据中心容量扩大至三倍。", "EVD35b4787d-9cd6-5191-9409-45187b611e72": "德国电信正在使用近10,000颗英伟达Blackwell GPU建设慕尼黑工业人工智能云。", "EVD8dbf83bb-6796-5cb2-b38a-b841b33bcb4e": "SK集团已承诺在其5GW数据中心建设中部署2GW英伟达Rubin算力，Naver另签约部署200MW，为英伟达增加韩国主权AI客户需求。", "EVDb318a847-1249-557c-a746-e95102531f7f": "SK Telecom宣布建设2GW的DSX AI工厂，预计部署采用SK海力士HBM4的英伟达Vera Rubin系统。", "EVDf9bff26a-955f-5e29-84aa-55876d20669c": "受新建数据中心电力需求推动，美国燃烧涡轮需求升至历史最高水平，而钇供应不稳定已影响相关涂层厂商。", "EVD3659f69f-954e-5166-8c10-b241a8d6957c": "2026年8月21日后，受vLLM优化推动，英伟达B200在DeepSeek V4 Pro智能体推理中的单位成本性能超过AMD MI355X，B300 vLLM和B200 SGLang也保持领先。", "EVD949be8cd-15d4-5a0a-963b-701bc6b500c4": "OpenAI的Jalapeño B0版本已进入晶圆厂，采用台积电N3P工艺；文章称其相较A0每瓦性能约提升25%，MXFP4算力为13.4 PFLOPs。", "EVDc5850188-a8e8-5106-b109-ec3dfca5aaa0": "OpenAI于2026年6月发布与Broadcom合作的Jalapeño自研ASIC项目，该芯片从零设计、专用于大语言模型推理，开发至流片约用16个月。", "EVDc0155b15-b9fe-5095-880d-8903814b401b": "OpenAI与Celestica合作设计Jalapeño机架级系统；每个ASIC机架配置128颗芯片，扩展网络最多连接16个机架、2048颗XPU。", "EVDcf7ff967-864d-54a1-9bab-55b84c30b8be": "Jalapeño目前仅有工程样片，OpenAI计划在2027年逐步扩大生产，多数产出安排在年末，下一阶段部署目标为100MW。", "EVD14e8fadb-cbb9-54a5-9c4d-ab1539c59128": "美国陆军的微型反应堆项目要求五家入选企业另行筹集数十亿美元私人投资，以支持项目开发。", "EVD188907b7-57ea-57cd-97a2-454ef34a37f2": "美国陆军8月宣布拟向五家公司提供最高22亿美元融资，在美国五座军事基地建设新一代微型核反应堆。", "EVD1cee9d79-7454-5f21-92f4-1431c2effcb9": "美国陆军8月宣布最高投入22亿美元，资助五家公司在五座美国军事基地建设新一代微型反应堆。", "EVD27e4114c-96b2-5f5b-887e-458b29a5a547": "美国、日本和韩国于今年7月签署小型模块化反应堆部署合作协议，拟协调三国核工业、简化许可并优化供应链。", "EVD32205fd1-0319-5382-8d78-c9cfc50e2c31": "Aalo在7月宣布其临界试验反应堆已实现临界运行，并正开发用于AI数据中心的10 MWe反应堆及50 MWe组合模块。", "EVD52bad6aa-9939-51ad-84c9-0f1b067f46f9": "美国第14299号行政命令指定陆军牵头军事核能工作，并要求建立正式项目，在2028年9月30日前于美国国内军事设施投入一座可运行反应堆。", "EVDd67abdd5-92a7-5bfb-9fbc-d35aa6f9924e": "美国政府支持多类核技术发展，并以到2050年将美国核电产量增至四倍为目标。"}};
const reports=detailData.reports.map(r=>({id:r.id,kind:r.kind,story:r.name,level:r.level,conclusion:r.conclusion,logic:r.logic.split('\n').filter(Boolean).map(x=>x.replace(/^- /,'')),evidence:r.evidence,anchors:r.anchors.map(a=>({name:a['受影响锚点']||a['受影响锚点（节点）'],result:a['结果'],confidence:a['置信度'],period:a['周期'],basis:a['结论性质']}))}));
let kind='geo',query='',active=null,lastFocus=null;
const icon=(n)=>`<img src="${assets['icons/'+n+'.svg']}" alt="">`;
const direction={升温:'warming',降温:'cooling',分化:'diverging'};
function anchors(items){return items.map(a=>`<div class="anchor"><div class="anchor-top"><span class="anchor-name">${a.name}</span><span class="direction ${direction[a.result]}">${icon('report-activity-'+direction[a.result])}${a.result}</span></div><div class="tags"><span>${icon('report-confidence')}置信 <strong>${a.confidence}</strong></span><span>${icon('report-clock')}<strong>${a.period}</strong></span><span>${a.basis}</span></div></div>`).join('')}
function impactSummary(items){return `<div class="impact-summary"><div class="impact-count"><strong>${items.length}</strong><span>受影响锚点</span></div><div class="impact-chips">${items.map(a=>`<div class="impact-chip"><span class="impact-chip-name">${a.name}</span><span class="impact-chip-result ${direction[a.result]}">${a.result}</span></div>`).join('')}</div></div>`}
function render(){const items=reports.filter(r=>r.kind===kind&&(!query||[r.story,r.conclusion,...r.anchors.map(a=>a.name)].join('').includes(query)));document.querySelector('#count').textContent=items.length+' 条结论';document.querySelector('#cards').innerHTML=items.length?items.map(r=>`<article class="card"><div class="card-meta"><div class="story"><span>${r.story}</span><span class="level ${r.level==='中影响'?'medium':''}">${r.level}</span></div><time class="published" datetime="2026-09-07">${icon('report-clock')}09.07 报告样例</time></div><h2 class="conclusion">${r.conclusion}</h2><div class="logic">${r.logic.join('<br>')}</div>${impactSummary(r.anchors)}<footer class="footer"><button class="evidence" data-evidence="${r.id}">${icon('file-text')}${r.evidence.length} 条证据</button><button class="path" data-detail="${r.id}">查看影响路径${icon('report-arrow-right-light')}</button></footer></article>`).join(''):`<div class="empty"><h2>${query?'暂无匹配的结论':'本期暂无宏观经济结论'}</h2><p>${query?'试试搜索其他事件或受影响锚点。':'本期报告尚无可发布的宏观经济故事线。<br>可以切换其他板块查看结论。'}</p></div>`;document.querySelector('#end').hidden=!items.length}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render()});
document.querySelector('#search').onsubmit=e=>{e.preventDefault();query=e.target.querySelector('input').value.trim();render()};
document.querySelector('#search input').oninput=e=>{if(!e.target.value){query='';render()}};
function closeEvidence(){document.querySelector('#overlay').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
document.querySelector('.close').onclick=closeEvidence;document.querySelector('#overlay').onclick=e=>{if(e.target.id==='overlay')closeEvidence()};document.addEventListener('keydown',e=>{if(!document.querySelector('#overlay').hidden){if(e.key==='Escape')closeEvidence();if(e.key==='Tab'){const focusable=[...document.querySelector('#overlay').querySelectorAll('button,[href],[tabindex="0"]')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const detailAliases={geo1:'G1',chain1:'C1',chain2:'C2'};
let detailReport=null,detailChain=null,detailNode=null,homeScroll=0;

function dHorizontalGraph(c){

}

 const [,raw,cid]=location.hash.split('/');detailReport=detailData.reports.find(r=>r.id===(detailAliases[raw]||raw));if(!detailReport){location.hash='';return}
 document.querySelector('#home').hidden=true;const d=document.querySelector('#detail');d.hidden=false;
 d.innerHTML=`<nav class="d-nav"><button data-home>‹ 返回</button><strong>推理分析</strong><button data-catalog>目录</button></nav><header class="d-hero"><div class="d-kicker"><span class="d-level">${detailReport.level}</span><span>${{geo:'地缘政治',macro:'宏观经济',chain:'产业链'}[detailReport.kind]}</span><span>09.07 · 报告样例</span></div><div class="d-story">${detailReport.id} · ${escapeHTML(detailReport.name)}</div><h2>${escapeHTML(detailReport.conclusion)}</h2>${detailReport.kind==='chain'?`<div class="d-overview">${detailReport.logic.split('\n').filter(Boolean).map(x=>`<div>${escapeHTML(x.replace(/^- /,''))}</div>`).join('')}</div>`:''}</header><div class="d-main"><div class="d-tabs geo-tabs" role="tablist" aria-label="因果链">${detailReport.chains.map(c=>`<button data-causal="${c.id}" role="tab" aria-controls="d-panel" aria-selected="false"><small class="geo-tab-type">${c.targetType==='macro'?'宏观经济':'产业链'}</small><span class="geo-tab-name">${escapeHTML(c.name)}</span></button>`).join('')}</div><div id="d-panel" class="d-panel" role="tabpanel" aria-label="当前因果链详情"></div></div>`;
 selectChain(cid);window.scrollTo(0,0);
}
function showV5Sheet(title,content){lastFocus=document.activeElement;const list=document.querySelector('#evidence-list');list.innerHTML=`<h3 class="d-sheet-heading">${escapeHTML(title)}</h3>${content}`;document.querySelector('#overlay').hidden=false;document.querySelector('#overlay').setAttribute('aria-label',title);document.querySelector('.sheet').setAttribute('aria-label',title);document.querySelector('.close').setAttribute('aria-label','关闭'+title);document.body.style.overflow='hidden';document.querySelector('.close').focus()}
function openEvidence(id){const r=detailData.reports.find(r=>r.id===id);if(r)openV5Evidence(r.evidence,r.name)}
function openV5Evidence(ids,title){showV5Sheet('相关证据',`<p class="d-sheet-meta">${escapeHTML(title)} · ${ids.length} 条证据</p>${ids.map((id,i)=>`<article class="evidence-item"><time>证据 ${String(i+1).padStart(2,'0')}</time><p>${escapeHTML(detailData.evidence[id]||'报告未提供此条证据摘要')}</p><div class="d-evidence-id">${id}</div></article>`).join('')}`)}
function catalog(){showV5Sheet('本期报告目录',`<div class="d-catalog">${['geo','macro','chain'].map(k=>`<h4>${{geo:'地缘政治',macro:'宏观经济',chain:'产业链'}[k]}</h4>${detailData.reports.filter(r=>r.kind===k).map(r=>`<button data-report="${r.id}"><small>${r.id}</small>${escapeHTML(r.name)}<span>${r.chains.length} 条</span></button>`).join('')}`).join('')}</div>`)}
document.addEventListener('click',e=>{
 const node=e.target.closest('[data-node]'),ev=e.target.closest('[data-v5-evidence]'),ct=e.target.closest('[data-causal]'),r=e.target.closest('[data-report]');
 if(ev)openV5Evidence(ev.dataset.v5Evidence.split(','),ev.dataset.label);
 if(ct)selectChain(ct.dataset.causal);
 if(node){const scroll=document.querySelector('#d-graph .target-graph-scroll')?.scrollLeft||0;detailNode=node.dataset.node;document.querySelector('#d-graph').innerHTML=dGraph(detailChain);const scroller=document.querySelector('#d-graph .target-graph-scroll');if(scroller)scroller.scrollLeft=scroll;document.querySelector('#d-node-result').innerHTML=dNodeResult(detailChain);document.querySelectorAll('.d-node-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.node===detailNode)))}
 if(e.target.closest('[data-home]')){location.hash='';window.scrollTo(0,homeScroll)}
 if(e.target.closest('[data-catalog]'))catalog();
 if(r){closeEvidence();location.hash='detail/'+r.dataset.report;route()}
 if(e.target.closest('[data-prev],[data-next]')){const delta=e.target.closest('[data-next]')?1:-1;const next=detailReport.chains[detailReport.chains.indexOf(detailChain)+delta];if(next){selectChain(next.id);document.querySelector('.d-main').scrollIntoView({block:'start'})}}
});
document.addEventListener('keydown',e=>{if(e.target.matches('.d-graph-node')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

document.addEventListener('click',e=>{const ev=e.target.closest('[data-evidence]'),dt=e.target.closest('[data-detail]');if(ev)openEvidence(ev.dataset.evidence);if(dt)showDetail(dt.dataset.detail)});window.addEventListener('hashchange',route);render();route();
</script></body></html>
