<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>观潮家 · 今日观潮 2.0</title>
<style>
:root{--navy:#0b1f49;--ink:#112555;--blue:#2563eb;--muted:#8290a6;--border:#dfe4ee;--gold:#d5aa49;--canvas:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:#e8edf4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8bb5ff;outline-offset:3px}button{color:inherit}img{display:block}
.stage{max-width:414px;margin:32px auto;box-shadow:0 18px 65px #182b4d22;border-radius:28px;overflow:hidden;background:var(--canvas);min-height:860px;position:relative}
.hero{position:relative;padding:0 12px 36px;background:linear-gradient(125deg,#1c396b 0%,#0b1f49 65%,#07142f 100%);color:white;overflow:hidden}
.status{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:600;font-size:14px}
.status img{width:64px;max-height:16px;object-fit:contain;filter:brightness(0) invert(1)}
.brand{height:58px;display:flex;align-items:center;justify-content:space-between}
.avatar{width:35px;height:35px;border:1px solid #e7d5aa;border-radius:50%;object-fit:cover}
.brand strong{font-size:23px;letter-spacing:1px;margin-left:32px}
.capsule{border:1px solid #ffffff60;border-radius:24px;width:90px;height:34px;display:flex;align-items:center;justify-content:center;gap:10px;background:#07142f55}
.capsule span{letter-spacing:2px;font-size:18px}
.capsule i{height:19px;width:1px;background:#ffffff55}
.capsule b{font-size:22px;line-height:1}
.search{margin-top:13px;height:43px;border:1px solid #e7d5aa;border-radius:26px;background:#fbfbfc;display:flex;align-items:center;padding:3px 3px 3px 15px;gap:10px;box-shadow:0 4px 12px #07142f18}
.search>img{width:21px;height:21px}
.search input{min-width:0;width:100%;background:transparent;border:0;outline:none;color:#173665;font-size:14px;padding:0}
.search input::placeholder{color:#8da2c2}
.search button{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--navy);border:1px solid #e7d5aa;display:grid;place-items:center}
.search button img{width:23px;height:23px}
.content{position:relative;margin-top:-13px;border-radius:24px 24px 0 0;background:var(--canvas);padding:20px 12px 28px;min-height:620px}
.tabs{display:flex;gap:4px;margin:0 0 22px;padding:5px;background:#e8edf5;border:1px solid #dfe6ef;border-radius:14px}
.tabs button{position:relative;flex:1;border:0;border-radius:10px;background:transparent;color:#6b7c97;font-size:14px;font-weight:600;min-height:42px;transition:background .18s,color .18s,box-shadow .18s}.tabs button::after{content:"";position:absolute;bottom:4px;left:calc(50% - 9px);width:18px;height:2px;border-radius:2px;background:transparent}
.tabs button[aria-selected=true]{color:var(--navy);background:white;box-shadow:0 2px 6px #10264b12;font-weight:700}.tabs button[aria-selected=true]::after{background:var(--gold)}
.heading{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 15px}
.heading h1{font-size:22px;margin:0;font-weight:750;letter-spacing:.3px}
.heading span{font-size:12px;color:#8290a6}
.cards{display:grid;gap:16px}
.card{background:white;border:1px solid #d5deea;border-top:3px solid #2563eb;border-radius:12px;padding:17px 14px 14px;box-shadow:0 3px 7px #0f172a12}
.card-meta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.story{min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:65%;font-size:13px;font-weight:650;line-height:1.5}
.level{font-size:10px;line-height:19px;padding:0 6px;border-radius:10px;white-space:nowrap;color:#c6283f;background:#fef2f2;font-weight:650}
.level.medium{background:#fffbeb;color:#96530f}
.published{font-size:10px;line-height:20px;white-space:nowrap;color:#8290a6;display:flex;align-items:center;gap:4px;flex-shrink:0}
.published img{width:12px;height:12px;opacity:.65}
.conclusion{margin:14px 0 12px;font-size:20px;font-weight:700;line-height:1.55;color:#0b2a5a;letter-spacing:.1px}
.logic{border:1px solid #dfe4ee;background:#f7f9fc;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.8;color:#344a6c}
.logic b{color:#8ca0bd;font-weight:400;margin:0 4px}

.impact-summary{display:flex;align-items:center;gap:14px;margin-top:18px;margin-bottom:3px}
.impact-count{flex:0 0 52px;border-right:1px solid #e4e9f0;padding-right:10px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.impact-count strong{font-size:32px;font-weight:650;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums;color:#0b2a5a}
.impact-count span{font-size:10px;color:#7889a3;white-space:nowrap;margin-top:6px}
.impact-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;flex:1}
.impact-chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;border:1px solid #e2d7bc;border-radius:6px;padding:8px;background:#fffdf8;color:#17345d;line-height:1.4}
.impact-chip-name{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.impact-chip-result{font-size:11px;font-weight:600;white-space:nowrap;padding-left:7px;border-left:1px solid #e8e0cf}
.impact-chip-result.cooling{color:#137a4a;background:none}.impact-chip-result.warming{color:#c6283f;background:none}.impact-chip-result.diverging{color:#96530f;background:none}
@media(prefers-reduced-motion:reduce){.tabs button{transition:none}}

.anchors{display:grid;gap:8px;margin-top:14px}
.anchor{border:1px solid #e1e7f0;border-radius:7px;background:#fbfcfe;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.anchor-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.anchor-name{font-size:14px;font-weight:650}
.direction{font-size:12px;font-weight:650;padding:3px 7px;border-radius:12px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.direction img{width:12px;height:12px}
.warming{color:#c6283f;background:#fef2f2}
.cooling{color:#137a4a;background:#f0fdf4}
.diverging{color:#96530f;background:#fffbeb}
.tags{display:flex;gap:12px;font-size:11px;color:#64748b;align-items:center;flex-wrap:wrap}
.tags span{display:flex;gap:4px;align-items:center}
.tags img{width:12px;height:12px}
.tags strong{font-weight:600;color:#43516a}
.footer{border-top:1px solid #dfe4ee;margin-top:15px;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.evidence{display:flex;align-items:center;gap:6px;color:#1c4db4;background:transparent;border:0;padding:9px 0;font-size:13px;font-weight:600}
.evidence img{width:17px;height:17px}
.path{display:flex;align-items:center;gap:9px;border:1px solid var(--gold);border-radius:23px;background:#0b2a5a;color:white;font-size:12px;font-weight:650;min-height:36px;padding:0 14px}
.path img{width:16px;height:16px}
.end{text-align:center;color:#9ba8bc;font-size:11px;margin:24px 0 8px}
.empty{text-align:center;padding:60px 16px;background:white;border:1px solid var(--border);border-radius:12px}
.empty h2{font-size:17px}
.empty p{font-size:13px;color:#8290a6;line-height:1.8}
.preview-note{max-width:414px;margin:16px auto 32px;text-align:center;font-size:12px;color:#73839c;line-height:1.8;padding:0 20px}
.overlay{position:fixed;inset:0;z-index:10;background:#07142f85;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden],section[hidden]{display:none!important}
.sheet{background:white;width:100%;max-width:414px;max-height:76dvh;border-radius:20px 20px 0 0;box-shadow:0 -9px 26px #07142f33;position:relative;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.handle-zone{height:40px;flex-shrink:0;display:grid;place-items:center}
.handle{width:42px;height:5px;background:#dfe4ee;border-radius:5px}
.close{position:absolute;right:11px;top:8px;width:32px;height:32px;border:1px solid #dfe4ee;border-radius:50%;background:white;color:#1c4db4;font-size:20px}
.sheet-body{overflow:auto;padding:4px 18px 24px;display:grid;gap:10px}
.evidence-item{padding:13px;border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 2px #0f172a0f}
.evidence-item time{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:650;color:#1c4db4}
.evidence-item time img{width:12px;height:12px}
.evidence-item p{font-size:14px;font-weight:600;line-height:1.6;margin:10px 0}
.keywords{display:flex;gap:6px;flex-wrap:wrap}
.keywords span{font-size:11px;color:#1c4db4;border:1px solid #cfdced;background:#f8fafc;border-radius:20px;padding:3px 7px}
.detail{min-height:860px;background:var(--canvas)}
.detail-head{background:var(--navy);color:white;padding:20px 16px;display:flex;align-items:center;gap:18px;font-size:18px;font-weight:650}
.back{border:1px solid #ffffff55;background:transparent;color:white;border-radius:50%;width:34px;height:34px;font-size:23px}
.detail-body{padding:20px 14px}
.detail-body h2{font-size:22px;line-height:1.6}
.detail-body h3{font-size:16px;margin-top:24px}
.detail-body p{font-size:14px;line-height:1.8;color:#53627b}
.detail-kicker{font-size:12px;color:#8290a6}
.chain-tabs{display:flex;gap:6px;overflow:auto}
.chain-tabs button{border:1px solid #cad6e5;border-radius:8px;background:white;padding:10px;font-size:12px;flex-shrink:0}
.chain-tabs button[aria-selected=true]{background:var(--navy);color:white;border-color:var(--gold)}@media(max-width:480px){body{background:var(--canvas)}
.stage{margin:0 auto;border-radius:0;box-shadow:none;min-height:100dvh}
.preview-note{margin:16px auto}
.overlay{align-items:flex-end}}@media(prefers-reduced-motion:no-preference){.sheet{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(100%)}}}

function openEvidence(id){lastFocus=document.activeElement;const r=reports.find(r=>r.id===id);document.querySelector('#evidence-list').innerHTML=r.evidence.map(i=>{const e=evidence[i];return `<article class="evidence-item"><time>${icon('report-clock')}时间待确认</time><p>${e.text}</p><div class="keywords">${e.tags.map(t=>`<span>${t}</span>`).join('')}</div></article>`}).join('');document.querySelector('#overlay').hidden=false;document.body.style.overflow='hidden';document.querySelector('.close').focus()}

function route(){if(location.hash.startsWith('#detail/')){const r=reports.find(r=>r.id===location.hash.split('/')[1]);if(!r)return;document.querySelector('#home').hidden=true;const d=document.querySelector('#detail');d.hidden=false;d.innerHTML=`<div class="detail-head"><button class="back" aria-label="返回今日观潮">‹</button>影响路径</div><div class="detail-body"><div class="detail-kicker">${r.story} · 09.06 22:22 发布</div><h2>${r.conclusion}</h2><p>${r.detail}</p><h3>传导逻辑</h3><div class="logic">${r.logic.join('<b>→</b>')}</div><h3>受影响锚点</h3><div class="anchors">${anchors(r.anchors)}</div>${r.chains.length?`<h3>产业链因果链</h3><div class="chain-tabs">${r.chains.map((c,i)=>`<button aria-selected="${i===0}" data-chain="${c}">${c}</button>`).join('')}</div><p id="chain-text">${r.chains[0]}</p>`:''}<button class="evidence" data-evidence="${r.id}">${icon('file-text')}${r.evidence.length} 条证据</button></div>`;d.querySelector('.back').onclick=()=>history.back();d.querySelectorAll('[data-chain]').forEach(b=>b.onclick=()=>{d.querySelectorAll('[data-chain]').forEach(x=>x.setAttribute('aria-selected',String(b===x)));d.querySelector('#chain-text').textContent=b.dataset.chain});window.scrollTo(0,0)}else{document.querySelector('#home').hidden=false;document.querySelector('#detail').hidden=true}}
