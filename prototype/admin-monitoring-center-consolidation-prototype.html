<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>观潮家 Admin · 监控中心整合设计稿</title>
    <style>
      /*
       * PROTOTYPE — throwaway UI, not production code.
       * Three monitoring-center variants, switchable with ?variant=A|B|C.
       * Question: how should Agent status and pipeline execution details be consolidated?
       */
      :root {
        color-scheme: light;
        --background: #f8fafc;
        --foreground: #0f172a;
        --card: #ffffff;
        --muted: #f1f5f9;
        --muted-foreground: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: #eff6ff;
        --success: #15803d;
        --success-soft: #f0fdf4;
        --success-border: #bbf7d0;
        --running: #2563eb;
        --running-soft: #eff6ff;
        --running-border: #bfdbfe;
        --danger: #b91c1c;
        --danger-soft: #fef2f2;
        --danger-border: #fecaca;
        --warning: #a16207;
        --warning-soft: #fffbeb;
        --warning-border: #fde68a;
        --sidebar-width: 244px;
        --topbar-height: 64px;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 1px rgba(15, 23, 42, 0.04);
        --shadow-2: 0 4px 8px -2px rgba(15, 23, 42, 0.1);
        --shadow-4: 0 16px 40px -12px rgba(15, 23, 42, 0.24);
        font-family:
          "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Inter, ui-sans-serif, system-ui,
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: var(--background); color: var(--foreground); }
      button, input, select { font: inherit; }
      button { color: inherit; }
      button:focus-visible, select:focus-visible, input:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px #dbeafe;
      }

      .app { min-height: 100vh; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 30;
        display: flex;
        width: var(--sidebar-width);
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--card);
      }
      .brand {
        display: flex;
        min-height: var(--topbar-height);
        align-items: center;
        gap: 11px;
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
      }
      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        flex: none;
        place-items: center;
        border-radius: var(--radius-lg);
        background: var(--primary);
        color: white;
        font-family: Georgia, "Songti SC", serif;
        font-size: 18px;
        font-weight: 700;
        box-shadow: var(--shadow-1);
      }
      .brand-copy strong, .brand-copy span { display: block; }
      .brand-copy strong { font-size: 14px; }
      .brand-copy span { margin-top: 2px; color: var(--muted-foreground); font-size: 10px; }
      .sidebar-body { flex: 1; padding: 22px 10px; }
      .sidebar-label {
        padding: 0 10px 8px;
        color: var(--muted-foreground);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .nav-item {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        border: 0;
        border-radius: var(--radius-md);
        background: transparent;
        padding: 10px;
        text-align: left;
        cursor: pointer;
        transition: background 150ms ease, color 150ms ease;
      }
      .nav-item + .nav-item { margin-top: 3px; }
      .nav-item:hover { background: var(--muted); }
      .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
      .nav-icon { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; }
      .nav-label { min-width: 0; flex: 1; font-size: 13px; }
      .nav-meta { color: var(--muted-foreground); font-size: 10px; font-weight: 500; }
      .nav-item.active .nav-meta { color: var(--primary); opacity: 0.72; }
      .backend-state {
        display: flex;
        align-items: center;
        gap: 10px;
        border-top: 1px solid var(--border);
        padding: 14px 16px;
      }
      .backend-icon {
        position: relative;
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: var(--radius-md);
        background: var(--muted);
      }
      .backend-icon::after {
        position: absolute; top: 5px; right: 5px; width: 6px; height: 6px;
        border: 1.5px solid white; border-radius: 50%; background: #16a34a; content: "";
      }
      .backend-copy strong, .backend-copy span { display: block; }
      .backend-copy strong { font-size: 11px; }
      .backend-copy span { margin-top: 2px; color: var(--muted-foreground); font-size: 10px; }

      .shell { min-height: 100vh; margin-left: var(--sidebar-width); }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        height: var(--topbar-height);
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,.94);
        padding: 0 24px;
        backdrop-filter: blur(12px);
      }
      .topbar-title small, .topbar-title strong { display: block; }
      .topbar-title small { color: var(--muted-foreground); font-size: 10px; font-weight: 700; letter-spacing: .13em; }
      .topbar-title strong { margin-top: 2px; font-size: 14px; }
      .top-actions { display: flex; align-items: center; gap: 8px; }
      .icon-btn, .avatar {
        display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid var(--border);
        border-radius: var(--radius-md); background: var(--card); cursor: pointer;
      }
      .avatar { border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 700; }
      .main { padding: 24px; }
      .content { width: min(100%, 1500px); margin: 0 auto; }

      .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
      .eyebrow { color: var(--muted-foreground); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 5px 0 4px; font-size: 24px; line-height: 1.3; letter-spacing: -.025em; }
      h2, h3, p { margin-top: 0; }
      .description { margin: 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.55; }
      .head-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
      .button {
        display: inline-flex; min-height: 36px; align-items: center; justify-content: center; gap: 7px;
        border: 1px solid transparent; border-radius: var(--radius-md); padding: 0 12px;
        background: var(--primary); color: white; font-size: 12px; font-weight: 600; cursor: pointer;
        transition: background 150ms ease, box-shadow 150ms ease;
      }
      .button:hover { background: var(--primary-hover); }
      .button.secondary { border-color: var(--border); background: var(--card); color: var(--foreground); }
      .button.secondary:hover { background: var(--muted); }
      .button.ghost { background: transparent; color: var(--muted-foreground); }
      .button.ghost:hover { background: var(--muted); color: var(--foreground); }
      .button.small { min-height: 30px; padding: 0 10px; font-size: 11px; }
      .select {
        height: 36px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card);
        padding: 0 32px 0 10px; color: var(--foreground); font-size: 12px;
      }
      .refresh-note { color: var(--muted-foreground); font-size: 11px; }
      .card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow-1); }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 16px; border-bottom: 1px solid var(--border); }
      .section-title { margin: 0; font-size: 13px; font-weight: 650; }
      .section-note { margin: 3px 0 0; color: var(--muted-foreground); font-size: 10px; }
      .badge {
        display: inline-flex; min-height: 22px; align-items: center; gap: 5px; border: 1px solid var(--border);
        border-radius: 999px; padding: 2px 8px; background: var(--muted); color: var(--muted-foreground);
        font-size: 10px; font-weight: 650; white-space: nowrap;
      }
      .badge::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
      .badge.success { border-color: var(--success-border); background: var(--success-soft); color: var(--success); }
      .badge.running { border-color: var(--running-border); background: var(--running-soft); color: var(--running); }
      .badge.danger { border-color: var(--danger-border); background: var(--danger-soft); color: var(--danger); }
      .badge.warning { border-color: var(--warning-border); background: var(--warning-soft); color: var(--warning); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-foreground); }
      .dot.success { background: #16a34a; }
      .dot.running { background: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
      .dot.danger { background: #dc2626; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-variant-numeric: tabular-nums; }
      .tabular { font-variant-numeric: tabular-nums; }

      /* Variant A — route-level detail */
      .agent-overview { margin-bottom: 16px; }
      .agent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .agent-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; min-width: 0; padding: 14px 16px; border-right: 1px solid var(--border); }
      .agent-row:last-child { border-right: 0; }
      .agent-name { display: flex; min-width: 0; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; }
      .agent-meta { margin: 5px 0 0 15px; color: var(--muted-foreground); font-size: 10px; }
      .agent-side { text-align: right; }
      .agent-side strong { display: block; font-size: 11px; }
      .agent-side span { display: block; margin-top: 4px; color: var(--muted-foreground); font-size: 9px; }
      .pipeline-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
      .pipeline-card { overflow: hidden; transition: box-shadow 150ms ease, transform 150ms ease; }
      .pipeline-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
      .pipeline-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px; }
      .pipeline-index { display: inline-grid; width: 28px; height: 28px; place-items: center; border-radius: var(--radius-md); background: var(--primary-soft); color: var(--primary); font-size: 10px; font-weight: 800; }
      .pipeline-title { display: flex; align-items: center; gap: 9px; }
      .pipeline-title h3 { margin: 0; font-size: 14px; }
      .pipeline-title p { margin: 3px 0 0; color: var(--muted-foreground); font-size: 10px; }
      .total-pill { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--muted); padding: 4px 7px; color: var(--muted-foreground); font-size: 9px; white-space: nowrap; }
      .state-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--border); background: #fbfdff; }
      .state-cell { border: 0; border-right: 1px solid var(--border); background: transparent; padding: 11px 13px; text-align: left; cursor: pointer; }
      .state-cell:last-child { border-right: 0; }
      .state-cell:hover { background: var(--muted); }
      .state-label { display: block; color: var(--muted-foreground); font-size: 9px; }
      .state-value { display: block; margin-top: 3px; font-size: 21px; font-weight: 700; }
      .state-value.success { color: var(--success); }
      .state-value.running { color: var(--running); }
      .state-value.danger { color: var(--danger); }
      .result-list { display: grid; gap: 8px; padding: 14px 16px; }
      .result-item { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; }
      .result-item span { color: var(--muted-foreground); }
      .result-item strong { font-weight: 650; }
      .pipeline-action { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding: 11px 16px; }
      .data-source { color: var(--muted-foreground); font-size: 9px; }
      .link-button { border: 0; background: transparent; color: var(--primary); font-size: 11px; font-weight: 650; cursor: pointer; }
      .link-button:hover { text-decoration: underline; }
      .health-strip { display: flex; align-items: center; gap: 16px; margin-top: 16px; padding: 12px 14px; }
      .health-strip strong { font-size: 11px; }
      .health-metrics { display: flex; flex: 1; flex-wrap: wrap; gap: 18px; }
      .health-metric { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 10px; }
      .health-metric b { color: var(--foreground); }

      .breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--muted-foreground); font-size: 11px; }
      .breadcrumb button { border: 0; background: transparent; padding: 0; color: var(--primary); cursor: pointer; }
      .detail-summary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
      .detail-stat { padding: 12px 14px; }
      .detail-stat span { display: block; color: var(--muted-foreground); font-size: 9px; }
      .detail-stat strong { display: block; margin-top: 4px; font-size: 19px; }
      .detail-card { overflow: hidden; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
      .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--muted); padding: 2px; }
      .segment { min-height: 28px; border: 0; border-radius: var(--radius-sm); background: transparent; padding: 0 9px; color: var(--muted-foreground); font-size: 10px; cursor: pointer; }
      .segment.active { background: var(--card); color: var(--foreground); font-weight: 650; box-shadow: var(--shadow-1); }
      .search { height: 32px; width: 220px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); padding: 0 10px; font-size: 11px; }
      .table-shell { overflow: auto; max-height: calc(100vh - 340px); min-height: 300px; }
      table { width: 100%; border-collapse: collapse; font-size: 10px; white-space: nowrap; }
      th { position: sticky; top: 0; z-index: 2; background: #f8fafc; color: var(--muted-foreground); font-size: 9px; font-weight: 650; text-align: left; }
      th, td { border-bottom: 1px solid var(--border); padding: 10px 12px; }
      tbody tr:hover { background: #f8fafc; }
      td.id { max-width: 180px; overflow: hidden; text-overflow: ellipsis; font-family: "SFMono-Regular", Consolas, monospace; }
      .table-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; color: var(--muted-foreground); font-size: 10px; }
      .pagination { display: flex; align-items: center; gap: 5px; }
      .page-btn { display: grid; min-width: 28px; height: 28px; place-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 10px; cursor: pointer; }
      .page-btn.active { border-color: var(--primary); background: var(--primary); color: white; }

      /* Variant B — operations cockpit + right sheet */
      .cockpit { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; }
      .agent-rail { overflow: hidden; }
      .rail-body { display: grid; }
      .rail-agent { padding: 14px 15px; border-bottom: 1px solid var(--border); }
      .rail-agent:last-child { border-bottom: 0; }
      .rail-agent-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .rail-agent-name { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 650; }
      .rail-agent dl { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 10px 0 0; font-size: 9px; }
      .rail-agent dt { color: var(--muted-foreground); }
      .rail-agent dd { margin: 0; font-family: "SFMono-Regular", Consolas, monospace; }
      .pipeline-list { display: grid; gap: 10px; }
      .pipeline-row { display: grid; grid-template-columns: minmax(180px,1fr) repeat(3,96px) 170px; align-items: center; gap: 0; overflow: hidden; }
      .row-name { padding: 16px; }
      .row-name strong { display: block; font-size: 13px; }
      .row-name span { display: block; margin-top: 4px; color: var(--muted-foreground); font-size: 9px; }
      .row-state { height: 100%; border-left: 1px solid var(--border); padding: 13px; }
      .row-state span { display: block; color: var(--muted-foreground); font-size: 9px; }
      .row-state strong { display: block; margin-top: 3px; font-size: 18px; }
      .row-action { display: flex; height: 100%; align-items: center; justify-content: center; border-left: 1px solid var(--border); padding: 12px; }
      .incident-card { margin-top: 16px; overflow: hidden; }
      .incident-grid { display: grid; grid-template-columns: repeat(3,1fr); }
      .incident { padding: 13px 15px; border-right: 1px solid var(--border); }
      .incident:last-child { border-right: 0; }
      .incident strong { display: block; font-size: 10px; }
      .incident span { display: block; margin-top: 4px; color: var(--muted-foreground); font-size: 9px; }

      .overlay { position: fixed; inset: 0; z-index: 80; background: rgba(15,23,42,.38); backdrop-filter: blur(2px); }
      .sheet {
        position: absolute; inset: 0 0 0 auto; display: flex; width: min(78vw, 1120px); flex-direction: column;
        background: var(--card); box-shadow: var(--shadow-4); animation: slide-in 250ms cubic-bezier(0,0,.2,1);
      }
      @keyframes slide-in { from { transform: translateX(28px); opacity: .5; } to { transform: translateX(0); opacity: 1; } }
      .overlay-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--border); padding: 18px 20px; }
      .overlay-head h2 { margin: 0; font-size: 17px; }
      .overlay-head p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 10px; }
      .close-btn { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); cursor: pointer; }
      .overlay-toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); }
      .overlay-table { flex: 1; overflow: auto; }
      .overlay-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding: 10px 16px; color: var(--muted-foreground); font-size: 10px; }

      /* Variant C — matrix + dialog */
      .status-matrix { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 14px; }
      .matrix-agent { padding: 14px; }
      .matrix-agent-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .matrix-agent-name { font-size: 11px; font-weight: 650; }
      .matrix-agent-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
      .matrix-cell { border-left: 2px solid var(--border); padding-left: 8px; }
      .matrix-cell span { display: block; color: var(--muted-foreground); font-size: 8px; }
      .matrix-cell strong { display: block; margin-top: 3px; font-size: 10px; }
      .monitor-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .matrix-pipeline { overflow: hidden; }
      .matrix-pipeline-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--border); }
      .matrix-pipeline-head strong { font-size: 12px; }
      .matrix-counts { display: grid; grid-template-columns: repeat(3,1fr); }
      .matrix-count { border-right: 1px solid var(--border); padding: 14px; text-align: center; }
      .matrix-count:last-child { border-right: 0; }
      .matrix-count span { display: block; color: var(--muted-foreground); font-size: 8px; }
      .matrix-count strong { display: block; margin-top: 4px; font-size: 22px; }
      .matrix-result { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); padding: 10px 14px; font-size: 9px; }
      .matrix-result span { color: var(--muted-foreground); }
      .matrix-action { padding: 10px 14px; border-top: 1px solid var(--border); }
      .matrix-action .button { width: 100%; }
      .signal-band { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
      .signal { padding: 11px 12px; }
      .signal span { display: block; color: var(--muted-foreground); font-size: 8px; }
      .signal strong { display: block; margin-top: 3px; font-size: 11px; }
      .dialog-wrap { display: grid; place-items: center; }
      .dialog {
        display: flex; width: min(92vw, 1180px); height: min(82vh, 760px); flex-direction: column;
        overflow: hidden; border-radius: var(--radius-xl); background: var(--card); box-shadow: var(--shadow-4);
        animation: dialog-in 200ms cubic-bezier(0,0,.2,1);
      }
      @keyframes dialog-in { from { transform: translateY(8px) scale(.985); opacity: .4; } to { transform: none; opacity: 1; } }

      /* Data ingestion center */
      .notice {
        display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px;
        border: 1px solid var(--running-border); border-radius: var(--radius-lg); background: var(--running-soft); padding: 12px 14px;
      }
      .notice strong { display: block; color: #1e40af; font-size: 11px; }
      .notice span { display: block; margin-top: 3px; color: #1d4ed8; font-size: 9px; }
      .tabs { display: flex; align-items: center; gap: 3px; border-bottom: 1px solid var(--border); }
      .tab { min-height: 42px; border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 0 14px; color: var(--muted-foreground); font-size: 11px; cursor: pointer; }
      .tab.active { border-bottom-color: var(--primary); color: var(--primary); font-weight: 650; }
      .collector-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px; }
      .collector-head h2 { margin: 0; font-size: 17px; }
      .collector-head p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 10px; }
      .config-body { padding: 16px 18px 18px; }
      .config-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
      .config-panel { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 15px; }
      .config-panel h3 { margin: 0 0 12px; font-size: 12px; }
      .field { margin-top: 12px; }
      .field label { display: block; margin-bottom: 5px; color: var(--muted-foreground); font-size: 9px; font-weight: 650; }
      .input-fake { min-height: 36px; border: 1px solid var(--border); border-radius: var(--radius-md); background: #fff; padding: 9px 10px; font-size: 10px; }
      .readiness { display: grid; gap: 8px; }
      .ready-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 10px; }
      .ready-row:last-child { border-bottom: 0; padding-bottom: 0; }

      /* Prototype switcher */
      .prototype-switcher {
        position: fixed; left: 50%; bottom: 16px; z-index: 120; display: flex; align-items: center; gap: 6px;
        transform: translateX(-50%); border: 1px solid #334155; border-radius: 999px; background: #0f172a;
        padding: 5px; color: white; box-shadow: 0 14px 34px -12px rgba(15,23,42,.55);
      }
      .switch-arrow { display: grid; width: 31px; height: 31px; place-items: center; border: 0; border-radius: 999px; background: #1e293b; color: white; cursor: pointer; }
      .switch-arrow:hover { background: #334155; }
      .switch-label { min-width: 190px; padding: 0 10px; text-align: center; }
      .switch-label strong { display: block; font-size: 10px; }
      .switch-label span { display: block; margin-top: 2px; color: #94a3b8; font-size: 8px; }

      @media (max-width: 1180px) {
        .pipeline-grid, .status-matrix, .monitor-matrix { grid-template-columns: 1fr; }
        .agent-grid { grid-template-columns: 1fr; }
        .agent-row { border-right: 0; border-bottom: 1px solid var(--border); }
        .agent-row:last-child { border-bottom: 0; }
        .cockpit { grid-template-columns: 1fr; }
        .agent-rail .rail-body { grid-template-columns: repeat(3,1fr); }
        .rail-agent { border-right: 1px solid var(--border); border-bottom: 0; }
        .rail-agent:last-child { border-right: 0; }
        .pipeline-row { grid-template-columns: minmax(170px,1fr) repeat(3,80px) 130px; }
      }
      @media (max-width: 820px) {
        :root { --sidebar-width: 72px; }
        .brand-copy, .sidebar-label, .nav-label, .nav-meta, .backend-copy { display: none; }
        .brand, .backend-state { justify-content: center; padding-inline: 10px; }
        .nav-item { justify-content: center; }
        .main { padding: 18px; }
        .page-head { flex-direction: column; }
        .head-actions { justify-content: flex-start; }
        .pipeline-row { grid-template-columns: 1fr; }
        .row-state, .row-action { border-top: 1px solid var(--border); border-left: 0; }
        .row-action { justify-content: flex-start; }
        .agent-rail .rail-body, .detail-summary, .signal-band { grid-template-columns: 1fr 1fr; }
        .config-grid { grid-template-columns: 1fr; }
        .sheet { width: 94vw; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const variants = [
        { key: 'A', name: '独立明细页', note: '推荐 · 宽表 / 筛选 / 分页最清晰' },
        { key: 'B', name: '右侧抽屉', note: '保留总览上下文 · 适合快速巡检' },
        { key: 'C', name: '居中弹层', note: '聚焦单次查看 · 页面切换最少' }
      ];
      const params = new URLSearchParams(location.search);
      let variant = variants.some((item) => item.key === params.get('variant')) ? params.get('variant') : 'A';
      let page = 'monitoring';
      let detailKind = null;
      let detailState = 'all';
      let overlayKind = null;

      const agents = [
        { name: 'Collector Agent', key: 'collector', version: 'collector.v1', status: 'running', raw: 'collecting', updated: '刚刚' },
        { name: 'Event Fact Extractor', key: 'event-fact-extractor', version: 'event-fact-extractor.v2', status: 'running', raw: 'running', updated: '6 秒前' },
        { name: 'Event Semantic Enricher', key: 'event-semantic-enricher', version: 'event-semantic-enricher.v3', status: 'idle', raw: 'idle', updated: '9 秒前' }
      ];
      const pipelines = [
        {
          key: 'collector', index: '01', title: '事件采集', subtitle: '执行对象：每次采集执行',
          success: 1, running: 0, failure: 2, total: 3,
          results: [['Accepted Artifact', 49], ['Raw Results', 149], ['Merged Results', 119]],
          source: '采集执行与业务结果统计'
        },
        {
          key: 'artifact', index: '02', title: 'Event 提取', subtitle: '执行对象：每个已接收内容',
          success: 98, running: 1, failure: 4, total: 103,
          results: [['Published', 76], ['正式 Event', 129], ['No Events', 22]],
          source: '提取执行、Event 结果与发布记录'
        },
        {
          key: 'semantic', index: '03', title: '事件语义', subtitle: '执行对象：每个 Event 的语义处理',
          success: 550, running: 1, failure: 1, total: 552,
          results: [['Submission', 551], ['Accepted', 227], ['Rejected', 323]],
          source: '语义处理与候选结果统计'
        }
      ];

      const rows = {
        collector: [
          ['collector-ae920a2f', '执行中', 'collecting', 'schedule', '15:20:00', '—', '49', '39', '20', '—'],
          ['collector-0a197304', '失败', 'partially_succeeded', 'schedule', '15:00:00', '34.2s', '50', '40', '20', 'connector_failed'],
          ['collector-754ed11c', '成功', 'succeeded', 'schedule', '14:40:00', '21.0s', '50', '40', '20', '—'],
          ['collector-0d71c920', '成功', 'succeeded', 'schedule', '14:20:00', '19.8s', '48', '38', '18', '—'],
          ['collector-3bf8c278', '成功', 'succeeded', 'schedule', '14:00:00', '22.1s', '50', '41', '21', '—']
        ],
        artifact: [
          ['extract-4f1a9d21', 'artifact-8d91', 'collector-ae920a2f', '执行中', 'running', '15:27:08', '—', '1', '0 / 0', '—'],
          ['extract-c83b2d90', 'artifact-48ca', 'collector-ae920a2f', '成功', 'published', '15:27:08', '18.5s', '2', '1 / 1', '—'],
          ['extract-1de285c4', 'artifact-d05b', 'collector-ae920a2f', '成功', 'no_events', '15:26:50', '10.2s', '0', '0 / 0', '—'],
          ['extract-7a921bb6', 'artifact-bf10', 'collector-0a197304', '失败', 'rejected', '15:02:48', '18.0s', '1', '0 / 0', 'event_fact_rejected'],
          ['extract-f0d149a3', 'artifact-7f21', 'collector-754ed11c', '失败', 'rejected', '14:55:26', '174.7s', '0', '0 / 0', 'tag_contract_invalid']
        ],
        semantic: [
          ['semantic-387a570e', 'event-f16dc489', 'eligible_event', '执行中', 'running', '15:27:05', '—', '1 / 2', '0', '0', '—'],
          ['semantic-809cf1d2', 'event-912fa70c', 'eligible_event', '成功', 'succeeded', '15:27:02', '6.0s', '1 / 2', '2', '0', '—'],
          ['semantic-6d5f33ba', 'event-a0c2816f', 'eligible_event', '成功', 'succeeded', '15:26:56', '5.8s', '1 / 2', '1', '1', '—'],
          ['semantic-e5f94d5b', 'event-4eb9c442', 'eligible_event', '失败', 'failed', '15:15:54', '12.0s', '1 / 2', '0', '0', 'INVALID_REQUEST'],
          ['semantic-2b1e907d', 'event-1fd84209', 'eligible_event', '成功', 'succeeded', '15:15:42', '6.2s', '1 / 2', '1', '0', '—']
        ]
      };

      const icon = (name) => {
        const paths = {
          database: '<ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
          monitor: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-7"/>',
          refresh: '<path d="M20 11a8 8 0 1 0-2 5.3"/><path d="M20 4v7h-7"/>',
          moon: '<path d="M20.5 14.5A8 8 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>',
          server: '<rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/>',
          arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
          back: '<path d="M19 12H5m6 6-6-6 6-6"/>',
          close: '<path d="m6 6 12 12M18 6 6 18"/>'
        };
        return `<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || ''}</svg>`;
      };

      function shell(content, title) {
        return `
          <div class="app">
            <aside class="sidebar">
              <div class="brand"><span class="brand-mark">潮</span><div class="brand-copy"><strong>观潮家 Admin</strong><span>Market intelligence ops</span></div></div>
              <div class="sidebar-body">
                <div class="sidebar-label">Workspace</div>
                <button class="nav-item ${page === 'data' ? 'active' : ''}" onclick="navigate('data')">${icon('database')}<span class="nav-label">数据采集中心</span><span class="nav-meta">Today</span></button>
                <button class="nav-item ${page === 'monitoring' ? 'active' : ''}" onclick="navigate('monitoring')">${icon('monitor')}<span class="nav-label">监控中心</span><span class="nav-meta">Live</span></button>
              </div>
              <div class="backend-state"><span class="backend-icon">${icon('server')}</span><div class="backend-copy"><strong>Admin Backend</strong><span>Connected</span></div></div>
            </aside>
            <div class="shell">
              <header class="topbar">
                <div class="topbar-title"><small>WORKSPACE / ${title}</small><strong>${title}</strong></div>
                <div class="top-actions"><button class="icon-btn" aria-label="切换主题">${icon('moon')}</button><span class="avatar">AD</span></div>
              </header>
              <main class="main"><div class="content">${content}</div></main>
            </div>
          </div>
          ${overlayKind ? renderOverlay() : ''}
          ${renderSwitcher()}
        `;
      }

      function pageHeader(title, description) {
        return `<div class="page-head"><div><span class="eyebrow">Pipeline execution monitor</span><h1>${title}</h1><p class="description">${description}</p></div><div class="head-actions"><select class="select" aria-label="监控时间范围"><option>最近 1 小时</option><option>最近 6 小时</option><option>最近 12 小时</option><option>最近 1 天</option></select><span class="refresh-note">自动刷新 15s</span><button class="button secondary">${icon('refresh')}刷新状态</button></div></div>`;
      }

      function agentBadge(status) {
        return status === 'running' ? '<span class="badge running">工作中</span>' : '<span class="badge success">空闲</span>';
      }

      function renderAgentOverview() {
        return `<section class="card agent-overview"><div class="section-head"><div><h2 class="section-title">Agent 运行状态</h2><p class="section-note">统一展示全部已注册 Agent 的当前状态；仅监控，不在此修改运行状态。</p></div><span class="badge success">3 个 Agent 正常</span></div><div class="agent-grid">${agents.map((agent) => `<article class="agent-row"><div><div class="agent-name"><span class="dot ${agent.status === 'running' ? 'running' : 'success'}"></span>${agent.name}</div><p class="agent-meta mono">${agent.version}</p></div><div class="agent-side">${agentBadge(agent.status)}<span>${agent.raw} · ${agent.updated}</span></div></article>`).join('')}</div></section>`;
      }

      function stateCell(pipeline, state, label) {
        const tone = state === 'success' ? 'success' : state === 'running' ? 'running' : 'danger';
        return `<button class="state-cell" onclick="openDetail('${pipeline.key}','${state}')"><span class="state-label">${label}</span><strong class="state-value ${tone}">${pipeline[state]}</strong></button>`;
      }

      function renderPipelineCards() {
        return `<div class="pipeline-grid">${pipelines.map((pipeline) => `<article class="card pipeline-card"><div class="pipeline-top"><div class="pipeline-title"><span class="pipeline-index">${pipeline.index}</span><div><h3>${pipeline.title}</h3><p>${pipeline.subtitle}</p></div></div><span class="total-pill">${pipeline.total} 次执行</span></div><div class="state-grid">${stateCell(pipeline,'success','成功')}${stateCell(pipeline,'running','执行中')}${stateCell(pipeline,'failure','失败')}</div><div class="result-list">${pipeline.results.map(([label,value]) => `<div class="result-item"><span>${label}</span><strong class="tabular">${value}</strong></div>`).join('')}</div><footer class="pipeline-action"><span class="data-source">${pipeline.source}</span><button class="link-button" onclick="openDetail('${pipeline.key}','all')">查看执行明细 →</button></footer></article>`).join('')}</div>`;
      }

      function overviewA() {
        return `${pageHeader('监控中心','Agent 状态与事件采集、Event 提取、事件语义统一监控；执行明细进入独立子页面。')}${renderAgentOverview()}${renderPipelineCards()}<div class="card health-strip"><strong>运行环境</strong><div class="health-metrics"><span class="health-metric"><span class="dot success"></span>Data Service <b>Ready</b></span><span class="health-metric"><span class="dot success"></span>AgentRun <b>Ready</b></span><span class="health-metric"><span class="dot success"></span>Qdrant <b>Green</b></span><span class="health-metric"><span class="dot success"></span>Neo4j <b>Online</b></span><span class="health-metric">当前版本 <b class="mono">8e2a842</b></span></div><span class="refresh-note">15:27:11 更新</span></div>`;
      }

      const detailTitles = { collector: '事件采集执行明细', artifact: 'Event 提取执行明细', semantic: '事件语义执行明细' };
      function detailPageA() {
        const pipeline = pipelines.find((item) => item.key === detailKind);
        return `<div class="breadcrumb"><button onclick="closeDetail()">监控中心</button><span>/</span><span>${detailTitles[detailKind]}</span></div><div class="page-head"><div><span class="eyebrow">Execution details</span><h1>${detailTitles[detailKind]}</h1><p class="description">独立工作区承载宽表、筛选、分页；返回后保留监控中心时间范围。</p></div><div class="head-actions"><button class="button secondary" onclick="closeDetail()">${icon('back')}返回监控中心</button><button class="button secondary">${icon('refresh')}刷新</button></div></div><div class="detail-summary"><div class="card detail-stat"><span>全部执行</span><strong>${pipeline.total}</strong></div><div class="card detail-stat"><span>成功</span><strong style="color:var(--success)">${pipeline.success}</strong></div><div class="card detail-stat"><span>执行中</span><strong style="color:var(--running)">${pipeline.running}</strong></div><div class="card detail-stat"><span>失败</span><strong style="color:var(--danger)">${pipeline.failure}</strong></div></div>${renderDetailCard(detailKind, true)}`;
      }

      function renderDetailCard(kind, fixed) {
        return `<section class="card detail-card"><div class="toolbar"><div class="filters"><div class="segmented">${['all','success','running','failure'].map((state) => `<button class="segment ${detailState === state ? 'active' : ''}" onclick="setDetailState('${state}')">${{all:'全部',success:'成功',running:'执行中',failure:'失败'}[state]}</button>`).join('')}</div><input class="search" aria-label="搜索执行 ID" placeholder="搜索执行 ID / Event ID" /><select class="select"><option>最新优先</option><option>最早优先</option></select></div><span class="refresh-note">共 ${rows[kind].length} 条示例记录</span></div><div class="${fixed ? 'table-shell' : 'overlay-table'}">${renderTable(kind)}</div><footer class="table-footer"><span>每页 20 条 · 保留原始状态枚举</span><div class="pagination"><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></footer></section>`;
      }

      function renderTable(kind) {
        const configs = {
          collector: ['采集执行 ID','主状态','原始枚举','触发来源','开始','耗时','Raw','Merged','Artifact','错误码'],
          artifact: ['提取记录 ID','内容 ID','采集执行 ID','主状态','原始枚举','更新时间','耗时','Event 候选','发布回执','错误码'],
          semantic: ['语义处理 ID','Event ID','触发来源','主状态','原始枚举','更新时间','耗时','尝试','Accepted','Rejected','错误码']
        };
        const visibleRows = rows[kind].filter((row) => {
          if (detailState === 'all') return true;
          const label = detailState === 'success' ? '成功' : detailState === 'running' ? '执行中' : '失败';
          return row.includes(label);
        });
        return `<table><thead><tr>${configs[kind].map((item) => `<th>${item}</th>`).join('')}</tr></thead><tbody>${visibleRows.map((row) => `<tr>${row.map((cell, index) => `<td class="${index < 3 ? 'id' : ''}">${cell === '成功' ? '<span class="badge success">成功</span>' : cell === '失败' ? '<span class="badge danger">失败</span>' : cell === '执行中' ? '<span class="badge running">执行中</span>' : cell}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${configs[kind].length}" style="height:120px;text-align:center;color:var(--muted-foreground)">当前筛选暂无执行记录</td></tr>`}</tbody></table>`;
      }

      function overviewB() {
        return `${pageHeader('监控中心','总览保持可见，执行明细从右侧抽屉进入；适合高频巡检。')}<div class="cockpit"><aside class="card agent-rail"><div class="section-head"><div><h2 class="section-title">Agent 运行状态</h2><p class="section-note">实时状态投影</p></div><span class="badge success">正常</span></div><div class="rail-body">${agents.map((agent) => `<div class="rail-agent"><div class="rail-agent-top"><span class="rail-agent-name"><span class="dot ${agent.status === 'running' ? 'running' : 'success'}"></span>${agent.name}</span>${agentBadge(agent.status)}</div><dl><dt>Version</dt><dd>${agent.version}</dd><dt>状态</dt><dd>${agent.raw}</dd><dt>更新</dt><dd>${agent.updated}</dd></dl></div>`).join('')}</div></aside><div><div class="pipeline-list">${pipelines.map((pipeline) => `<article class="card pipeline-row"><div class="row-name"><strong>${pipeline.index} · ${pipeline.title}</strong><span>${pipeline.subtitle}</span></div><div class="row-state"><span>成功</span><strong style="color:var(--success)">${pipeline.success}</strong></div><div class="row-state"><span>执行中</span><strong style="color:var(--running)">${pipeline.running}</strong></div><div class="row-state"><span>失败</span><strong style="color:var(--danger)">${pipeline.failure}</strong></div><div class="row-action"><button class="button secondary small" onclick="openOverlay('${pipeline.key}')">打开执行明细 ${icon('arrow')}</button></div></article>`).join('')}</div><section class="card incident-card"><div class="section-head"><div><h2 class="section-title">当前关注</h2><p class="section-note">不进入明细也能发现需要处理的运行信号</p></div><span class="refresh-note">最近 1 小时</span></div><div class="incident-grid"><div class="incident"><strong style="color:var(--danger)">Tavily 连续失败 2 次</strong><span>Collector 保持部分成功，其他连接器正常</span></div><div class="incident"><strong>语义回填 76.7% 待处理</strong><span>当前吞吐 9–10 Event / 分钟</span></div><div class="incident"><strong>提取队列持续下降</strong><span>Pending 29 · Running 1 · 无卡死</span></div></div></section></div></div>`;
      }

      function overviewC() {
        return `${pageHeader('监控中心','以状态矩阵快速扫描全局；执行明细在居中弹层中聚焦查看。')}<div class="status-matrix">${agents.map((agent) => `<article class="card matrix-agent"><div class="matrix-agent-top"><span class="matrix-agent-name">${agent.name}</span>${agentBadge(agent.status)}</div><div class="matrix-agent-body"><div class="matrix-cell"><span>Version</span><strong class="mono">${agent.version}</strong></div><div class="matrix-cell"><span>当前状态</span><strong>${agent.raw}</strong></div></div></article>`).join('')}</div><div class="monitor-matrix">${pipelines.map((pipeline) => `<article class="card matrix-pipeline"><div class="matrix-pipeline-head"><strong>${pipeline.title}</strong><span class="total-pill">${pipeline.total} 次</span></div><div class="matrix-counts"><div class="matrix-count"><span>成功</span><strong style="color:var(--success)">${pipeline.success}</strong></div><div class="matrix-count"><span>执行中</span><strong style="color:var(--running)">${pipeline.running}</strong></div><div class="matrix-count"><span>失败</span><strong style="color:var(--danger)">${pipeline.failure}</strong></div></div><div class="matrix-result"><span>${pipeline.results[0][0]}</span><strong>${pipeline.results[0][1]}</strong></div><div class="matrix-action"><button class="button secondary small" onclick="openOverlay('${pipeline.key}')">查看 ${pipeline.title}执行明细</button></div></article>`).join('')}</div><div class="signal-band"><div class="card signal"><span>Agent 健康</span><strong>3 / 3 正常</strong></div><div class="card signal"><span>服务状态</span><strong>Data / AgentRun Ready</strong></div><div class="card signal"><span>语义向量</span><strong>Qdrant Green</strong></div><div class="card signal"><span>产业图谱</span><strong>Neo4j Online</strong></div><div class="card signal"><span>刷新时间</span><strong>15:27:11</strong></div></div>`;
      }

      function renderOverlay() {
        const mode = variant === 'B' ? 'sheet' : 'dialog';
        return `<div class="overlay ${mode === 'dialog' ? 'dialog-wrap' : ''}" onclick="overlayBackdrop(event)"><section class="${mode}" role="dialog" aria-modal="true" aria-label="${detailTitles[overlayKind]}"><header class="overlay-head"><div><h2>${detailTitles[overlayKind]}</h2><p>${variant === 'B' ? '保留监控总览上下文，适合快速巡检后关闭。' : '弹层内完成筛选与分页，Esc 或右上角关闭。'}</p></div><button class="close-btn" onclick="closeOverlay()" aria-label="关闭">${icon('close')}</button></header><div class="overlay-toolbar"><div class="filters"><div class="segmented">${['all','success','running','failure'].map((state) => `<button class="segment ${detailState === state ? 'active' : ''}" onclick="setDetailState('${state}')">${{all:'全部',success:'成功',running:'执行中',failure:'失败'}[state]}</button>`).join('')}</div><input class="search" placeholder="搜索执行 ID / Event ID" /></div></div><div class="overlay-table">${renderTable(overlayKind)}</div><footer class="overlay-footer"><span>共 ${rows[overlayKind].length} 条示例记录 · 每页 20 条</span><div class="pagination"><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div></footer></section></div>`;
      }

      function dataCenter() {
        return `<div class="page-head"><div><span class="eyebrow">Data operations</span><h1>数据采集中心</h1><p class="description">管理采集数据、事件数据与采集器运行配置。</p></div></div><div class="notice"><div><strong>执行记录已统一到监控中心</strong><span>采集器配置只保留调度、模型和连接器配置，避免同一执行事实出现两个入口。</span></div><button class="button secondary small" onclick="navigate('monitoring')">前往监控中心 ${icon('arrow')}</button></div><section class="card"><div class="tabs"><button class="tab">原始数据</button><button class="tab">事件数据</button><button class="tab active">采集器配置</button></div><div class="collector-head"><div><h2>综合采集 Agent <span class="badge success">已启用</span></h2><p><span class="mono">collector</span> · <span class="mono">collector.v1</span></p></div><button class="button" style="background:var(--danger)">停止定时器</button></div><div class="tabs" style="padding:0 18px"><button class="tab active">定时配置</button><button class="tab">模型配置</button><button class="tab">连接器配置</button></div><div class="config-body"><div class="config-grid"><div class="config-panel"><h3>执行计划</h3><div class="field"><label>Collection Prompt</label><div class="input-fake">采集并归纳最新宏观、产业链与市场结构变化，形成可提取的原始材料。</div></div><div class="field"><label>调度策略</label><div class="input-fake mono">*/20 * * * *</div></div><div style="margin-top:14px"><button class="button small">保存配置</button></div></div><div class="config-panel"><h3>配置就绪</h3><div class="readiness"><div class="ready-row"><span>模型配置</span><span class="badge success">1 / 1</span></div><div class="ready-row"><span>连接器配置</span><span class="badge success">7 / 7</span></div><div class="ready-row"><span>定时器状态</span><span class="badge success">已启用</span></div><div class="ready-row"><span>下一次执行</span><strong class="mono">15:40:00</strong></div></div></div></div></div></section>`;
      }

      function renderSwitcher() {
        const index = variants.findIndex((item) => item.key === variant);
        const item = variants[index];
        return `<div class="prototype-switcher" aria-label="原型方案切换"><button class="switch-arrow" onclick="cycleVariant(-1)" aria-label="上一个方案">←</button><div class="switch-label"><strong>${item.key} — ${item.name}</strong><span>${item.note}</span></div><button class="switch-arrow" onclick="cycleVariant(1)" aria-label="下一个方案">→</button></div>`;
      }

      function render() {
        let content;
        let title;
        if (page === 'data') {
          content = dataCenter();
          title = '数据采集中心';
        } else {
          title = detailKind && variant === 'A' ? detailTitles[detailKind] : '监控中心';
          content = detailKind && variant === 'A' ? detailPageA() : variant === 'A' ? overviewA() : variant === 'B' ? overviewB() : overviewC();
        }
        document.getElementById('app').innerHTML = shell(content, title);
      }

      function navigate(next) { page = next; detailKind = null; overlayKind = null; render(); window.scrollTo(0,0); }
      function openDetail(kind, state) { detailKind = kind; detailState = state; page = 'monitoring'; render(); window.scrollTo(0,0); }
      function closeDetail() { detailKind = null; detailState = 'all'; render(); window.scrollTo(0,0); }
      function openOverlay(kind) { overlayKind = kind; detailState = 'all'; render(); }
      function closeOverlay() { overlayKind = null; render(); }
      function overlayBackdrop(event) { if (event.target.classList.contains('overlay')) closeOverlay(); }
      function setDetailState(state) { detailState = state; render(); }
      function cycleVariant(direction) {
        const index = variants.findIndex((item) => item.key === variant);
        variant = variants[(index + direction + variants.length) % variants.length].key;
        params.set('variant', variant);
        history.replaceState({}, '', `${location.pathname}?${params.toString()}`);
        detailKind = null; overlayKind = null; page = 'monitoring'; render(); window.scrollTo(0,0);
      }
      document.addEventListener('keydown', (event) => {
        const target = event.target;
        if (event.key === 'Escape' && overlayKind) { closeOverlay(); return; }
        if (target && (target.matches('input, textarea, select') || target.isContentEditable)) return;
        if (event.key === 'ArrowLeft') cycleVariant(-1);
        if (event.key === 'ArrowRight') cycleVariant(1);
      });
      render();
    </script>
  </body>
</html>
