openapi: 3.0.3
info:
  title: User Service
  version: 1.0.0
  description: Private service API. Caller Bearer identity is distinct from the user
    session token in JSON. Login tokens expire absolutely; no implicit refresh.
security:
  - serviceIdentity: []
paths:
  /api/user/v1/wechat/logins:
    post:
      operationId: wechat_logins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - result
                properties:
                  request_id:
                    type: string
                    format: uuid
                  result:
                    $ref: '#/components/schemas/LoginResult'
        '400':
          description: INVALID_REQUEST or WECHAT_CODE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: SERVICE_UNAUTHENTICATED or UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: USER_DISABLED or WECHAT_LOGIN_REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: LOGIN_RATE_LIMITED (login only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LOGIN_PROVIDER_UNAVAILABLE or USER_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/user/v1/sessions/verify:
    post:
      operationId: sessions_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - result
                properties:
                  request_id:
                    type: string
                    format: uuid
                  result:
                    $ref: '#/components/schemas/User'
        '400':
          description: INVALID_REQUEST or WECHAT_CODE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: SERVICE_UNAUTHENTICATED or UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: USER_DISABLED or WECHAT_LOGIN_REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: LOGIN_RATE_LIMITED (login only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LOGIN_PROVIDER_UNAVAILABLE or USER_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/user/v1/sessions/revoke:
    post:
      operationId: sessions_revoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - result
                properties:
                  request_id:
                    type: string
                    format: uuid
                  result:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
                        enum:
                          - true
        '400':
          description: INVALID_REQUEST or WECHAT_CODE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: SERVICE_UNAUTHENTICATED or UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: USER_DISABLED or WECHAT_LOGIN_REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: LOGIN_RATE_LIMITED (login only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LOGIN_PROVIDER_UNAVAILABLE or USER_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        '200':
          description: Healthy
        '503':
          description: Schema or database unavailable
  /readyz:
    get:
      operationId: readyz
      security: []
      responses:
        '200':
          description: Healthy
        '503':
          description: Schema or database unavailable
  /api/user/v1/profiles/nickname:
    post:
      operationId: profiles_nickname
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NicknameRequest'
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - result
                properties:
                  request_id:
                    type: string
                    format: uuid
                  result:
                    $ref: '#/components/schemas/User'
        '400':
          description: INVALID_REQUEST or INVALID_NICKNAME
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: SERVICE_UNAUTHENTICATED or UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: USER_DISABLED or WECHAT_LOGIN_REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: LOGIN_RATE_LIMITED (login only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LOGIN_PROVIDER_UNAVAILABLE or USER_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/user/v1/profiles/avatar:
    post:
      operationId: getCurrentUserAvatar
      summary: 读取当前登录用户头像，空字符串表示尚未设置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses:
        '200':
          description: '私有头像；Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required: [request_id, result]
                properties:
                  request_id: { type: string }
                  result:
                    type: object
                    required: [data, content_type]
                    properties:
                      data:
                        {
                          type: string,
                          format: byte,
                          maxLength: 174764,
                          description: 'JPEG base64，不含data URL前缀；未设置为空字符串'
                        }
                      content_type: { type: string, enum: ['image/jpeg'] }
        '401': { description: '未登录或会话无效' }
        '403': { description: '账号不可用' }
        '503': { description: '服务不可用' }
        '400': { description: '请求无效' }
components:
  securitySchemes:
    serviceIdentity:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      additionalProperties: false
      required:
        - user_id
        - status
        - expires_at
        - nickname
      properties:
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
        expires_at:
          type: string
          format: date-time
        session_token:
          type: string
          minLength: 43
          maxLength: 43
        nickname:
          type: string
          maxLength: 32
          description: 用户昵称，未设置时为空字符串；微信 code 登录不自动获取昵称。
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        phone_code:
          type: string
          maxLength: 512
          description: 可选微信手机号授权 code；提供时必须附 privacy_version。与 wx.login code 不同。
        privacy_version:
          type: string
          enum: ['2026-09-21', '2026-09-21.1']
          description: 用户明确同意的隐私政策版本；历史客户端可省略。
        code:
          type: string
          minLength: 1
          maxLength: 512
        previous_session_token:
          type: string
          minLength: 43
          maxLength: 43
    SessionRequest:
      type: object
      additionalProperties: false
      required:
        - session_token
      properties:
        session_token:
          type: string
          minLength: 43
          maxLength: 43
    Error:
      type: object
      required:
        - request_id
        - error
      properties:
        request_id:
          type: string
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    LoginResult:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - session_token
    NicknameRequest:
      type: object
      additionalProperties: false
      required:
        - session_token
        - nickname
      properties:
        avatar_data:
          type: string
          format: byte
          maxLength: 2796204
          description: 可选JPEG/PNG base64，原图不超过2MiB和2048x2048；省略保留原头像，与昵称原子保存。
        session_token:
          type: string
          minLength: 43
          maxLength: 43
        nickname:
          type: string
          minLength: 1
          maxLength: 32
