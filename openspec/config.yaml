schema: spec-driven

context: |
  工程：tidewise-ai-agentrun
  技术栈：Go、CloudWeGo Eino、OpenSpec 1.5.x
  目标：独立运行 AI 采集器、AI 事件提取器和 AI 投研报告分析师。
  工程约束：任何仓库写入先执行 eino-reference-first 三仓审计；开发 Leader 使用
  create_thread 委派独立执行 Agent和 Desktop-managed worktree；每个 change 使用
  codex/<change-name> 分支；行为变更执行 RED -> GREEN -> REFACTOR；生命周期为
  Explore -> Delegate -> Propose -> Leader Review -> Apply -> Validate -> Leader Acceptance ->
  Sync -> Archive -> Deliver -> Merge -> Cleanup。执行 Agent不得自行批准 Leader Review
  或 Leader Acceptance；用户控制 PR merge，执行 Agent在交付时提供 cleanup handoff，
  Merge/Cleanup 由主任务作为归档后的 operational state 跟踪。
  安全约束：.reference/cloudwego、.env、密钥和 data 运行产物不得提交。
  语言约束：中文优先。OpenSpec 固定结构标记、规范关键字、命令、路径、代码标识符
  和 capability 标识保持原始形式，其余 change 产物使用中文。

rules:
  proposal:
    - 使用中文说明 Why、What Changes、Capabilities 和 Impact，固定结构标题保持 OpenSpec 规范形式。
    - 明确范围、非目标、受影响 Agent、兼容性和主要风险。
    - 明确开发 Leader、执行 Agent、Leader Review、Leader Acceptance、用户 PR merge 和 cleanup handoff 的职责边界。
    - capability 名称使用稳定的 kebab-case，并与 specs 目录一致。
  design:
    - 使用中文记录上下文、目标、非目标、关键决策、替代方案、风险和迁移或回滚方式。
    - 涉及 Eino 时，记录 eino-ext、eino-examples、eino 三仓的参考结论和复用选择。
    - 新增数据库、队列、模型或外部服务时，说明必要性、成本、失败模式和替代方案。
    - 涉及委派式工作流时，说明 Merge/Cleanup 作为归档后的主任务 operational state，且不回写已归档 tasks。
  specs:
    - 正文和场景使用中文；Requirement、Scenario、WHEN/THEN、SHALL/MUST 等规范标记保持原文。
    - 每个 Requirement 至少包含一个可验证的 Scenario。
    - 要求描述可观察行为，不把具体实现步骤写成需求。
  tasks:
    - 使用中文并保持 OpenSpec checkbox 和编号结构。
    - 行为变更必须拆分 RED、GREEN、REFACTOR，并写明聚焦测试与全量验证命令。
    - 包含 Leader Review 和 Leader Acceptance 两个不可由执行 Agent自行批准的门禁。
    - 最终任务包含规格同步、归档、密钥检查、提交、推送、Pull Request 和 cleanup handoff；用户 Merge 与 Leader Cleanup 不得成为 archive-gating checkbox。
